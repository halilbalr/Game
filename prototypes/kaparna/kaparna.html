   Layout: helskärmsduk + tjocka tecknade HUD-element i hörnen (Clash-stil), pergamentpaneler i mitten. */
:root {
  --ink: #1d1526;
  --sea: #0d5f7e;
  --sea-deep: #083d52;
  --parch: #f7e8c4;
  --parch-dark: #e4c98f;
  --parch-text: #4a2c12;
  --wood: #a8743e;
  --wood-dark: #6e4521;
  --gold: #ffcf3a;
  --gold-deep: #c98a00;
  --white: #ffffff;
  --shade: rgba(14, 10, 22, .55);
  --g1: #9be85a; --g2: #47a51a;
  --r1: #ff8a6a; --r2: #d02f17;
  --b1: #7fd0ff; --b2: #1f79d0;
  --o1: #ffc06a; --o2: #e0730f;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--sea-deep); color: var(--white); }
body { font-family: var(--f-body); font-weight: 800; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }

.ol {
  color: var(--white);
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink),
    1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 3.5px 0 var(--ink);
}

/* ---------- knappar ---------- */
.btn {
  --c1: var(--g1); --c2: var(--g2);
  font-family: var(--f-display); font-size: 18px; letter-spacing: .02em; line-height: 1.1;
  padding: 9px 16px 11px; border: 3px solid var(--ink); border-radius: 14px; cursor: pointer;
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -5px 0 rgba(0,0,0,.2), 0 4px 0 var(--ink);
  transition: transform .07s, box-shadow .07s, filter .15s;
}
.btn:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.2), 0 1px 0 var(--ink); }
.btn:disabled { filter: grayscale(.9) brightness(.85); cursor: default; }
.btn:focus-visible, .btn-attack:focus-visible, .card:focus-visible, .btn-icon:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
.btn-green { --c1: var(--g1); --c2: var(--g2); }
.btn-red { --c1: var(--r1); --c2: var(--r2); }
.btn-blue { --c1: var(--b1); --c2: var(--b2); }
.btn-orange { --c1: var(--o1); --c2: var(--o2); }
.btn-xl { font-size: 34px; padding: 14px 46px 18px; border-radius: 20px; }
.btn .cost { display: inline-flex; align-items: center; gap: 4px; }
.btn .cost svg { width: 18px; height: 18px; }

/* ---------- titel ---------- */
.screen.title {

<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Är det roligt att kapa skepp med Clash-liknande anfall?
// Date: 2026-10-22
//
// Skeppsgeometri: skrovform, däcksrutor och placering av byggnader/barrikader.
(function () {
  const K = window.K;
  const S = (K.ship = {});

  // Skrovet som polygon i rutkoordinater (x längs skeppet, akter vid x=0, för vid x=len).
  S.hull = function (def) {
    const L = def.len, B = def.beam, bw = def.bow, r = 0.7;
    const pts = [];
    for (let i = 0; i <= 4; i++) {
      const a = Math.PI + (Math.PI / 2) * (i / 4);
      pts.push([r + Math.cos(a) * r, r + Math.sin(a) * r]);
    }
    const sx = L - bw, cx = L - bw * 0.3;
    const bez = (t) => (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * cx + t * t * L;
    for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push([bez(t), t * t * (B / 2)]); }
    for (let i = 11; i >= 0; i--) { const t = i / 12; pts.push([bez(t), B - t * t * (B / 2)]); }
    for (let i = 0; i <= 4; i++) {
      const a = Math.PI / 2 + (Math.PI / 2) * (i / 4);
      pts.push([r + Math.cos(a) * r, B - r + Math.sin(a) * r]);
    }
    return pts;
  };

  S.inPoly = function (pts, x, y) {
    let inside = false;

      }
      rows.push(r);
    }
    return rows.join('\n');
  };
})();

      rr(ctx, -2.5, -1.1, 4, 2.2, 1); ctx.fillStyle = G.col('#5a3416'); ctx.fill(); ctx.stroke();
    } else if (kind === 'batong') {
      rr(ctx, -2, -1.3, 13, 2.6, 1.2); ctx.fillStyle = G.col('#22252c'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
    } else if (kind === 'ankare') {
      G.thick(ctx, [0, 0], [17, 0], G.col('#8d99a6'), 3.4);
      G.thick(ctx, [2.5, -4.5], [2.5, 4.5], G.col('#8d99a6'), 2.6);
      ctx.beginPath(); ctx.arc(-1.8, 0, 2.3, 0, Math.PI * 2); ctx.lineWidth = 2.2; ctx.strokeStyle = G.col('#8d99a6'); ctx.stroke();
      ctx.beginPath(); ctx.arc(12.5, 0, 6, -1.35, 1.35); ctx.lineWidth = 6.2; ctx.strokeStyle = OUT; ctx.stroke();
      ctx.lineWidth = 3.4; ctx.strokeStyle = G.col('#8d99a6'); ctx.stroke();
      for (const s of [-1, 1]) {
        const ax = 12.5 + Math.cos(1.35 * s) * 6, ay = Math.sin(1.35 * s) * 6;
        G.poly(ctx, [[ax - 1.5, ay], [ax - 4, ay + 2.6 * s], [ax + 1.8, ay + 0.6 * s]], G.col('#a9b4bf'), OUT, 1.2);
      }
    }
  }

  // Ritar en figur med fötterna i (X, Y) (iso-pixlar). u: {type, facing, walk, moving, atkAnim, skin, flash, air, squash, rage, slow, scale}
  // Figurer ritas som platta "kort" mot kameran. unitScale > 1 i mobilvyn så de syns bättre.
  A.unitScale = 1;
  A.unit = function (ctx, u, X, Y, t) {
    const sp = SPEC[u.type] || SPEC.kampe;
    const s = sp.s * (u.scale || 1) * A.unitScale;
    if (!u.noShadow) G.shadow(ctx, X, Y, 9 * s, 4.2 * s, 0.28);
    if (u.rage > 0) {
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, 16 * s);
      g.addColorStop(0, 'rgba(255,80,220,.55)'); g.addColorStop(1, 'rgba(255,80,220,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(X, Y, 16 * s, 8 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    ctx.translate(X, Y - (u.air || 0));
    const sq = u.squash || 1;
    ctx.scale((u.facing || 1) * s * sq, s / sq);
    G.flash = u.flash > 0 ? Math.min(1, u.flash * 7) : 0;
    body(ctx, sp, u, t);
    G.flash = 0;
    ctx.restore();
  };

  function body(ctx, sp, u, t) {
    const moving = u.moving, w = u.walk || 0;
    const bob = moving ? -Math.abs(Math.sin(w)) * 2.2 : Math.sin(t * 3 + (u.id || 0)) * 0.5;
    const l1 = moving ? Math.sin(w) * 3.2 : 0;
    const lift1 = moving ? Math.max(0, Math.cos(w)) * 1.8 : 0;
    const lift2 = moving ? Math.max(0, -Math.cos(w)) * 1.8 : 0;
    const bw = sp.big ? 9.5 : sp.chubby ? 8.6 : sp.thin ? 6.4 : 7.5;
    const skin = u.skin || '#7a4a2a';
    const ap = u.atkAnim > 0 ? 1 - u.atkAnim / 0.35 : -1;
    const by = -15 + bob;

    leg(ctx, -2.6 - l1 * 0.6, lift2, sp.pants);
    leg(ctx, 2.6 + l1 * 0.6, lift1, sp.pants);

    if (sp.sack) {
      G.blob(ctx, -7, by - 1, 6, 6.8, G.col('#9a6b3c'));
      G.blob(ctx, -7, by - 7.5, 2.2, 1.4, G.col('#7a4f28'), OUT, 1);
      G.blob(ctx, -8.5, by + 1, 1.6, 1.6, G.col('#ffd23f'), OUT, 0.8);
    }
    // bakre arm
    if (sp.weapon !== 'bomb') G.blob(ctx, -bw + 0.6, by + 3, 2.7, 2.7, G.col(skin), OUT, 1.3);

    if (sp.coat) G.poly(ctx, [[-bw - 0.5, by - 2], [bw + 0.5, by - 2], [bw + 2.5, by + 11], [-bw - 2.5, by + 11]], G.col(sp.shirt, -0.12), OUT, 1.4);
    G.blob(ctx, 0, by, bw, 7.4, G.col(sp.shirt), OUT, 1.5);
    if (sp.stripe || sp.vest) {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, by, bw - 0.6, 6.8, 0, 0, Math.PI * 2); ctx.clip();
      if (sp.stripe) { ctx.fillStyle = G.col(sp.stripe); for (let i = 0; i < 4; i++) ctx.fillRect(-bw, by - 6.5 + i * 3.8, 2 * bw, 1.7); }
      if (sp.vest) { ctx.fillStyle = G.col(sp.vest); ctx.fillRect(-bw, by - 8, bw * 0.95, 16); ctx.fillRect(bw * 0.38, by - 8, bw, 16); }
      ctx.restore();
    }
    if (sp.coat) {
      G.blob(ctx, 3, by - 2.5, 1.2, 1.2, G.col('#ffcf3a'), OUT, 0.8);
      G.blob(ctx, 3, by + 1.5, 1.2, 1.2, G.col('#ffcf3a'), OUT, 0.8);
      ctx.strokeStyle = G.col('#ffcf3a'); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-bw - 2.2, by + 10.5); ctx.lineTo(bw + 2.2, by + 10.5); ctx.stroke();
    }
    if (sp.collar) G.poly(ctx, [[-4, by - 6.8], [5, by - 6.8], [0.5, by - 2]], G.col(sp.collar), OUT, 1.1);
    ctx.fillStyle = G.col('#3b2412'); ctx.fillRect(-bw + 0.9, by + 2.6, 2 * bw - 1.8, 2.4);
    ctx.fillStyle = G.col('#f2c14e'); ctx.fillRect(0.6, by + 2.3, 3, 3);

    // huvud
    const hr = sp.big ? 7.8 : 8.6, hx = 1.6, hy = by - 11.2;
    if (sp.weapon === 'bomb') for (const sx of [-1, 1]) G.thick(ctx, [sx * (bw - 2.5), by - 4], [1.5 + sx * 8.5, hy - hr - 4], G.col(skin), 4);
    if (sp.head === 'bandana') {
      const fl = Math.sin(t * 9 + (u.id || 0)) * 1.5;
      G.poly(ctx, [[hx - hr + 1.5, hy - 4], [hx - hr - 6, hy - 6 + fl], [hx - hr - 4.5, hy - 1.5 + fl], [hx - hr + 1.5, hy - 1.8]], G.col(sp.hat), OUT, 1.2);
    }
    if (sp.head === 'tricorn') {
      ctx.beginPath(); ctx.moveTo(hx - 3, hy - 11); ctx.quadraticCurveTo(hx - 12, hy - 22, hx - 18, hy - 14);
      ctx.quadraticCurveTo(hx - 10, hy - 15, hx - 1, hy - 9); ctx.closePath();
      ctx.fillStyle = G.col('#ffffff'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
    }
    if (sp.head === 'turban') G.poly(ctx, [[hx - hr + 1, hy - 3], [hx - hr - 4, hy + 4], [hx - hr + 2, hy + 1]], G.col(sp.hat, -0.06), OUT, 1.1);

    G.blob(ctx, hx, hy, hr, hr, G.col(skin), OUT, 1.6);
    G.blob(ctx, hx - 3.6, hy + 0.6, 1.8, 2.3, G.col(skin, -0.14), OUT, 1.1);
    if (sp.gold) G.blob(ctx, hx - 3.4, hy + 3.4, 1, 1, G.col('#ffcf3a'), OUT, 0.6);

    if (sp.beard) {
      ctx.beginPath(); ctx.ellipse(hx + 2.4, hy + 5, 6, 4.2, 0, 0, Math.PI);
      ctx.lineTo(hx - 3.6, hy + 2.5); ctx.closePath();
      ctx.fillStyle = G.col(sp.beard); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
    }
    // ansikte
    G.blob(ctx, hx + 8.3, hy + 0.9, 1.7, 1.4, G.col(skin, -0.1), OUT, 1);
    for (const ex of [hx + 2.7, hx + 6.2]) {
      G.blob(ctx, ex, hy - 0.4, 1.9, 2.4, '#ffffff', OUT, 1);
      G.blob(ctx, ex + 0.75, hy - 0.2, 1.1, 1.3, '#16121c', null);
    }
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx + 0.9, hy - 3.8); ctx.lineTo(hx + 4.1, hy - 2.6);
    ctx.moveTo(hx + 5.0, hy - 2.7); ctx.lineTo(hx + 8.1, hy - 3.9); ctx.stroke();
    if (ap >= 0 || u.yell) {
      G.blob(ctx, hx + 5, hy + 4.2, 2.2, 1.9, '#5a1414', OUT, 1);
      ctx.fillStyle = '#fff'; ctx.fillRect(hx + 3.6, hy + 2.6, 2.8, 0.9);
    } else {
      ctx.beginPath(); ctx.moveTo(hx + 3.2, hy + 3.5); ctx.quadraticCurveTo(hx + 5.2, hy + 5.4, hx + 7.4, hy + 3.2);
      ctx.lineWidth = 1.3; ctx.stroke();
    }

    // huvudbonad
    if (sp.head === 'bandana') {
      ctx.beginPath(); ctx.arc(hx, hy, hr + 0.7, Math.PI, Math.PI * 2);
      ctx.quadraticCurveTo(hx, hy - 3.4, hx - hr - 0.7, hy); ctx.closePath();
      ctx.fillStyle = G.col(sp.hat); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = OUT; ctx.stroke();
      if (sp.dots) { ctx.fillStyle = 'rgba(255,255,255,.85)'; for (const [dx, dy] of [[-3, -5.5], [2, -6.6], [5.6, -4.2]]) { ctx.beginPath(); ctx.arc(hx + dx, hy + dy, 1, 0, 7); ctx.fill(); } }
    } else if (sp.head === 'turban') {
      ctx.beginPath(); ctx.ellipse(hx - 0.3, hy - 5, hr + 1.8, 5.8, 0, 0, Math.PI * 2);
      ctx.fillStyle = G.col(sp.hat); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = OUT; ctx.stroke();
      ctx.strokeStyle = G.col(sp.hat, -0.25); ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(hx - 0.3, hy - 4, hr + 0.6, 3.2, -0.15, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(hx - 0.3, hy - 7, hr - 1, 2.6, 0.15, 0.3, Math.PI - 0.3); ctx.stroke();
    } else if (sp.head === 'bald') {
      G.blob(ctx, hx + 2, hy - 5, 2.6, 1.6, 'rgba(255,255,255,.35)', null);
    } else if (sp.head === 'tricorn') {
      G.blob(ctx, hx, hy - 6.3, hr + 5, 3.6, G.col('#1f1a24'), OUT, 1.5);
      ctx.beginPath(); ctx.arc(hx, hy - 6.5, hr * 0.82, Math.PI, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = G.col('#1f1a24'); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(hx, hy - 6.3, hr + 4, 2.6, 0, 0.1, Math.PI - 0.1);
      ctx.strokeStyle = G.col('#ffcf3a'); ctx.lineWidth = 1.3; ctx.stroke();
      G.blob(ctx, hx + 2, hy - 10.2, 1.8, 1.6, '#f4f4f4', OUT, 0.8);
    } else if (sp.head === 'cap') {
      ctx.beginPath(); ctx.arc(hx, hy - 1, hr + 0.4, Math.PI, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = G.col(sp.hat); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = OUT; ctx.stroke();
      G.blob(ctx, hx + hr * 0.7, hy - 1.4, 6, 1.8, G.col(sp.hat, -0.3), OUT, 1.2);
      G.blob(ctx, hx + 1, hy - 5.5, 1.4, 1.4, G.col('#ffcf3a'), OUT, 0.8);
    } else if (sp.head === 'sailor') {
      G.blob(ctx, hx, hy - 6.8, hr + 1, 3, G.col(sp.hat), OUT, 1.4);
      ctx.strokeStyle = G.col('#2c5aa0'); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(hx, hy - 6, hr, 1.6, 0, 0.15, Math.PI - 0.15); ctx.stroke();
    }

    // främre arm + vapen
    if (sp.weapon === 'bomb') {
      const bxp = 1.5, byp = hy - hr - 8.5;
      G.blob(ctx, bxp, byp, 7.5, 7.2, G.col('#2a2a33'), OUT, 1.6);
      G.blob(ctx, bxp - 2.4, byp - 2.6, 2.2, 1.6, 'rgba(255,255,255,.45)', null);
      ctx.beginPath(); ctx.moveTo(bxp + 3, byp - 6); ctx.quadraticCurveTo(bxp + 6, byp - 11, bxp + 9, byp - 10);
      ctx.strokeStyle = G.col('#c9a26b'); ctx.lineWidth = 1.6; ctx.stroke();
      const f = 2 + Math.sin(t * 40) * 1.2;
      G.blob(ctx, bxp + 9, byp - 10, f + 1, f + 1, '#ffd23f', null);
      G.blob(ctx, bxp + 9, byp - 10, f * 0.5, f * 0.5, '#ffffff', null);
      for (const sx of [-1, 1]) G.blob(ctx, bxp + sx * 8.5, byp + 4.5, 2.7, 2.7, G.col(skin), OUT, 1.2);
      return;
    }
    const shx = 2.5, shy = by - 4;
    let ang;
    if (sp.weapon === 'musket') ang = 0.4;
    else {
      ang = 1.05 + (moving ? Math.sin(w) * 0.25 : 0);
      if (ap >= 0) ang = ap < 0.4 ? lerp(1.05, -2.0, ap / 0.4) : lerp(-2.0, 1.3, Math.min(1, (ap - 0.4) / 0.25));
    }
    const al = 7.5;
    const hxp = shx + Math.cos(ang) * al, hyp = shy + Math.sin(ang) * al;
    G.thick(ctx, [shx, shy], [hxp, hyp], G.col(skin), 4.2);
    ctx.save();
    if (sp.weapon === 'musket') {
      const rec = ap >= 0 && ap < 0.3 ? (1 - ap / 0.3) : 0;
      ctx.translate(hxp - 2 - rec * 2, hyp);
      ctx.rotate(-0.12 - rec * 0.25);
      G.poly(ctx, [[-10, -0.6], [2, -2.2], [2, 2], [-10, 3.6]], G.col('#7a4a24'), OUT, 1.2);
      rr(ctx, 2, -2.4, 17, 2.6, 1); ctx.fillStyle = G.col('#4a5560'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
      if (rec > 0.3) {
        ctx.fillStyle = '#fff3a0';
        ctx.beginPath(); ctx.moveTo(19, -1); ctx.lineTo(26, -4); ctx.lineTo(23, -1); ctx.lineTo(27, 2); ctx.lineTo(19, 0.5); ctx.closePath(); ctx.fill();
      }
      G.blob(ctx, 6, 1.2, 2.5, 2.5, G.col(skin), OUT, 1.2);
    } else {
      ctx.translate(hxp, hyp);
      ctx.rotate(ang - 0.5);
      weapon(ctx, sp.weapon, sp, ap);
    }
    ctx.restore();
    G.blob(ctx, hxp, hyp, 2.7, 2.7, G.col(skin), OUT, 1.3);
    if (u.slow > 0) {
      ctx.fillStyle = 'rgba(120,200,255,.9)';
      for (let i = 0; i < 3; i++) {
        const a = t * 4 + i * 2.1;
        ctx.beginPath(); ctx.arc(hx + Math.cos(a) * 10, hy - 6 + Math.sin(a * 1.3) * 3, 1.4, 0, 7); ctx.fill();
      }
    }
  }

  // Livsmätare
  A.hpBar = function (ctx, X, Y, frac, color, w = 26) {
    const h = 5;
    rr(ctx, X - w / 2 - 1.5, Y - 1.5, w + 3, h + 3, 3);
    ctx.fillStyle = 'rgba(20,14,28,.85)'; ctx.fill();
    if (frac > 0) {
      rr(ctx, X - w / 2, Y, Math.max(2, w * frac), h, 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(X - w / 2 + 1, Y + 0.6, Math.max(0, w * frac - 2), 1.4);
    }
  };

  A.crown = function (ctx, X, Y) {
    G.poly(ctx, [[X - 6, Y], [X - 6, Y - 6], [X - 3, Y - 3], [X, Y - 8], [X + 3, Y - 3], [X + 6, Y - 6], [X + 6, Y]], '#ffcf3a', OUT, 1.2);
  };

  // ---------- flaggor ----------
  A.flag = function (ctx, X, Y, colors, t, size = 1) {
    const w = 22 * size, h = 14 * size;
    G.thick(ctx, [X, Y + 2], [X, Y + 34 * size], '#d9dde2', 2.2 * size);
    G.blob(ctx, X, Y, 2.2 * size, 2.2 * size, '#ffcf3a', OUT, 1);
    const pts = [];
    const N = 7;
    for (let i = 0; i <= N; i++) { const f = i / N; pts.push([X + f * w, Y + 2 + Math.sin(t * 6 - f * 4) * 2.4 * f * size]); }
    const top = pts, bot = pts.map(([x, y]) => [x, y + h]).reverse();
    G.path(ctx, top.concat(bot));
    ctx.save(); ctx.clip();
    if (colors === 'pirate') {
      ctx.fillStyle = '#16121c'; ctx.fillRect(X - 2, Y - 6, w + 4, h + 14);
      const cx = X + w * 0.5, cy = Y + 2 + h * 0.5 + Math.sin(t * 6 - 2) * 1.2 * size;
      ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 1.6 * size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx - 6 * size, cy + 5 * size); ctx.lineTo(cx + 6 * size, cy - 1 * size);
      ctx.moveTo(cx + 6 * size, cy + 5 * size); ctx.lineTo(cx - 6 * size, cy - 1 * size); ctx.stroke();
      G.blob(ctx, cx, cy - 1 * size, 4 * size, 3.6 * size, '#f4f4f4', null);
      ctx.fillStyle = '#16121c';
      ctx.beginPath(); ctx.arc(cx - 1.5 * size, cy - 1.2 * size, 1 * size, 0, 7); ctx.arc(cx + 1.5 * size, cy - 1.2 * size, 1 * size, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = colors[0]; ctx.fillRect(X - 2, Y - 6, w + 4, h + 14);
      ctx.fillStyle = colors[1]; ctx.fillRect(X - 2, Y + 2 + h * 0.5 - 1, w + 4, h);
      G.blob(ctx, X + w * 0.32, Y + 2 + h * 0.5, 3 * size, 3 * size, colors[1], null);
    }
    ctx.restore();
    G.path(ctx, top.concat(bot)); ctx.lineWidth = 1.3; ctx.strokeStyle = OUT; ctx.stroke();
  };

  // ---------- skiff ----------
  A.skiff = function (ctx, sk, t, water) {
    const z = water + 2 + Math.sin(t * 3 + sk.seed) * 1.2;
    const c = Math.cos(sk.ang), s = Math.sin(sk.ang);
    const loc = [[0.85, 0], [0.35, 0.3], [-0.6, 0.3], [-0.72, 0.15], [-0.72, -0.15], [-0.6, -0.3], [0.35, -0.3]];
    const wp = (lx, ly, zz) => P(sk.x + lx * c - ly * s, sk.y + lx * s + ly * c, zz);
    if (sk.moving) {
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      G.path(ctx, [wp(-0.6, 0.32, water), wp(-1.8, 0.75, water), wp(-1.8, -0.75, water), wp(-0.6, -0.32, water)]); ctx.fill();
    }
    G.poly(ctx, loc.map(([x, y]) => wp(x * 1.05, y * 1.15, water)), 'rgba(255,255,255,.35)', null);
    G.poly(ctx, loc.map(([x, y]) => wp(x, y, z - 5)), G.col(sk.color || '#2f7fd1', -0.25), OUT, 1.4);
    G.poly(ctx, loc.map(([x, y]) => wp(x, y, z)), G.col('#f4f6f8'), OUT, 1.5);
    G.poly(ctx, loc.map(([x, y]) => wp(x * 0.82, y * 0.7, z)), G.col('#c9d3dc'), null);
    const m0 = wp(-0.72, 0, z), m1 = wp(-0.95, 0, z + 9);
    G.thick(ctx, m0, m1, '#2a2d34', 5);
    G.blob(ctx, m1[0], m1[1], 3.4, 3, '#2a2d34', OUT, 1.2);
    return wp(0.05, 0, z);
  };

  // ---------- partiklar ----------
  A.particle = function (ctx, p) {
    const [X, Y] = P(p.x, p.y, p.z);
    const f = p.life / p.max; // 1 -> 0
    switch (p.type) {
      case 'smoke': case 'dust': case 'poof': {
        const r = p.size * (1.6 - f * 0.6);
        ctx.globalAlpha = Math.min(1, f * 1.4) * (p.alpha || 0.8);
        G.blob(ctx, X, Y, r, r * 0.92, p.color, null);
        ctx.globalAlpha = 1; break;
      }
      case 'fire': {
        ctx.globalCompositeOperation = 'lighter';
        const r = p.size * (0.4 + f * 0.8);
        ctx.globalAlpha = f;
        G.blob(ctx, X, Y, r, r * 1.2, f > 0.5 ? '#ffd23f' : '#ff6a1c', null);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; break;
      }
      case 'flash': {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = f;
        const g = ctx.createRadialGradient(X, Y, 0, X, Y, p.size);
        g.addColorStop(0, 'rgba(255,250,200,1)'); g.addColorStop(0.4, 'rgba(255,190,60,.8)'); g.addColorStop(1, 'rgba(255,120,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, p.size, 0, 7); ctx.fill();
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; break;
      }
      case 'spark': {
        ctx.strokeStyle = p.color || '#ffd23f'; ctx.lineWidth = 2; ctx.globalAlpha = f;
        const [X2, Y2] = P(p.x - p.vx * 0.04, p.y - p.vy * 0.04, p.z - p.vz * 0.04);
        ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X2, Y2); ctx.stroke(); ctx.globalAlpha = 1; break;
      }
      case 'debris': {
        ctx.globalAlpha = Math.min(1, f * 3);
        ctx.save(); ctx.translate(X, Y); ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color; ctx.strokeStyle = OUT; ctx.lineWidth = 1;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7); ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore(); ctx.globalAlpha = 1; break;
      }
      case 'water': {
        ctx.globalAlpha = Math.min(1, f * 2);
        G.blob(ctx, X, Y, p.size, p.size, p.color || '#bfe9ff', null);
        ctx.globalAlpha = 1; break;
      }
      case 'ring': {
        const r = p.size * (1 - f) + 2;
        ctx.globalAlpha = f; ctx.strokeStyle = p.color || '#fff'; ctx.lineWidth = 3 * f + 1;
        ctx.beginPath(); ctx.ellipse(X, Y, (r * G.SX) / 32, (r * G.SY) / 32, 0, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; break;
      }
      case 'coin': {
        ctx.globalAlpha = Math.min(1, f * 3);
        const sx = Math.abs(Math.cos(p.rot || 0)) * 4 + 0.6;
        G.blob(ctx, X, Y, sx, 4.4, '#ffcf3a', OUT, 1.2);
        ctx.globalAlpha = 1; break;
      }

    for (const [x, y] of [[b.x + 0.15, b.y + 0.15], [b.x + b.w - 0.15, b.y + 0.15], [b.x + 0.15, b.y + b.h - 0.15], [b.x + b.w - 0.15, b.y + b.h - 0.15]])
      G.line(ctx, P(x, y, top + 6), P(x, y, top + 30), '#5a3a20', 2);
    const rB = P(b.x + b.w - 0.05, b.y + 0.05, top + 30), rC = P(b.x + b.w - 0.05, b.y + b.h - 0.05, top + 30), rD = P(b.x + 0.05, b.y + b.h - 0.05, top + 30);
    const apex = P(cx, cy, top + 46);
    G.poly(ctx, [rD, rC, apex], G.col('#c8402e', -0.25));
    G.poly(ctx, [rC, rB, apex], G.col('#c8402e', 0));
  };

  B.morsare = function (ctx, b, sh, t) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const bags = [];
    for (let k = 0; k < 12; k++) { const a = (k / 12) * Math.PI * 2; bags.push([cx + Math.cos(a) * 0.74, cy + Math.sin(a) * 0.74, G.depth(Math.cos(a), Math.sin(a))]); }
    bags.sort((p, q) => p[2] - q[2]);
    const drawBags = (front) => {
      for (const [x, y, d] of bags) {
        if ((d > 0) !== front) continue;
        for (const z of [5, 12]) { const [X, Y] = P(x, y, z); G.blob(ctx, X, Y, 9, 5.5, G.col('#d8c08a', z > 6 ? 0.05 : -0.12), OUT, 1.3); }
      }
    };
    drawBags(false);
    G.disc(ctx, cx, cy, 0.5, 4, G.col('#6d6150'), null);
    const ang = b.ang || 0;
    const a = P(cx, cy, 8), e = P(cx + Math.cos(ang) * 0.32, cy + Math.sin(ang) * 0.32, 30 - (b.recoil || 0) * 5);
    G.thick(ctx, a, e, G.col('#3b4148'), 14);
    G.blob(ctx, e[0], e[1], 7.5, 4.2, G.col('#1d2126'), OUT, 1.5);
    drawBags(true);
  };

  B.vaktkur = function (ctx, b, sh, t) {
    const x0 = b.x + 0.2, y0 = b.y + 0.2, x1 = b.x + b.w - 0.2, y1 = b.y + b.h - 0.2;
    const wall = sh.def.guardType === 'matros' ? '#9aa6b1' : '#7f9fc0';
    G.box(ctx, x0, y0, x1, y1, 0, 32, wall);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    G.poly(ctx, [P(cx - 0.28, y1, 22), P(cx + 0.28, y1, 22), P(cx + 0.28, y1, 0), P(cx - 0.28, y1, 0)], b.alarm ? '#141a22' : G.col('#3b4a5c'), OUT, 1.3);
    G.poly(ctx, [P(x1, cy - 0.32, 26), P(x1, cy + 0.32, 26), P(x1, cy + 0.32, 14), P(x1, cy - 0.32, 14)], G.col('#cfe8ff'), OUT, 1.3);
    G.box(ctx, x0 - 0.12, y0 - 0.12, x1 + 0.12, y1 + 0.12, 32, 38, '#3c5c80');
    const on = b.alarm && Math.sin(t * 14) > 0;
    G.cyl(ctx, cx, cy, 0.17, 38, 47, on ? '#ff3b3b' : '#8a2a2a', { lw: 1.2 });
    if (on) {
      const [X, Y] = P(cx, cy, 44);
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, 26);
      g.addColorStop(0, 'rgba(255,60,60,.6)'); g.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, 26, 0, 7); ctx.fill();
    }
    // sköld-skylt
    const [SX, SY] = P(x1, cy - 0.62, 26);
    G.poly(ctx, [[SX - 4, SY - 5], [SX + 4, SY - 7], [SX + 4, SY], [SX, SY + 4], [SX - 4, SY + 2]], G.col('#f2c14e'), OUT, 1.1);
  };

  B.container = function (ctx, b, sh, t) {
    const col = b.color || '#c8402e';
    const x0 = b.x + 0.08, y0 = b.y + 0.08, x1 = b.x + b.w - 0.08, y1 = b.y + b.h - 0.08;
    for (let s = 0; s < b.stack; s++) {
      const z0 = s * 26, z1 = z0 + 25;
      const base = s === 1 ? shiftHue(col) : col;
      G.box(ctx, x0, y0, x1, y1, z0, z1, base);
      ctx.strokeStyle = G.rgba('#000000', 0.22); ctx.lineWidth = 1;
      ctx.beginPath();
      for (let y = y0 + 0.2; y < y1 - 0.05; y += 0.22) { const a = P(x1, y, z0 + 3), e = P(x1, y, z1 - 3); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]); }
      for (let x = x0 + 0.2; x < x1 - 0.05; x += 0.22) { const a = P(x, y1, z0 + 3), e = P(x, y1, z1 - 3); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]); }
      ctx.stroke();
    }
  };
  function shiftHue(hex) {
    const map = { '#c8402e': '#2f7fd1', '#2f7fd1': '#e8b021', '#3aa357': '#c8402e', '#e8b021': '#3aa357', '#e2632b': '#8a4fd1', '#8a4fd1': '#3aa357' };
    return map[hex] || '#e2632b';
  }

  B.kista = function (ctx, b, sh, t) {
    const x0 = b.x + 0.25, y0 = b.y + 0.25, x1 = b.x + b.w - 0.25, y1 = b.y + b.h - 0.25;
    G.box(ctx, x0, y0, x1, y1, 0, 20, '#8a5a2b');
    ctx.strokeStyle = G.col('#f2c14e'); ctx.lineWidth = 2.6; ctx.lineCap = 'butt';
    ctx.beginPath();
    for (const fx of [0.28, 0.72]) {
      const x = lerp(x0, x1, fx); let a = P(x, y1, 1), e = P(x, y1, 19); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]);
      const y = lerp(y0, y1, fx); a = P(x1, y, 1); e = P(x1, y, 19); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]);
    }
    ctx.stroke();
    G.box(ctx, x0 - 0.04, y0 - 0.04, x1 + 0.04, y1 + 0.04, 20, 27, '#9b6633', { top: 0.12 });
    const lf = b.lootTotal ? Math.max(0, b.lootLeft / b.lootTotal) : 1;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    if (lf > 0.02) {
      const [X, Y] = P(cx, cy, 30);
      const glow = 0.35 + Math.sin(t * 3 + b.id) * 0.12;
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, 30);
      g.addColorStop(0, `rgba(255,220,90,${glow})`); g.addColorStop(1, 'rgba(255,220,90,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, 30, 0, 7); ctx.fill();
      const r = G.rng(b.seed + 3);
      const n = Math.ceil(9 * lf);
      for (let i = 0; i < n; i++) {
        const px = lerp(x0 + 0.15, x1 - 0.15, r()), py = lerp(y0 + 0.15, y1 - 0.15, r());
        const [CX, CY] = P(px, py, 28 + r() * 5 * lf);
        G.blob(ctx, CX, CY, 4.2, 2.4, G.col('#ffcf3a'), OUT, 1);
      }
    }
    const [LX, LY] = P(cx, y1, 15);
    ctx.fillStyle = G.col('#f2c14e'); ctx.fillRect(LX - 3, LY - 4, 6, 6); ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.strokeRect(LX - 3, LY - 4, 6, 6);
  };

  B.fisklada = function (ctx, b, sh, t) {
    const y0 = b.y + 0.12, y1 = b.y + b.h - 0.12;
    const crate = (xa, xb, ya, yb, z0, z1) => {
      G.box(ctx, xa, ya, xb, yb, z0, z1, '#c79a5b');
      G.poly(ctx, [P(xa + 0.08, ya + 0.08, z1), P(xb - 0.08, ya + 0.08, z1), P(xb - 0.08, yb - 0.08, z1), P(xa + 0.08, yb - 0.08, z1)], G.col('#cdeefb'), null);
    };
    crate(b.x + 0.1, b.x + 0.95, y0, y1, 0, 13);
    crate(b.x + 1.05, b.x + b.w - 0.1, y0, y1, 0, 13);
    crate(b.x + 0.55, b.x + 1.5, y0 + 0.05, y1 - 0.05, 13, 25);
    const r = G.rng(b.seed);
    for (let i = 0; i < 3; i++) {
      const [X, Y] = P(b.x + 0.7 + r() * 0.6, b.y + 0.3 + r() * 0.4, 26);
      G.blob(ctx, X, Y - 2, 5, 2.2, G.col('#8fb3c9'), OUT, 1);
      G.poly(ctx, [[X + 4, Y - 2], [X + 8, Y - 5], [X + 8, Y + 1]], G.col('#8fb3c9'), OUT, 1);
    }
  };

  B.ventil = function (ctx, b, sh, t) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    G.box(ctx, b.x + 0.1, b.y + 0.1, b.x + b.w - 0.1, b.y + b.h - 0.1, 0, 4, '#5d6670');
    G.thick(ctx, P(b.x + 0.1, cy - 0.4, 10), P(b.x + b.w - 0.1, cy - 0.4, 10), G.col('#3c8f5a'), 10);
    G.thick(ctx, P(b.x + 0.1, cy + 0.4, 10), P(b.x + b.w - 0.1, cy + 0.4, 10), G.col('#e9ecef'), 10);
    G.cyl(ctx, cx, cy, 0.17, 4, 26, '#e9ecef', { lw: 1.3 });
    const [X, Y] = P(cx, cy, 28);
    ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.beginPath(); ctx.ellipse(X, Y, 13, 6.5, 0, 0, 7); ctx.stroke();
    ctx.lineWidth = 3.4; ctx.strokeStyle = G.col('#d23b2c'); ctx.stroke();
    ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(X - 13, Y); ctx.lineTo(X + 13, Y); ctx.moveTo(X, Y - 6.5); ctx.lineTo(X, Y + 6.5); ctx.stroke();
  };

  B.skorsten = function (ctx, b, sh, t) {
    const pal = sh.def.pal;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2, r = 0.62;
    G.cyl(ctx, cx, cy, r + 0.12, 0, 6, '#5d6670');
    G.cyl(ctx, cx, cy, r, 6, 46, '#e3e6ea');
    G.cyl(ctx, cx, cy, r, 46, 58, pal.accent);
    G.cyl(ctx, cx, cy, r, 58, 64, '#e3e6ea');
    G.cyl(ctx, cx, cy, r, 64, 72, '#22252c');
    G.disc(ctx, cx, cy, r * 0.7, 72, '#0e0f12', null);
    if (b.hp > 0) {
      for (let i = 0; i < 4; i++) {
        const f = (((t * 0.45 + i / 4 + b.id * 0.13) % 1) + 1) % 1;
        const [X, Y] = P(cx - f * 0.8, cy - f * 0.4, 74 + f * 60);
        ctx.globalAlpha = (1 - f) * 0.55;
        G.blob(ctx, X, Y, 6 + f * 12, 5 + f * 10, '#cfd5db', null);
      }
      ctx.globalAlpha = 1;
    }
  };

  B.kran = function (ctx, b, sh, t) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    G.box(ctx, b.x + 0.3, b.y + 0.3, b.x + b.w - 0.3, b.y + b.h - 0.3, 0, 12, '#e8b021');
    G.box(ctx, cx - 0.2, cy - 0.2, cx + 0.2, cy + 0.2, 12, 56, '#e8b021');
    G.box(ctx, cx - 0.42, cy - 0.42, cx + 0.32, cy + 0.32, 42, 56, '#e8b021');
    G.poly(ctx, [P(cx + 0.32, cy - 0.3, 54), P(cx + 0.32, cy + 0.2, 54), P(cx + 0.32, cy + 0.2, 46), P(cx + 0.32, cy - 0.3, 46)], G.col('#2d4a6b'), OUT, 1);
    const a = P(cx, cy, 54), e = P(cx + 1.7, cy - 1.5, 84);
    G.thick(ctx, a, e, G.col('#e8b021'), 6);
    ctx.strokeStyle = G.col('#a37a12'); ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i = 0; i < 6; i++) { const p0 = [lerp(a[0], e[0], i / 6), lerp(a[1], e[1], i / 6)], p1 = [lerp(a[0], e[0], (i + 0.5) / 6), lerp(a[1], e[1], (i + 0.5) / 6)]; ctx.moveTo(p0[0], p0[1] - 2); ctx.lineTo(p1[0], p1[1] + 2); }
    ctx.stroke();
    const sway = Math.sin(t * 1.6 + b.id) * 3;
    G.line(ctx, e, [e[0] + sway, e[1] + 30], '#22252c', 1.3);
    ctx.beginPath(); ctx.arc(e[0] + sway, e[1] + 33, 3, 0, Math.PI * 1.4); ctx.lineWidth = 2; ctx.strokeStyle = '#22252c'; ctx.stroke();
  };

  B.livbat = function (ctx, b, sh, t) {
    const x0 = b.x + 0.15, y0 = b.y + 0.15, x1 = b.x + b.w - 0.15, y1 = b.y + b.h - 0.15;
    for (const [x, y] of [[x0 + 0.1, y0 + 0.4], [x1 - 0.1, y0 + 0.4]]) G.line(ctx, P(x, y, 0), P(x, y, 24), '#8d99a6', 2.4);
    G.box(ctx, x0 + 0.1, y0 + 0.05, x1 - 0.1, y1 - 0.05, 7, 17, '#f07c1c');
    G.box(ctx, x0 + 0.3, y0 + 0.15, x1 - 0.3, y1 - 0.15, 17, 23, '#f4f4f4');
  };

  B.radar = function (ctx, b, sh, t) {
    const cx = b.x + 0.5, cy = b.y + 0.5;
    G.box(ctx, b.x + 0.2, b.y + 0.2, b.x + 0.8, b.y + 0.8, 0, 8, '#8d99a6');
    G.box(ctx, cx - 0.08, cy - 0.08, cx + 0.08, cy + 0.08, 8, 54, '#c9d1d8', { lw: 1.2 });
    const a = t * 2.8 + b.id;
    G.thick(ctx, P(cx - Math.cos(a) * 0.62, cy - Math.sin(a) * 0.62, 56), P(cx + Math.cos(a) * 0.62, cy + Math.sin(a) * 0.62, 56), '#f4f6f8', 3.4);
    G.blob(ctx, ...P(cx, cy, 60), 3, 3, '#d23b2c', OUT, 1.2);
  };

  B.helipad = function (ctx, b, sh, t) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    G.box(ctx, b.x + 0.1, b.y + 0.1, b.x + b.w - 0.1, b.y + b.h - 0.1, 0, 4, '#4f6d5a');
    G.disc(ctx, cx, cy, 1.1, 4, null, G.col('#f2c14e'), 3);
    ctx.strokeStyle = G.col('#ffffff'); ctx.lineWidth = 4; ctx.lineCap = 'butt';
    ctx.beginPath();
    for (const [a, e] of [[[cx - 0.35, cy - 0.45], [cx - 0.35, cy + 0.45]], [[cx + 0.35, cy - 0.45], [cx + 0.35, cy + 0.45]], [[cx - 0.35, cy], [cx + 0.35, cy]]]) {
      const p0 = P(a[0], a[1], 4), p1 = P(e[0], e[1], 4); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]);
    }
    ctx.stroke();
  };

  B.pool = function (ctx, b, sh, t) {
    const x0 = b.x + 0.1, y0 = b.y + 0.1, x1 = b.x + b.w - 0.1, y1 = b.y + b.h - 0.1;
    G.box(ctx, x0, y0, x1, y1, 0, 8, '#f4f7fa');
    const wp = [P(x0 + 0.25, y0 + 0.25, 8), P(x1 - 0.25, y0 + 0.25, 8), P(x1 - 0.25, y1 - 0.25, 8), P(x0 + 0.25, y1 - 0.25, 8)];
    G.poly(ctx, wp, G.col('#3fc6f0'), OUT, 1.2);
    ctx.save(); G.path(ctx, wp); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const y = lerp(y0 + 0.4, y1 - 0.4, i / 3);
      ctx.beginPath();
      for (let k = 0; k <= 10; k++) { const x = lerp(x0, x1, k / 10); const [X, Y] = P(x, y + Math.sin(t * 2 + k + i) * 0.06, 8); if (k) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }
      ctx.stroke();
    }
    ctx.restore();
    const da = t * 0.6;
    const [DX, DY] = P(lerp(x0 + 0.8, x1 - 0.8, 0.5 + Math.cos(da) * 0.35), lerp(y0 + 0.6, y1 - 0.6, 0.5 + Math.sin(da) * 0.35), 9);
    G.blob(ctx, DX, DY, 5, 3, '#ffd23f', OUT, 1.2);
    G.blob(ctx, DX + 3, DY - 4, 2.6, 2.4, '#ffd23f', OUT, 1.1);
    ctx.fillStyle = '#ff8a1c'; ctx.fillRect(DX + 5, DY - 4.5, 2.4, 1.4);
  };

  // Sprite-cache för byggnader utan animation: ritas en gång per zoomnivå och klistras sedan in.
  // A.spriteScale sätts av den som ritar (kamerans zoom × dpr); 0 = rita direkt.
  A.spriteScale = 0;
  const STATIC = new Set(['container', 'fisklada', 'ventil', 'livbat', 'helipad']);
  const spriteCache = new Map();
  function sprite(key, w, h, hgt, draw) {
    const sc = A.spriteScale;
    const k = key + '|' + sc.toFixed(3) + '|' + G.view;
    let sp = spriteCache.get(k);
    if (!sp) {
      if (spriteCache.size > 400) spriteCache.clear();
      const cs = [P(0, 0), P(w, 0), P(0, h), P(w, h)];
      const x0 = Math.min(...cs.map((c) => c[0])) - 12, x1 = Math.max(...cs.map((c) => c[0])) + 12;
      const y0 = Math.min(...cs.map((c) => c[1])) - hgt * G.ZK - 18, y1 = Math.max(...cs.map((c) => c[1])) + 12;
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.ceil((x1 - x0) * sc)); cv.height = Math.max(1, Math.ceil((y1 - y0) * sc));
      const c = cv.getContext('2d');
      c.setTransform(sc, 0, 0, sc, -x0 * sc, -y0 * sc);
      draw(c);
      sp = { cv, x0, y0, sc };
      spriteCache.set(k, sp);
    }
    return sp;
  }
  function blit(ctx, sp, x, y) {
    const [X, Y] = P(x, y, 0);
    ctx.drawImage(sp.cv, X + sp.x0, Y + sp.y0, sp.cv.width / sp.sc, sp.cv.height / sp.sc);
  }

  A.building = function (ctx, b, sh, t, o = {}) {
    const f = B[b.type];
    if (!f) return;
    if (A.spriteScale > 0 && STATIC.has(b.type) && !(b.flash > 0)) {
      const sp = sprite([b.type, b.w, b.h, b.color, b.stack, b.seed].join(','), b.w, b.h, 26 * b.stack + 10, (c) => {
        f(c, Object.assign({}, b, { x: 0, y: 0, cx: b.w / 2, cy: b.h / 2 }), sh, t, o);
      });
      blit(ctx, sp, b.x, b.y);
      return;
    }
    G.flash = b.flash > 0 ? Math.min(1, b.flash * 7) : 0;
    f(ctx, b, sh, t, o);
    G.flash = 0;
  };

  A.buildingShadow = function (ctx, b) {
    const s = 0.35;
    G.poly(ctx, [P(b.x + 0.1, b.y + 0.1 + s), P(b.x + b.w, b.y + 0.1 + s), P(b.x + b.w, b.y + b.h + s), P(b.x + 0.1, b.y + b.h + s)], 'rgba(10,15,25,.16)', null);
  };

  // ---------- barrikader ----------
  A.wall = function (ctx, w, sh, t) {
    const alive = (xx, yy) => { if (xx < 0 || yy < 0 || xx >= sh.W || yy >= sh.H) return false; const i = sh.wallAt[yy * sh.W + xx]; return i >= 0 && sh.walls[i].alive; };
    const ax = alive(w.x + 1, w.y), ay = alive(w.x, w.y + 1), dmg = w.hp / w.maxHp < 0.5;
    if (A.spriteScale > 0 && !(w.flash > 0)) {
      blit(ctx, sprite(['wall', ax, ay, dmg].join(','), 1, 1, 24, (c) => wallDraw(c, 0, 0, ax, ay, dmg)), w.x, w.y);
      return;
    }
    G.flash = w.flash > 0 ? Math.min(1, w.flash * 7) : 0;
    wallDraw(ctx, w.x, w.y, ax, ay, dmg);
    G.flash = 0;
  };
  function wallDraw(ctx, x, y, ax, ay, dmg) {
    const col = dmg ? '#4a5058' : '#59616b';
    if (ax) G.box(ctx, x + 0.7, y + 0.36, x + 1.3, y + 0.64, 3, 12, '#7b8590', { lw: 1.2 });
    if (ay) G.box(ctx, x + 0.36, y + 0.7, x + 0.64, y + 1.3, 3, 12, '#7b8590', { lw: 1.2 });
    G.box(ctx, x + 0.22, y + 0.22, x + 0.78, y + 0.78, 0, 17, col, { topCol: '#f2c14e', top: 0 });
    const [X, Y] = P(x + 0.5, y + 0.5, 17);
    ctx.fillStyle = G.col('#1d1526');
    ctx.beginPath(); ctx.moveTo(X - 8, Y); ctx.lineTo(X - 4, Y - 2); ctx.lineTo(X + 2, Y + 3); ctx.lineTo(X - 2, Y + 5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(X + 2, Y - 5); ctx.lineTo(X + 6, Y - 3); ctx.lineTo(X + 10, Y + 1); ctx.lineTo(X + 6, Y + 1); ctx.closePath(); ctx.fill();
    // taggtråd
    ctx.strokeStyle = 'rgba(220,226,232,.9)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(X - 6 + i * 6, Y - 4, 4, 3, 0, 0, 7); ctx.stroke(); }
  }

      if (side === 'e') { def = D.guard; mul = this.sh.hpMul; }
      else { def = key === 'kapten' ? D.hero : D.troops[key]; mul = 1 + D.levelScale * (this.level(key) - 1); }
      const dmul = side === 'e' ? this.sh.dmgMul : mul;
      const skins = side === 'e' ? A.GUARD_SKINS : A.SKINS;
      const u = {
        id: this.uid++, isUnit: true, type: key, side, def, x, y, hp: def.hp * mul, maxHp: def.hp * mul, dmg: def.dmg * dmul,
        atkInt: def.atk, range: def.range, speed: def.speed, state: 'deck', target: null, wallTarget: null, cd: 0.2 + rand() * 0.4,
        facing: 1, walk: rand() * 6, moving: false, atkAnim: 0, flash: 0, slow: 0, rage: 0, air: 0, squash: 1, land: 0,
        skin: skins[(rand() * skins.length) | 0], off: [(rand() - 0.5) * 0.5, (rand() - 0.5) * 0.5], scan: rand() * 0.3, skip: new Set(), skipV: 0,
        pend: null, home: null,
      };
      return u;
    }

    // Placera trupp från vattnet (x, y på vattenplanet)
    deploy(key, wx, wy) {
      if (this.ended) return 'ended';
      if (this.remaining(key) <= 0) return 'empty';
      const poly = this.sh.poly;
      if (K.ship.inPoly(poly, wx, wy)) {
        const c = K.ship.closestOnPoly(poly, wx, wy);
        wx = c.x + c.nx * 0.7; wy = c.y + c.ny * 0.7;
      }
      const c = K.ship.closestOnPoly(poly, wx, wy);
      const tx = c.x + c.nx * 0.45, ty = c.y + c.ny * 0.45;
      // närmaste gångbara däcksruta
      let land = null, bd = Infinity;
      for (let y = 0; y < this.H; y++) for (let x = 0; x < this.W; x++) {
        const t = y * this.W + x;
        if (!this.walkable(t)) continue;
        const d = (x + 0.5 - tx) ** 2 + (y + 0.5 - ty) ** 2;
        if (d < bd) { bd = d; land = [x + 0.5, y + 0.5]; }
      }
      if (!land) return 'full';
      if (key === 'kapten') this.pool.hero = 0; else this.pool.troops[key]--;
      const u = this.makeUnit(key, 'p', wx, wy);
      u.state = 'boat';
      if (key === 'kapten') this.heroUnit = u;
      const sk = { x: wx, y: wy, tx, ty, ang: Math.atan2(ty - wy, tx - wx), state: 'go', unit: u, t: 0, seed: rand() * 9, moving: true, land: [land[0] + (rand() - 0.5) * 0.4, land[1] + (rand() - 0.5) * 0.4], color: ['#2f7fd1', '#3aa357', '#e8b021', '#e0392b'][(rand() * 4) | 0] };
      u.x = sk.x; u.y = sk.y;
      this.skiffs.push(sk);
      this.units.push(u);
      this.start();
      this.sound('deploy');
      if (this.remaining(key) <= 0 && this.selected === key) this.selected = this.firstAvailable();
      return 'ok';
    }

    castSpell(key, x, y) {
      if (this.ended || this.remaining(key) <= 0) return 'empty';
      const sd = D.spells[key];
      this.pool.spells[key]--;
      const lv = this.level(key);
      this.spells.push({ type: key, x, y, r: sd.radius, dur: sd.duration, t: 0, tick: 0.45, color: sd.color, lv, hps: sd.hps ? sd.hps * (1 + D.levelScale * (lv - 1)) : 0, dmgMul: sd.dmgMul ? sd.dmgMul + 0.1 * (lv - 1) : 1, spdMul: sd.spdMul || 1 });
      this.start();
      this.sound(key === 'lakning' ? 'heal' : 'drum');
      if (this.remaining(key) <= 0 && this.selected === key) this.selected = this.firstAvailable();
      return 'ok';
    }

    useAbility() {
      const h = this.heroUnit;
      if (!h || h.hp <= 0 || h.state !== 'deck' || this.abilityUsed) return false;
      this.abilityUsed = true;
      const ab = D.hero.ability;
      h.hp = Math.min(h.maxHp, h.hp + h.maxHp * ab.healPct);
      h.rage = ab.rage; h.rageMul = 1.6; h.rageSpd = 1.4; h.yellT = 1.2;
      for (let i = 0; i < ab.summon; i++) {
        const a = (i / ab.summon) * Math.PI * 2;
        let x = h.x + Math.cos(a) * 0.9, y = h.y + Math.sin(a) * 0.9;
        if (!this.walkableAt(x, y)) { x = h.x; y = h.y; }
        const u = this.makeUnit('kampe', 'p', x, y);
        u.squash = 1.4; u.land = 0.25;
        this.units.push(u);
        this.fxAdd('poof', x, y, 10, { size: 10, color: '#ffffff', life: 0.5 });
      }
      this.fxAdd('ring', h.x, h.y, 0, { size: 40, color: '#ffcf3a', life: 0.6 });
      this.sound('roar');
      return true;
    }

    start() { if (!this.started) { this.started = true; this.events.push({ type: 'start' }); } }

    // ---------- skada ----------
    damage(tg, amt) {
      if (tg.isUnit) {
        if (tg.hp <= 0) return;
        tg.hp -= amt; tg.flash = 0.12;
        if (tg.hp <= 0) this.killUnit(tg);
        return;
      }
      if (tg.isWall) {
        if (!tg.alive) return;
        tg.hp -= amt; tg.flash = 0.12;
        if (tg.hp <= 0) {
          tg.alive = false; this.version++;
          for (let i = 0; i < 6; i++) this.fxAdd('debris', tg.x + 0.5, tg.y + 0.5, 10, { vx: (rand() - 0.5) * 4, vy: (rand() - 0.5) * 4, vz: 80 + rand() * 80, color: i % 2 ? '#f2c14e' : '#59616b', size: 4, life: 1 });
          this.fxAdd('dust', tg.x + 0.5, tg.y + 0.5, 8, { size: 12, color: '#d9d2c3', life: 0.7 });
          this.sound('wall');
        }
        return;
      }
      if (!tg.alive) return;
      const real = Math.min(tg.hp, amt);
      tg.hp -= real; tg.flash = 0.12; tg.lastHit = this.time;
      if (tg.lootTotal > 0) {
        const take = Math.min(tg.lootLeft, (tg.lootTotal * real) / tg.maxHp);
        tg.lootLeft -= take; this.addLoot(take, tg);
      }
      if (tg.hp <= 0.001) this.destroyBuilding(tg);
    }

    addLoot(v, b) {
      this.loot += v; this.coinAcc += v;
      while (this.coinAcc >= this.coinStep) {
        this.coinAcc -= this.coinStep;
        this.events.push({ type: 'coin', x: b.cx, y: b.cy, z: (B_HEIGHT[b.type] || 20) * 0.6 });
        this.fxAdd('coin', b.cx + (rand() - 0.5), b.cy + (rand() - 0.5), 20, { vx: (rand() - 0.5) * 2, vy: (rand() - 0.5) * 2, vz: 120 + rand() * 60, life: 0.9, rot: 0, spin: 12 });
        this.sound('coin');
      }
    }

    destroyBuilding(b) {
      b.alive = false; b.hp = 0;
      if (b.lootLeft > 0) { const v = b.lootLeft; b.lootLeft = 0; this.addLoot(v, b); }
      this.destroyed++; this.version++; this.layerVer = (this.layerVer || 0) + 1;
      const big = b.w * b.h;
      for (let i = 0; i < 6 + big * 2; i++) {
        this.fxAdd('debris', b.x + rand() * b.w, b.y + rand() * b.h, 15 + rand() * 20, { vx: (rand() - 0.5) * 5, vy: (rand() - 0.5) * 5, vz: 100 + rand() * 120, color: ['#8d99a6', '#6e6a64', '#c8402e', '#e3e6ea'][(rand() * 4) | 0], size: 4 + rand() * 4, life: 1.2, rot: rand() * 6 });
      }
      for (let i = 0; i < 4 + big; i++) this.fxAdd('dust', b.x + rand() * b.w, b.y + rand() * b.h, 6 + rand() * 20, { size: 14 + rand() * 12, color: '#d9d2c3', life: 1 + rand() * 0.6, vz: 20 });
      this.fxAdd('flash', b.cx, b.cy, 20, { size: 30 + big * 6, life: 0.3 });
      this.events.push({ type: 'shake', amt: b.type === 'brygga' ? 14 : 6 });
      this.sound(b.type === 'brygga' ? 'boom' : 'collapse');
      if (b.type === 'brygga') { this.bridgeDown = true; this.events.push({ type: 'capture' }); }
      this.updateStars();
    }

    updateStars() {
      this.pct = Math.floor((this.destroyed / this.total) * 100);
      const s = (this.pct >= 50 ? 1 : 0) + (this.bridgeDown ? 1 : 0) + (this.pct >= 100 ? 1 : 0);
      while (this.stars < s) { this.stars++; this.events.push({ type: 'star', n: this.stars }); this.sound('star'); }
      if (this.pct >= 100 && this.finishAt < 0) this.finishAt = this.time + 1.6;
    }

    killUnit(u) {
      u.hp = 0; u.state = 'dead';
      this.fxAdd('poof', u.x, u.y, 12, { size: 12, color: '#ffffff', life: 0.5 });
      this.fxAdd('skull', u.x, u.y, 4, { life: 1.6, vz: 0 });
      this.sound(u.side === 'p' ? 'die' : 'ko');
    }

    splash(x, y, r, dmg, side, opts = {}) {
      for (const u of this.units) {
        if (u.hp <= 0 || u.state !== 'deck' || u.side === side) continue;
        if (dist(u.x, u.y, x, y) <= r) { this.damage(u, dmg); if (opts.slow) u.slow = 0.8; }
      }
      if (side === 'p') {
        for (const b of this.buildings) if (b.alive && distRect(x, y, b.x, b.y, b.x + b.w, b.y + b.h) <= r) this.damage(b, dmg * (opts.bMul || 1));
        for (const w of this.walls) if (w.alive && distRect(x, y, w.x, w.y, w.x + 1, w.y + 1) <= r) this.damage(w, dmg * (opts.wMul || 1));
      }
    }

    // ---------- effekter ----------
    fxAdd(type, x, y, z, o = {}) {
      if (this.headless) return;
      if (this.fx.length > 700) return;
      const life = o.life || 0.6;
      this.fx.push({ type, x, y, z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0, life, max: life, size: o.size || 6, color: o.color, rot: o.rot || 0, spin: o.spin || 0, g: o.g ?? (type === 'debris' || type === 'coin' || type === 'water' ? 380 : 0), alpha: o.alpha, floor: o.floor ?? 0 });
    }
    sound(name) {
      if (this.headless || !K.sfx) return;
      K.sfx.play(name);
      const buzz = { collapse: 16, boom: 28, star: 40, roar: 50, die: 6 }[name];
      if (buzz) K.sfx.buzz(buzz);
    }

    // ---------- uppdatering ----------
    update(dt) {
      let left = Math.min(dt, 0.1);
      while (left > 1e-6) { const s = Math.min(left, 1 / 60); this.step(s); left -= s; }
    }

    step(dt) {
      this.time += dt;
      if (this.started && !this.ended) this.elapsed += dt;
      for (const b of this.buildings) { b.flash = Math.max(0, b.flash - dt); b.recoil = Math.max(0, b.recoil - dt * 4); b.atkAnim = Math.max(0, b.atkAnim - dt); }
      for (const w of this.walls) w.flash = Math.max(0, w.flash - dt);
      if (!this.ended) {
        this.updateSkiffs(dt);
        for (const u of this.units) if (u.hp > 0) { if (u.side === 'p') this.updateUnit(u, dt); else this.updateGuard(u, dt); }
        for (const b of this.buildings) if (b.alive) this.updateDefense(b, dt);
        this.updateProjectiles(dt);
        this.updateSpells(dt);
        this.ambient(dt);
      } else this.updateSkiffs(dt);
      this.units = this.units.filter((u) => u.hp > 0 || u.state !== 'dead');
      this.updateFx(dt);
      if (this.inspect) { this.inspect.t -= dt; if (this.inspect.t <= 0) this.inspect = null; }
      if (this.deployFail) { this.deployFail.t -= dt; if (this.deployFail.t <= 0) this.deployFail = null; }
      if (this.zoneFlash > 0) this.zoneFlash -= dt;
      this.checkEnd();
    }

    ambient(dt) {
      if (this.headless) return;
      for (const b of this.buildings) {
        if (!b.alive) continue;
        const f = b.hp / b.maxHp;
        if (f < 0.55 && rand() < dt * 3) this.fxAdd('smoke', b.cx + (rand() - 0.5) * b.w * 0.6, b.cy + (rand() - 0.5) * b.h * 0.6, (B_HEIGHT[b.type] || 20) * 0.7, { size: 7, color: '#5a5650', vz: 30, life: 1.4, alpha: 0.55 });
        if (f < 0.3 && rand() < dt * 6) this.fxAdd('fire', b.cx + (rand() - 0.5) * b.w * 0.5, b.cy + (rand() - 0.5) * b.h * 0.5, (B_HEIGHT[b.type] || 20) * 0.5, { size: 7, vz: 40, life: 0.6 });
      }
    }

    updateSkiffs(dt) {
      for (const sk of this.skiffs) {
        sk.t += dt;
        const u = sk.unit;
        if (sk.state === 'go') {
          const d = dist(sk.x, sk.y, sk.tx, sk.ty), sp = 8 * dt;
          if (d <= sp) {
            sk.x = sk.tx; sk.y = sk.ty; sk.state = 'wait'; sk.moving = false; sk.t = 0;
            u.state = 'jump'; u.jt = 0; u.j0 = [sk.x, sk.y]; u.j1 = sk.land;
            this.sound('hook');
          } else { sk.x += ((sk.tx - sk.x) / d) * sp; sk.y += ((sk.ty - sk.y) / d) * sp; }
          if (u.state === 'boat') { u.x = sk.x; u.y = sk.y; }
          if (!this.headless && rand() < dt * 20) this.fxAdd('water', sk.x - Math.cos(sk.ang) * 0.7, sk.y - Math.sin(sk.ang) * 0.7, -A.HULL + 2, { size: 2.5, vz: 60, vx: (rand() - 0.5), vy: (rand() - 0.5), life: 0.4, floor: -A.HULL, color: '#ffffff' });
        } else if (sk.state === 'wait') {
          if (sk.t > 1.6) { sk.state = 'leave'; sk.t = 0; sk.moving = true; sk.ang += Math.PI; }
        } else if (sk.state === 'leave') {
          sk.x += Math.cos(sk.ang) * 3 * dt; sk.y += Math.sin(sk.ang) * 3 * dt;
        }
        if (u && u.state === 'jump') {
          u.jt += dt;
          const f = Math.min(1, u.jt / 0.55);
          u.x = u.j0[0] + (u.j1[0] - u.j0[0]) * f; u.y = u.j0[1] + (u.j1[1] - u.j0[1]) * f;
          u.jz = -A.HULL * (1 - f) + Math.sin(f * Math.PI) * 46;
          if (f >= 1) {
            u.state = 'deck'; u.jz = 0; u.squash = 1.35; u.land = 0.22; sk.unit = null;
            this.fxAdd('dust', u.x, u.y, 2, { size: 9, color: '#e8dcc4', life: 0.45 });
          }
        }
      }
      this.skiffs = this.skiffs.filter((s) => !(s.state === 'leave' && s.t > 3));
    }

    pickTarget(u) {
      if (u.skipV !== this.version) { u.skip.clear(); u.skipV = this.version; }
      const pref = u.type === 'kapten' ? 'any' : u.def.target;
      let cands = [];
      if (pref === 'wall') {
        cands = this.walls.filter((w) => w.alive && !u.skip.has('w' + w.x + ',' + w.y));
        if (!cands.length) cands = this.buildings.filter((b) => b.alive && !u.skip.has(b.id));
      } else {
        const all = this.buildings.filter((b) => b.alive && !u.skip.has(b.id));
        if (pref === 'defense') cands = all.filter((b) => b.kind === 'defense');
        else if (pref === 'loot') cands = all.filter((b) => b.lootTotal > 0 && b.lootLeft > 0.5);
        if (!cands.length) cands = all;
      }
      let best = null, bd = Infinity;
      for (const c of cands) {
        const d = c.isWall ? distRect(u.x, u.y, c.x, c.y, c.x + 1, c.y + 1) : distRect(u.x, u.y, c.x, c.y, c.x + c.w, c.y + c.h);
        if (d < bd) { bd = d; best = c; }
      }
      return best;
    }

    moveToward(u, tx, ty, spd, dt) {
      const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
      if (d < 0.01) { u.moving = false; return; }
      const s = Math.min(d, spd * dt);
      const nx = u.x + (dx / d) * s, ny = u.y + (dy / d) * s;
      if (this.walkableAt(nx, ny)) { u.x = nx; u.y = ny; }
      else if (this.walkableAt(nx, u.y)) u.x = nx;
      else if (this.walkableAt(u.x, ny)) u.y = ny;
      else { u.moving = false; return; }
      u.moving = true;
      u.walk += dt * spd * 7;
      const sdx = G.sdx(dx, dy);
      if (Math.abs(sdx) > 0.05) u.facing = sdx > 0 ? 1 : -1;
    }

    face(u, tx, ty) { const sdx = G.sdx(tx - u.x, ty - u.y); if (Math.abs(sdx) > 0.02) u.facing = sdx > 0 ? 1 : -1; }

    tickTimers(u, dt) {
      u.cd -= dt; u.atkAnim = Math.max(0, u.atkAnim - dt); u.flash = Math.max(0, u.flash - dt);
      u.slow = Math.max(0, u.slow - dt); u.rage = Math.max(0, u.rage - dt); u.yellT = Math.max(0, (u.yellT || 0) - dt);
      if (u.land > 0) { u.land -= dt; u.squash = 1 + Math.max(0, u.land) * 1.5; } else u.squash = 1;
      if (u.pend) {
        u.pend.t -= dt;
        if (u.pend.t <= 0) {
          const p = u.pend; u.pend = null;
          const alive = p.tg.isUnit ? p.tg.hp > 0 : p.tg.alive;
          if (alive) {
            this.damage(p.tg, p.dmg);
            const [hx, hy] = p.tg.isUnit ? [p.tg.x, p.tg.y] : closestRect(u.x, u.y, p.tg.x, p.tg.y, p.tg.x + (p.tg.w || 1), p.tg.y + (p.tg.h || 1));
            for (let i = 0; i < 3; i++) this.fxAdd('spark', hx, hy, 12 + rand() * 8, { vx: (rand() - 0.5) * 6, vy: (rand() - 0.5) * 6, vz: 60 + rand() * 60, life: 0.25 });
            this.sound(u.type === 'bjasse' ? 'thud' : 'hit');
          }
        }
      }
    }

    speedOf(u) {
      let s = u.speed;
      if (u.slow > 0) s *= 0.5;
      if (u.rage > 0) s *= u.rageSpd || 1.4;
      return s;
    }
    dmgOf(u, tg) {
      let d = u.dmg;
      if (u.rage > 0) d *= u.rageMul || 1.6;
      if (u.def.lootMul && tg && tg.lootTotal > 0) d *= u.def.lootMul;
      return d;
    }

    doAttack(u, tg) {
      const tx = tg.isUnit ? tg.x : tg.isWall ? tg.x + 0.5 : tg.cx, ty = tg.isUnit ? tg.y : tg.isWall ? tg.y + 0.5 : tg.cy;
      this.face(u, tx, ty);
      u.moving = false;
      if (u.cd > 0) return;
      u.cd = u.atkInt; u.atkAnim = 0.35;
      if (u.type === 'bombare') { this.explodeBomber(u); return; }
      const dmg = this.dmgOf(u, tg);
      if (u.def.proj) {
        this.proj.push({ kind: 'shot', side: u.side, x: u.x, y: u.y, z: 18, target: tg, dmg, speed: 16, dx: 0, dy: 0, dz: 0 });
        this.sound('shot');
      } else u.pend = { tg, dmg, t: 0.15 };
    }

    explodeBomber(u) {
      const lv = 1 + D.levelScale * (this.level('bombare') - 1);
      const dmg = D.troops.bombare.dmg * lv;
      this.splash(u.x, u.y, D.troops.bombare.splash, dmg, 'p', { wMul: D.troops.bombare.wallMul, bMul: 1 });
      this.fxAdd('flash', u.x, u.y, 14, { size: 46, life: 0.35 });
      for (let i = 0; i < 8; i++) this.fxAdd('smoke', u.x + (rand() - 0.5), u.y + (rand() - 0.5), 10 + rand() * 10, { size: 10, color: '#3b3b44', vz: 40, life: 0.9 });
      this.events.push({ type: 'shake', amt: 7 });
      this.sound('boom');
      u.hp = 0; u.state = 'dead';
    }

    updateUnit(u, dt) {
      if (u.state !== 'deck') return;
      this.tickTimers(u, dt);
      const spd = this.speedOf(u);
      // vakter distraherar (inte bjässar och bombare)
      if (u.type !== 'bjasse' && u.type !== 'bombare') {
        u.scan -= dt;
        if (u.scan <= 0) {
          u.scan = 0.3;
          if (!u.target || !u.target.isUnit) {
            let best = null, bd = 2.4;
            for (const g of this.units) if (g.side === 'e' && g.hp > 0) { const d = dist(g.x, g.y, u.x, u.y); if (d < bd) { bd = d; best = g; } }
            if (best) { u.target = best; u.wallTarget = null; }
          }
        }
      }
      if (u.target && (u.target.isUnit ? u.target.hp <= 0 : !u.target.alive)) { u.target = null; u.wallTarget = null; }
      if (u.wallTarget && !u.wallTarget.alive) u.wallTarget = null;
      if (!u.target) { u.target = this.pickTarget(u); u.wallTarget = null; }
      const tg = u.target;
      if (!tg) { u.moving = false; return; }
      if (tg.isUnit) {
        if (dist(u.x, u.y, tg.x, tg.y) <= u.range + 0.3) this.doAttack(u, tg);
        else this.moveToward(u, tg.x, tg.y, spd, dt);
        return;
      }
      const rx1 = tg.isWall ? tg.x + 1 : tg.x + tg.w, ry1 = tg.isWall ? tg.y + 1 : tg.y + tg.h;
      const dr = distRect(u.x, u.y, tg.x, tg.y, rx1, ry1);
      if (dr <= u.range) { this.doAttack(u, tg); return; }
      if (u.wallTarget) {
        const w = u.wallTarget;
        if (distRect(u.x, u.y, w.x, w.y, w.x + 1, w.y + 1) <= Math.max(u.range, 0.6)) this.doAttack(u, w);
        else this.moveToward(u, w.x + 0.5, w.y + 0.5, spd, dt);
        return;
      }
      const d = this.field(tg);
      const t = (u.y | 0) * this.W + (u.x | 0);
      if (!isFinite(d[t])) { u.skip.add(tg.isWall ? 'w' + tg.x + ',' + tg.y : tg.id); u.target = null; u.moving = false; return; }
      if (d[t] === 0 || dr < 1.3) {
        const [cx, cy] = closestRect(u.x, u.y, tg.x, tg.y, rx1, ry1);
        this.moveToward(u, cx, cy, spd, dt);
        if (!u.moving) { u.skip.add(tg.isWall ? 'w' + tg.x + ',' + tg.y : tg.id); u.target = null; }
        return;
      }
      const n = this.nextStep(u, d);
      if (n < 0) { u.moving = false; return; }
      if (this.wallAlive(n)) {
        u.wallTarget = this.walls[this.sh.wallAt[n]];
        return;
      }
      const nx = (n % this.W) + 0.5 + u.off[0], ny = ((n / this.W) | 0) + 0.5 + u.off[1];
      this.moveToward(u, nx, ny, spd, dt);
      if (!u.moving) this.moveToward(u, (n % this.W) + 0.5, ((n / this.W) | 0) + 0.5, spd, dt);
    }

    updateGuard(g, dt) {
      this.tickTimers(g, dt);
      g.scan -= dt;
      if (g.scan <= 0 || !g.target || g.target.hp <= 0 || g.target.state !== 'deck') {
        g.scan = 0.4;
        let best = null, bd = 9;
        for (const u of this.units) if (u.side === 'p' && u.hp > 0 && u.state === 'deck') { const d = dist(u.x, u.y, g.x, g.y); if (d < bd) { bd = d; best = u; } }
        g.target = best;
      }
      const tg = g.target;
      if (tg) {
        if (dist(g.x, g.y, tg.x, tg.y) <= g.range + 0.25) this.doAttack(g, tg);
        else this.moveToward(g, tg.x, tg.y, this.speedOf(g), dt);
      } else if (g.home && dist(g.x, g.y, g.home[0], g.home[1]) > 0.6) this.moveToward(g, g.home[0], g.home[1], g.speed * 0.5, dt);
      else g.moving = false;
    }

    updateDefense(b, dt) {
      const bd = b.def;
      if (b.type === 'vaktkur') {
        if (b.spawned < bd.guards) {
          if (!b.alarm) {
            for (const u of this.units) if (u.side === 'p' && u.state === 'deck' && u.hp > 0 && dist(u.x, u.y, b.cx, b.cy) < bd.trigger) { b.alarm = true; this.sound('alarm'); break; }
          }
          if (b.alarm) {
            b.spawnT -= dt;
            if (b.spawnT <= 0) {
              b.spawnT = 0.45; b.spawned++;
              let sx = b.cx, sy = b.y + b.h + 0.4;
              if (!this.walkableAt(sx, sy)) {
                const gt = this.goalTiles(b).filter((t) => this.walkable(t));
                if (gt.length) { const t = gt[(rand() * gt.length) | 0]; sx = (t % this.W) + 0.5; sy = ((t / this.W) | 0) + 0.5; }
              }
              const g = this.makeUnit(this.def.guardType || 'vakt', 'e', sx, sy);
              g.home = [sx, sy]; g.squash = 1.3; g.land = 0.2;
              this.units.push(g);
              this.fxAdd('poof', sx, sy, 8, { size: 8, color: '#ffffff', life: 0.4 });
            }
          }
        }
        return;
      }
      if (!bd.range) return;
      b.cd -= dt;
      const tg = b.target;
      const valid = (u) => u && u.hp > 0 && u.side === 'p' && u.state === 'deck' && (() => { const d = dist(u.x, u.y, b.cx, b.cy); return d <= bd.range + b.w / 2 && (!bd.minRange || d >= bd.minRange); })();
      if (!valid(tg)) {
        b.target = null;
        let best = null, bdist = Infinity;
        for (const u of this.units) if (valid(u)) { const d = dist(u.x, u.y, b.cx, b.cy); if (d < bdist) { bdist = d; best = u; } }
        b.target = best;
      }
      const t = b.target;
      if (!t) { b.ang += dt * 0.35; return; }
      const want = Math.atan2(t.y - b.cy, t.x - b.cx);
      let diff = ((want - b.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      const turn = b.type === 'morsare' ? 20 : 7;
      b.ang += clamp(diff, -turn * dt, turn * dt);
      diff = ((want - b.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      if (b.cd > 0 || Math.abs(diff) > 0.35) return;
      b.cd = bd.atk;
      b.recoil = 1; b.atkAnim = 0.35;
      const dmg = b.dmg;
      if (b.type === 'kanon') {
        const len = 1.15;
        this.proj.push({ kind: 'ball', side: 'e', x: b.cx + Math.cos(b.ang) * len, y: b.cy + Math.sin(b.ang) * len, z: 22, target: t, dmg, speed: 11, dx: 0, dy: 0, dz: 0 });
        this.fxAdd('flash', b.cx + Math.cos(b.ang) * len, b.cy + Math.sin(b.ang) * len, 22, { size: 18, life: 0.15 });
        this.fxAdd('smoke', b.cx + Math.cos(b.ang) * (len + 0.2), b.cy + Math.sin(b.ang) * (len + 0.2), 22, { size: 8, color: '#e6e6e6', vz: 20, life: 0.7 });
        this.sound('cannon');
      } else if (b.type === 'utkik') {
        this.proj.push({ kind: 'bullet', side: 'e', x: b.cx, y: b.cy, z: 82, target: t, dmg, speed: 20, dx: 0, dy: 0, dz: 0 });
        this.fxAdd('flash', b.cx, b.cy, 84, { size: 10, life: 0.1 });
        this.sound('shot');
      } else if (b.type === 'morsare') {
        this.proj.push({ kind: 'shell', side: 'e', x: b.cx, y: b.cy, z: 30, sx: b.cx, sy: b.cy, tx: t.x, ty: t.y, t: 0, dur: 1.3, dmg, splash: bd.splash, dx: 0, dy: 0, dz: 0 });
        this.fxAdd('smoke', b.cx, b.cy, 32, { size: 12, color: '#e6e6e6', vz: 50, life: 0.9 });
        this.sound('mortar');
      } else if (b.type === 'vatten') {
        this.splash(t.x, t.y, bd.splash, dmg, 'e', { slow: true });
        if (!this.headless) {
          const nz = b._nozzle || [b.cx, b.cy, 38];
          for (let i = 0; i < 3; i++) {
            const f = 0.25 + rand() * 0.2;
            this.fxAdd('water', nz[0], nz[1], nz[2], { vx: (t.x - nz[0]) / f + (rand() - 0.5), vy: (t.y - nz[1]) / f + (rand() - 0.5), vz: 380 * f * 0.5 + (12 - nz[2]) / f, size: 3 + rand() * 2, life: f, g: 380, color: i ? '#bfe9ff' : '#ffffff' });
          }
          this.fxAdd('water', t.x, t.y, 4, { vx: (rand() - 0.5) * 3, vy: (rand() - 0.5) * 3, vz: 100, size: 2.5, life: 0.4 });
          if (rand() < 0.3) this.sound('water');
        }
      }
    }

    updateProjectiles(dt) {
      for (const pr of this.proj) {
        if (pr.kind === 'shell') {
          pr.t += dt;
          const f = Math.min(1, pr.t / pr.dur);
          const ox = pr.x, oy = pr.y, oz = pr.z;
          pr.x = pr.sx + (pr.tx - pr.sx) * f; pr.y = pr.sy + (pr.ty - pr.sy) * f;
          pr.z = 30 * (1 - f) + 170 * 4 * f * (1 - f);
          pr.dx = pr.x - ox; pr.dy = pr.y - oy; pr.dz = pr.z - oz;
          if (f >= 1) {
            pr.done = true;
            this.splash(pr.tx, pr.ty, pr.splash, pr.dmg, 'e');
            this.fxAdd('flash', pr.tx, pr.ty, 8, { size: 40, life: 0.3 });
            this.fxAdd('ring', pr.tx, pr.ty, 0, { size: pr.splash * 40, color: '#ffd9a0', life: 0.45 });
            for (let i = 0; i < 6; i++) this.fxAdd('smoke', pr.tx + (rand() - 0.5) * 1.5, pr.ty + (rand() - 0.5) * 1.5, 8, { size: 11, color: '#4a4640', vz: 30, life: 1 });
            this.marks.push({ x: pr.tx, y: pr.ty, t: 6 });
            this.events.push({ type: 'shake', amt: 5 });
            this.sound('boom');
          }
          continue;
        }
        const tg = pr.target;
        const alive = tg && (tg.isUnit ? tg.hp > 0 : tg.alive);
        if (alive) {
          if (tg.isUnit) { pr.tx = tg.x; pr.ty = tg.y; pr.tz = 14; }
          else if (tg.isWall) { pr.tx = tg.x + 0.5; pr.ty = tg.y + 0.5; pr.tz = 10; }
          else { const [cx, cy] = closestRect(pr.x, pr.y, tg.x + 0.3, tg.y + 0.3, tg.x + tg.w - 0.3, tg.y + tg.h - 0.3); pr.tx = cx; pr.ty = cy; pr.tz = Math.min(30, (B_HEIGHT[tg.type] || 20) * 0.5); }
        }
        if (pr.tx === undefined) { pr.done = true; continue; }
        const dx = pr.tx - pr.x, dy = pr.ty - pr.y, dz = (pr.tz - pr.z) / 32;
        const d = Math.hypot(dx, dy, dz);
        const s = pr.speed * dt;
        if (d <= s) {
          pr.done = true;
          if (alive) {
            this.damage(tg, pr.dmg);
            if (pr.kind === 'ball') { this.fxAdd('flash', pr.tx, pr.ty, pr.tz, { size: 14, life: 0.15 }); this.sound('hit'); }
            else for (let i = 0; i < 2; i++) this.fxAdd('spark', pr.tx, pr.ty, pr.tz, { vx: (rand() - 0.5) * 5, vy: (rand() - 0.5) * 5, vz: 50, life: 0.2 });
          }
        } else {
          pr.dx = (dx / d) * s; pr.dy = (dy / d) * s; pr.dz = (dz / d) * s * 32;
          pr.x += pr.dx; pr.y += pr.dy; pr.z += pr.dz;
          if (pr.kind === 'ball' && rand() < dt * 30) this.fxAdd('smoke', pr.x, pr.y, pr.z, { size: 3, color: '#dddddd', life: 0.3, alpha: 0.5 });
        }
      }
      this.proj = this.proj.filter((p) => !p.done);
      for (const m of this.marks) m.t -= dt;
      this.marks = this.marks.filter((m) => m.t > 0);
    }

    updateSpells(dt) {
      for (const s of this.spells) {
        s.t += dt; s.tick -= dt;
        if (s.t > 0.45 && s.tick <= 0) {
          s.tick = 0.25;
          for (const u of this.units) {
            if (u.side !== 'p' || u.hp <= 0 || u.state !== 'deck') continue;
            if (dist(u.x, u.y, s.x, s.y) > s.r) continue;
            if (s.type === 'lakning') {
              if (u.hp < u.maxHp) { u.hp = Math.min(u.maxHp, u.hp + s.hps * 0.25); if (rand() < 0.5) this.fxAdd('plus', u.x, u.y, 30, { vz: 40, life: 0.7, color: '#d6ff6a' }); }
            } else { u.rage = Math.max(u.rage, 0.35); u.rageMul = s.dmgMul; u.rageSpd = s.spdMul; }
          }
          if (!this.headless) {
            const a = rand() * 6.28, r = rand() * s.r;
            this.fxAdd(s.type === 'lakning' ? 'smoke' : 'note', s.x + Math.cos(a) * r, s.y + Math.sin(a) * r, 6, { size: 6, color: s.type === 'lakning' ? '#fff6c8' : '#ff7be6', vz: 50, life: 1, alpha: 0.6 });
          }
        }
      }
      this.spells = this.spells.filter((s) => s.t < s.dur);
    }

    updateFx(dt) {
      for (const p of this.fx) {
        p.life -= dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        p.vz -= p.g * dt;
        p.rot += p.spin * dt;
        const floor = p.floor;
        if (p.g && p.z < floor) {
          const onDeck = K.ship.inPoly(this.sh.poly, p.x, p.y);
          if (onDeck || floor < 0) { p.z = floor; p.vz *= -0.35; p.vx *= 0.6; p.vy *= 0.6; }
          else { p.floor = -A.HULL; }
        }
      }
      this.fx = this.fx.filter((p) => p.life > 0);
    }

    checkEnd() {
      if (this.ended || !this.started) return;
      if (this.finishAt > 0 && this.time >= this.finishAt) return this.finish('all');
      if (this.elapsed >= this.maxTime) return this.finish('time');
      let left = this.pool.hero;
      for (const k in this.pool.troops) left += this.pool.troops[k];
      const alive = this.units.some((u) => u.side === 'p' && u.hp > 0);
      if (!left && !alive) {
        if (this.finishAt < 0) this.finishAt = this.time + 1.5;
      } else if (this.pct < 100) this.finishAt = -1;
    }

    finish(reason) {
      if (this.ended) return;
      this.ended = true;
      const loot = Math.round(this.loot) + (this.bridgeDown ? this.captureBonus : 0);
      const used = {};
      for (const k in this.initialPool.troops) used[k] = (this.initialPool.troops[k] || 0) - (this.pool.troops[k] || 0);
      const usedSpells = {};
      for (const k in this.initialPool.spells) usedSpells[k] = (this.initialPool.spells[k] || 0) - (this.pool.spells[k] || 0);
      this.result = {
        reason, stars: this.stars, pct: this.pct, loot, lootRaw: Math.round(this.loot), bonus: this.bridgeDown ? this.captureBonus : 0,
        captured: this.bridgeDown, firstCapture: this.bridgeDown && !this.replay, used, usedSpells, time: this.elapsed,
      };
      this.events.push({ type: 'end', result: this.result });
    }

    surrender() { if (!this.started) { this.ended = true; this.result = null; this.events.push({ type: 'leave' }); return; } this.finish('surrender'); }

    // ---------- ritning ----------
    bob() { return Math.sin(this.time * 1.1) * 2; }

    behindShip(x, y) {
      // ligger punkten bakom skrovet sett från kameran?
      const poly = this.sh.poly, [dx, dy] = G.depthDir();
      for (let k = 0.5; k < 40; k += 0.5) if (K.ship.inPoly(poly, x + k * dx, y + k * dy)) return true;
      return false;
    }

    render(ctx, cam, cw, ch, dpr, t) {
      A.unitScale = G.unitScale;
      try { this.draw(ctx, cam, cw, ch, dpr, t); } finally { A.unitScale = 1; A.spriteScale = 0; }
    }

    draw(ctx, cam, cw, ch, dpr, t) {
      const sh = this.sh;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = ctx.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, '#0d5f7e'); g.addColorStop(1, '#1590a8');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
      cam.apply(ctx, cw, ch, dpr);
      G.waves(ctx, this.waves, t, -A.HULL);
      const back = [], front = [];
      for (const sk of this.skiffs) {
        if (sk.behind === undefined || sk.moving || sk.view !== G.view) { sk.behind = this.behindShip(sk.x, sk.y); sk.view = G.view; }
        (sk.behind ? back : front).push(sk);
      }
      const drawSkiffs = (list) => {
        for (const sk of list) {
          const alpha = sk.state === 'leave' ? Math.max(0, 1 - sk.t / 3) : 1;
          ctx.globalAlpha = alpha;
          const seat = A.skiff(ctx, sk, t, -A.HULL);
          const u = sk.unit;
          if (u && u.state === 'boat') A.unit(ctx, Object.assign({}, u, { noShadow: true, moving: false }), seat[0], seat[1] + 2, t);
          ctx.globalAlpha = 1;
        }
      };
      drawSkiffs(back);

      const bob = this.bob();
      ctx.save();
      ctx.translate(0, bob);
      A.water(ctx, sh, t);
      const zone = !this.started ? 0.17 + 0.07 * Math.sin(t * 4) : this.zoneFlash > 0 ? 0.26 * Math.min(1, this.zoneFlash) : 0;
      if (zone > 0) {
        ctx.setLineDash([12, 10]); ctx.lineDashOffset = -t * 25;
        ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.9, zone * 3.5)})`; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
        G.path(ctx, sh.foam.map(([x, y, nx, ny]) => P(x + nx * 1.35, y + ny * 1.35, -A.HULL))); ctx.stroke();
        ctx.setLineDash([]);
      }
      // skrov, däck, skuggor och ruiner ändras sällan: rita dem i ett förrenderat lager
      if (!this.layer) this.layer = new G.Layer();
      if (this.layerView !== G.view) {
        const b = A.shipBounds(sh);
        this.layerBounds = { x0: b.x0 - 10, y0: b.y0 - 28, x1: b.x1 + 10, y1: b.y1 + 10 };
        this.layerView = G.view;
      }
      const drawStatic = (c) => {
        A.hull(c, sh, t);
        A.deck(c, sh, t);
        for (const b of this.buildings) if (!b.alive) A.rubble(c, b, sh, t, true);
        for (const b of this.buildings) if (b.alive) A.buildingShadow(c, b);
      };
      const key = cam.z.toFixed(4) + '|' + dpr + '|' + (this.layerVer || 0) + '|' + G.view;
      if (this.layer.ensure(key, this.layerBounds, cam.z * dpr, drawStatic)) this.layer.blit(ctx);
      else drawStatic(ctx);
      if (zone > 0) {
        // vitt band innanför relingen = här kan man också trycka
        const pts = sh.poly.map(([x, y]) => P(x, y, 0));
        ctx.save(); G.path(ctx, pts); ctx.clip();
        ctx.strokeStyle = `rgba(255,255,255,${zone})`; ctx.lineWidth = 2 * 2.3 * ((G.SX + G.SY) / 2) * 0.9; ctx.lineJoin = 'round';
        G.path(ctx, pts); ctx.stroke();
        ctx.restore();
      }
      if (this.bridgeDown) { const br = this.buildings.find((b) => b.type === 'brygga'); const [X, Y] = P(br.cx, br.cy, 0); A.flag(ctx, X, Y - 58, 'pirate', t, 1.15); }
      for (const m of this.marks) { ctx.globalAlpha = Math.min(1, m.t / 2) * 0.5; G.disc(ctx, m.x, m.y, 0.7, 0, '#2a2420', null); ctx.globalAlpha = 1; }
      for (const s of this.spells) A.spellZone(ctx, s, t);
      if (this.inspect && this.inspect.b.alive && this.inspect.b.def.range) {
        const b = this.inspect.b;
        G.disc(ctx, b.cx, b.cy, b.def.range + b.w / 2, 0, 'rgba(255,255,255,.12)', 'rgba(255,255,255,.75)', 2);
        if (b.def.minRange) G.disc(ctx, b.cx, b.cy, b.def.minRange, 0, null, 'rgba(255,120,120,.75)', 2);
      }
      const items = [];
      for (const b of this.buildings) if (b.alive) items.push([G.depth(b.cx, b.cy), 0, b]);
      for (const w of this.walls) if (w.alive) items.push([G.depth(w.x + 0.5, w.y + 0.5), 1, w]);
      for (const u of this.units) if (u.hp > 0 && (u.state === 'deck' || u.state === 'jump')) items.push([G.depth(u.x, u.y) + (u.state === 'jump' ? 50 : 0), 2, u]);
      items.sort((p, q) => p[0] - q[0]);
      A.spriteScale = cam.z * dpr;
      for (const [, kind, o] of items) {
        if (kind === 0) A.building(ctx, o, sh, t, { pirate: false });
        else if (kind === 1) A.wall(ctx, o, sh, t);
        else {
          const [X, Y] = P(o.x, o.y, o.state === 'jump' ? o.jz : 0);
          if (o.state === 'jump') {
            const sk = this.skiffs.find((s) => s.unit === o);
            if (sk) { const [SX, SY] = P(o.j1[0], o.j1[1], 8); ctx.strokeStyle = '#c9a26b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(SX, SY); ctx.lineTo(X, Y - 20); ctx.stroke(); }
          }
          A.unit(ctx, Object.assign({}, o, { yell: o.yellT > 0, noShadow: o.state === 'jump' }), X, Y, t);
        }
      }
      A.spriteScale = 0;
      for (const pr of this.proj) A.projectile(ctx, pr);
      const low = [];
      for (const p of this.fx) { if (p.z >= -2 || K.ship.inPoly(sh.poly, p.x, p.y)) A.particle(ctx, p); else low.push(p); }
      ctx.restore();
      for (const p of low) A.particle(ctx, p);
      drawSkiffs(front);

      // livsmätare
      ctx.save(); ctx.translate(0, bob);
      for (const b of this.buildings) {
        if (!b.alive || this.time - b.lastHit > 3.5) continue;
        const [X, Y] = P(b.cx, b.cy, (B_HEIGHT[b.type] || 20) * (b.type === 'container' ? b.stack : 1) + 12);
        const f = b.hp / b.maxHp;
        A.hpBar(ctx, X, Y, f, f > 0.5 ? '#7be043' : f > 0.25 ? '#ffc93a' : '#ff5a3a', 34);
      }
      for (const u of this.units) {
        if (u.hp <= 0 || u.state !== 'deck') continue;
        const hero = u.type === 'kapten';
        if (u.hp >= u.maxHp && !hero) continue;
        const s = (A.SPEC[u.type] || A.SPEC.kampe).s * A.unitScale;
        const [X, Y0] = P(u.x, u.y, 0);
        const Y = Y0 - 44 * s - 6;
        A.hpBar(ctx, X, Y, u.hp / u.maxHp, u.side === 'p' ? '#7be043' : '#ff5a3a', hero ? 30 : 18);
        if (hero) A.crown(ctx, X, Y - 3);
      }
      if (this.deployFail) {
        const f = this.deployFail.t / 0.7;
        ctx.globalAlpha = f;
        G.disc(ctx, this.deployFail.x, this.deployFail.y, 0.9 + (1 - f) * 0.6, 0, 'rgba(255,60,60,.25)', '#ff4b3a', 3);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
  }

  K.Battle = Battle;
  K.B_HEIGHT = B_HEIGHT;

  // ---------- huvudlös simulering för balansering ----------
  K.simulate = function (shipId, army, o = {}) {
    const def = D.ships.find((s) => s.id === shipId);
    const save = { army: Object.assign({}, army), spells: Object.assign({}, o.spells || {}), levels: o.levels || {}, captured: {} };
    const bt = new Battle(def, save, { headless: true });
    // utplaceringspunkter längs skrovet (vatten)
    const spots = [];
    const sides = o.sides || 2;
    const cands = [[bt.W * 0.25, -1.5], [bt.W * 0.55, bt.H + 1.5], [-1.5, bt.H / 2], [bt.W * 0.75, -1.5], [bt.W + 1.5, bt.H / 2]];
    for (let i = 0; i < sides; i++) spots.push(cands[i]);
    const order = ['bjasse', 'bombare', 'kampe', 'skytt', 'plundrare'];
    const queue = [];
    let tt = 0;
    for (const k of order) for (let i = 0; i < (army[k] || 0); i++) { queue.push([tt, k, spots[i % spots.length]]); tt += 0.12; }
    if (o.hero !== false) queue.push([1.5, 'kapten', spots[0]]);
    queue.sort((a, b) => a[0] - b[0]);
    let qi = 0;
    const spellQ = [];
    for (const k in save.spells) for (let i = 0; i < save.spells[k]; i++) spellQ.push(k);
    let nextSpell = 7;
    while (!bt.ended && bt.time < 260) {
      while (qi < queue.length && queue[qi][0] <= bt.time) {
        const [, k, s] = queue[qi++];
        bt.deploy(k, s[0] + (Math.random() - 0.5) * 2, s[1] + (Math.random() - 0.5));
      }
      if (bt.heroUnit && !bt.abilityUsed && bt.heroUnit.state === 'deck' && bt.heroUnit.hp < bt.heroUnit.maxHp * 0.5) bt.useAbility();
      if (spellQ.length && bt.time > nextSpell) {
        const alive = bt.units.filter((u) => u.side === 'p' && u.hp > 0 && u.state === 'deck');
        if (alive.length > 2) {
          const cx = alive.reduce((a, u) => a + u.x, 0) / alive.length, cy = alive.reduce((a, u) => a + u.y, 0) / alive.length;
          bt.castSpell(spellQ.shift(), cx, cy);
        }
        nextSpell += 6;
      }
      bt.step(1 / 30);
      bt.events.length = 0;
    }
    return { stars: bt.stars, pct: bt.pct, loot: Math.round(bt.loot), time: Math.round(bt.elapsed), bridge: bt.bridgeDown };
  };
})();

  class Harbor {
    constructor(game, portrait) {

      for (const [u, v] of L.acacias) this.deco.push({ type: 'acacia', ...this.pt(u, v), s: 0.9 + r() * 0.3, ph: r() * 6 });
      for (const [u, v] of L.rocks) this.deco.push({ type: 'rock', ...this.pt(u, v), s: 0.7 + r() * 0.6, ph: r() * 6 });
      for (const [u, v] of L.barrels) this.deco.push({ type: 'barrel', ...this.pt(u, v), s: 1, ph: r() });
      this.jetties = L.jetties;

      for (const [u, v] of L.moored) this.moored.push({ ...this.pt(u, v), ang: 0.785 + (r() - 0.5) * 0.6, seed: r() * 9, color: ['#2f7fd1', '#3aa357', '#e8b021'][(r() * 3) | 0] });
      this.camels = L.camels.map(([u, v], i) => ({ ...this.pt(u, v), tx: 0, ty: 0, wait: r() * 3, walk: 0, facing: 1, id: i }));
      this.crew = [];
      const types = ['kampe', 'skytt', 'kampe', 'plundrare', 'skytt'];

    }
    pt(u, v) { const [x, y] = W(u, v); return { x, y }; }

    refreshFleet() {
      const save = this.game.save;
      this.fleet = [];
      let i = 0;
      for (const def of D.ships) {
        if (!save.captured[def.id]) continue;
        const sh = K.ship.build(def);
        for (const b of sh.buildings) { b.alive = true; b.cx = b.x + b.w / 2; b.cy = b.y + b.h / 2; b.ang = (b.seed % 628) / 100; }
        const [u, v] = this.L.slots[i++ % this.L.slots.length];

    }

    onLand(x, y) { return K.ship.inPoly(this.land, x, y) && x + y < coast(x - y) - 1.5; }
    blocked(x, y) {
      for (const b of [this.fort, this.camp, this.forge, this.light]) if (x > b.x - 0.3 && x < b.x + b.w + 0.3 && y > b.y - 0.3 && y < b.y + b.h + 0.3) return true;

    }
    randomLandPoint(r) {
      for (let k = 0; k < 30; k++) {
        const wu = this.L.walkU, u = -wu + Math.random() * wu * 2, v = 2 + Math.random() * 15;
        const [x, y] = W(u, v);

    update(dt) {
      this.t += dt;
      const walkers = [...this.crew.map((c) => [c, 1.4]), ...this.camels.map((c) => [c, 0.6])];
      for (const [c, spd] of walkers) {
        if (c.wait > 0) { c.wait -= dt; c.moving = false; if (c.wait <= 0) { const [x, y] = this.randomLandPoint(); c.tx = x; c.ty = y; } continue; }
        const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
        if (d < 0.1) { c.wait = 1.5 + Math.random() * 4; c.moving = false; continue; }
        const nx = c.x + (dx / d) * spd * dt, ny = c.y + (dy / d) * spd * dt;

    bounds() {
      if (this.portrait) {
        const last = this.fleet.length ? this.L.slots[this.fleet.length - 1][1] + 9 : 30;
        return { x0: -11.5 * 32, x1: 11.5 * 32, y0: -40, y1: last * 16 };
      }
      const ys = this.fleet.length > 3 ? 54 : this.fleet.length ? 40 : 30;
      return { x0: -26 * 32, x1: 26 * 32, y0: -2 * 16 - 60, y1: ys * 16 };
    }

    // ---------- ritning ----------
    render(ctx, cam, cw, ch, dpr, t) {
      // statisk terräng ritas i ett skärmstort lager som bara görs om när kameran rör sig
      if (!this.layer) this.layer = document.createElement('canvas');
      const key = [cam.x.toFixed(2), cam.y.toFixed(2), cam.z.toFixed(4), dpr, cw, ch, this.game.save.harborLvl].join('|');
      if (this.layerKey !== key) {
        this.layerKey = key;
        this.layer.width = ctx.canvas.width; this.layer.height = ctx.canvas.height;
        const c = this.layer.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);

        g.addColorStop(0, '#0f6c8a'); g.addColorStop(1, '#0b5873');
        c.fillStyle = g; c.fillRect(0, 0, cw, ch);

      ctx.beginPath();
      this.coastPts.forEach(([x, y], i) => { const o = 0.35 + Math.sin(t * 1.8 + i * 0.7) * 0.18; const [X, Y] = P(x + o, y + o, WL); if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); });
      ctx.stroke();
      for (const [u, v, len] of this.jetties) this.jetty(ctx, u, v, len);
