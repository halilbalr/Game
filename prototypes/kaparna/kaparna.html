    }

    terrain(ctx) {
      // grunt vatten nära kusten
      const shallow = this.coastPts.map(([x, y]) => P(x + 1.6, y + 1.6, WL)).concat([P(...W(90, coast(90) - 4), WL), P(...W(-90, coast(-90) - 4), WL)]);
      G.poly(ctx, shallow, '#2bb3c4', null);
      const mid = this.coastPts.map(([x, y]) => P(x + 4.5, y + 4.5, WL)).concat([P(...W(90, 0), WL), P(...W(-90, 0), WL)]);
      ctx.globalAlpha = 0.35; G.poly(ctx, mid, '#1c97b0', null); ctx.globalAlpha = 1;
      // land med kantsida
      for (let i = 0; i < this.coastPts.length - 1; i++) {
        const a = this.coastPts[i], b = this.coastPts[i + 1];
        G.poly(ctx, [P(a[0], a[1], 0), P(b[0], b[1], 0), P(b[0], b[1], WL), P(a[0], a[1], WL)], '#c9a464', null);
      }
      G.poly(ctx, this.land.map(([x, y]) => P(x, y, 0)), '#ecd29b', null);
      ctx.save(); G.path(ctx, this.land.map(([x, y]) => P(x, y, 0))); ctx.clip();
      for (const [x, y, r, k] of this.sandPatches) G.disc(ctx, x, y, r, 0, k > 0.5 ? 'rgba(201,164,100,.35)' : 'rgba(150,160,80,.22)', null);
      // våt sand
      ctx.strokeStyle = 'rgba(176,140,80,.5)'; ctx.lineWidth = 10; ctx.beginPath();
      this.coastPts.forEach(([x, y], i) => { const [X, Y] = P(x - 0.35, y - 0.35, 0); if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); });
      ctx.stroke();
      // stigar

      ctx.beginPath();
      for (const b of [this.camp, this.forge]) { const a = P(this.fort.cx, this.fort.cy, 0), e = P(b.cx, b.cy, 0); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]); }

    drawLive(ctx, t) {
      const cam = this.game.camHome, dpr = this.game.dpr;
      // föremål på land, djupsorterade
      const items = [];
      for (const b of [this.fort, this.camp, this.forge, this.light]) items.push([b.cx + b.cy, b]);
      for (const d of this.deco) items.push([d.x + d.y, d]);
      for (const c of this.crew) items.push([c.x + c.y, { type: 'crew', c }]);
      for (const c of this.camels) items.push([c.x + c.y, { type: 'camel', c }]);

    }

    jetty(ctx, u, v, len) {
      const [x0, y0] = W(u, v - 1.2), [x1, y1] = W(u, v + len);
      // längs (1,1): bredd vinkelrätt i u-led
      const hw = 0.55;
      const corners = (zz) => [P(x0 + hw / 2, y0 - hw / 2, zz), P(x1 + hw / 2, y1 - hw / 2, zz), P(x1 - hw / 2, y1 + hw / 2, zz), P(x0 - hw / 2, y0 + hw / 2, zz)];
      const steps = Math.round(len + 1.2);
      for (let i = 0; i <= steps; i += 1.5) {
        const f = i / steps;

      }

      G.poly(ctx, [top[1], top[2], bot[2], bot[1]], G.col('#8a5a2b', -0.3), OUT, 1.4);

      G.poly(ctx, top, '#a8743e', OUT, 1.6);
      ctx.strokeStyle = 'rgba(60,35,15,.45)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 1; i < steps * 2; i++) { const f = i / (steps * 2); const x = x0 + (x1 - x0) * f, y = y0 + (y1 - y0) * f; const a = P(x + hw / 2, y - hw / 2, -2), b = P(x - hw / 2, y + hw / 2, -2); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
      ctx.stroke();
    }

    drawItem(ctx, o, t) {
      switch (o.type) {
        case 'fort': return this.drawFort(ctx, o, t);
        case 'camp': return this.drawCamp(ctx, o, t);
        case 'forge': return this.drawForge(ctx, o, t);
        case 'light': return this.drawLight(ctx, o, t);
        case 'palm': return drawPalm(ctx, o, t);
        case 'acacia': return drawAcacia(ctx, o, t);
        case 'rock': { const [X, Y] = P(o.x, o.y, 0); G.blob(ctx, X, Y - 4 * o.s, 12 * o.s, 7 * o.s, '#9c8f7e', OUT, 1.6); G.blob(ctx, X - 3 * o.s, Y - 7 * o.s, 5 * o.s, 3 * o.s, 'rgba(255,255,255,.25)', null); return; }
        case 'barrel': { G.cyl(ctx, o.x, o.y, 0.22, 0, 16, '#8a5a2b'); const [X, Y] = P(o.x, o.y, 8); ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(X, Y, 10, 5, 0, 0, Math.PI); ctx.stroke(); return; }
        case 'crew': { const c = o.c; const [X, Y] = P(c.x, c.y, 0); A.unit(ctx, { ...c, type: c.type }, X, Y, t); return; }
        case 'camel': return drawCamel(ctx, o.c, t);
      }
    }

    sel(b) { return this.game.harborSel === b.type; }

    drawFort(ctx, b, t) {
      const x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h, wall = '#f3efe6';
      const lvl = this.game.save.harborLvl;
      G.box(ctx, x0 + 0.3, y0 + 0.3, x1 - 0.3, y1 - 0.3, 0, 34, wall);
      // kreneleringar
      for (let i = 0; i < 5; i++) {
        const f = 0.15 + i * 0.175;
        const xa = x0 + 0.3 + (x1 - x0 - 0.6) * f;
        G.box(ctx, xa, y1 - 0.5, xa + 0.3, y1 - 0.3, 34, 41, wall, { lw: 1.2 });
        const ya = y0 + 0.3 + (y1 - y0 - 0.6) * f;
        G.box(ctx, x1 - 0.5, ya, x1 - 0.3, ya + 0.3, 34, 41, wall, { lw: 1.2 });
      }
      // port med ljusblå dörr
      const cx = (x0 + x1) / 2;
      G.poly(ctx, [P(cx - 0.45, y1 - 0.3, 0), P(cx - 0.45, y1 - 0.3, 16), P(cx - 0.25, y1 - 0.3, 22), P(cx + 0.25, y1 - 0.3, 22), P(cx + 0.45, y1 - 0.3, 16), P(cx + 0.45, y1 - 0.3, 0)], G.col('#4aa3df'), OUT, 1.6);
      G.line(ctx, P(cx, y1 - 0.3, 0), P(cx, y1 - 0.3, 22), OUT, 1.2);
      G.poly(ctx, [P(x1 - 0.3, b.cy - 0.25, 26), P(x1 - 0.3, b.cy + 0.25, 26), P(x1 - 0.3, b.cy + 0.25, 18), P(x1 - 0.3, b.cy - 0.25, 18)], G.col('#2d4a6b'), OUT, 1.2);
      // torn i hörnen
      for (const [x, y] of [[x0 + 0.45, y0 + 0.45], [x1 - 0.45, y0 + 0.45], [x0 + 0.45, y1 - 0.45], [x1 - 0.45, y1 - 0.45]]) {
        const h = 46 + lvl * 3;
        G.cyl(ctx, x, y, 0.5, 0, h, wall);
        G.cyl(ctx, x, y, 0.58, h, h + 7, '#e6dfcf');
        G.disc(ctx, x, y, 0.36, h + 7, '#c9bfa8', null);
      }
      const [FX, FY] = P(x0 + 0.45, y0 + 0.45, 53 + lvl * 3);
      A.flag(ctx, FX, FY - 30, 'pirate', t, 1.3);
      // nivåmärke
      const [LX, LY] = P(x1 - 0.3, b.cy, 30);
      G.blob(ctx, LX + 6, LY - 2, 9, 9, '#ffcf3a', OUT, 2);
      ctx.fillStyle = OUT; ctx.font = '700 11px "Lilita One", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(lvl), LX + 6, LY - 1);
    }

    drawCamp(ctx, b, t) {
      const cx = b.cx, cy = b.cy;
      // tält
      const base = [[cx - 1.5, cy - 1.2], [cx + 0.4, cy - 1.2], [cx + 0.4, cy + 0.7], [cx - 1.5, cy + 0.7]];
      const apex = P(cx - 0.55, cy - 0.25, 62);
      const pb = base.map(([x, y]) => P(x, y, 0));
      G.poly(ctx, [pb[3], pb[2], apex], '#c8402e');
      G.poly(ctx, [pb[2], pb[1], apex], '#e3e3dc');
      ctx.save(); G.path(ctx, [pb[3], pb[2], apex]); ctx.clip();
      ctx.fillStyle = '#f4f1ea';
      for (let i = 0; i < 5; i++) { const a = P(cx - 1.5 + i * 0.42, cy + 0.7, 0); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(apex[0], apex[1]); ctx.lineTo(a[0] + 9, a[1] - 4); ctx.closePath(); ctx.fill(); }
      ctx.restore();
      G.poly(ctx, [pb[3], pb[2], apex], null);
      G.poly(ctx, [P(cx - 0.85, cy + 0.7, 0), P(cx - 0.55, cy + 0.7, 22), P(cx - 0.25, cy + 0.7, 0)], '#3b2412', OUT, 1.2);
      // lägereld
      const fx = cx + 0.8, fy = cy + 0.8;
      for (const a of [0.3, 1.9, 3.5]) G.thick(ctx, P(fx - Math.cos(a) * 0.35, fy - Math.sin(a) * 0.35, 2), P(fx + Math.cos(a) * 0.35, fy + Math.sin(a) * 0.35, 4), '#6b4024', 4);
      const [X, Y] = P(fx, fy, 4);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 4; i++) {
        const h = 10 + Math.sin(t * 12 + i * 1.7) * 4;
        G.blob(ctx, X + (i - 1.5) * 3, Y - h / 2, 4, h / 2 + 2, i % 2 ? '#ff8a1c' : '#ffd23f', null);
      }
      ctx.globalCompositeOperation = 'source-over';
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, 40);
      g.addColorStop(0, 'rgba(255,170,60,.35)'); g.addColorStop(1, 'rgba(255,170,60,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, 40, 0, 7); ctx.fill();
      // skylt
      const [SX, SY] = P(cx + 1.1, cy - 0.9, 0);
      G.line(ctx, [SX, SY], [SX, SY - 26], '#5a3a20', 3);
      G.poly(ctx, [[SX - 16, SY - 34], [SX + 16, SY - 34], [SX + 16, SY - 22], [SX - 16, SY - 22]], '#a8743e', OUT, 1.5);
      ctx.fillStyle = '#fff'; ctx.font = '10px "Lilita One", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ARMÉ', SX, SY - 27.5);
    }

    drawForge(ctx, b, t) {
      const cx = b.cx, cy = b.cy;
      G.box(ctx, b.x + 0.4, b.y + 0.4, b.x + b.w - 0.6, b.y + b.h - 0.6, 0, 26, '#d9c8a6');
      G.poly(ctx, [P(b.x + b.w - 0.6, cy - 0.3, 18), P(b.x + b.w - 0.6, cy + 0.3, 18), P(b.x + b.w - 0.6, cy + 0.3, 0), P(b.x + b.w - 0.6, cy - 0.3, 0)], '#3b2412', OUT, 1.3);
      // stråtak
      const r = [P(b.x + 0.15, b.y + 0.15, 26), P(b.x + b.w - 0.35, b.y + 0.15, 26), P(b.x + b.w - 0.35, b.y + b.h - 0.35, 26), P(b.x + 0.15, b.y + b.h - 0.35, 26)];
      const apex = P(cx - 0.1, cy - 0.1, 58);
      G.poly(ctx, [r[3], r[2], apex], G.col('#c49a4a', -0.15));
      G.poly(ctx, [r[2], r[1], apex], G.col('#d8b25e'));
      ctx.strokeStyle = 'rgba(90,60,20,.45)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 1; i < 8; i++) { const f = i / 8; for (const [a, c] of [[r[3], r[2]], [r[2], r[1]]]) { const p = [a[0] + (c[0] - a[0]) * f, a[1] + (c[1] - a[1]) * f]; ctx.moveTo(p[0], p[1]); ctx.lineTo(apex[0], apex[1]); } }
      ctx.stroke();
      // städ och ässja
      const ax = b.x + b.w - 0.1, ay = cy + 0.9;
      G.box(ctx, ax - 0.35, ay - 0.15, ax + 0.1, ay + 0.15, 0, 7, '#3a3f48', { lw: 1.2 });
      G.box(ctx, ax - 0.5, ay - 0.2, ax + 0.25, ay + 0.2, 7, 12, '#4a5058', { lw: 1.2 });
      const [GX, GY] = P(b.x + b.w - 0.6, cy - 0.9, 8);
      const gl = 0.5 + Math.sin(t * 5) * 0.2;
      const g = ctx.createRadialGradient(GX, GY, 0, GX, GY, 26);
      g.addColorStop(0, `rgba(255,140,40,${gl})`); g.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(GX, GY, 26, 0, 7); ctx.fill();
      for (let i = 0; i < 3; i++) {
        const f = (((t * 0.4 + i / 3) % 1) + 1) % 1;
        const [X, Y] = P(cx - 0.1 - f * 0.5, cy - 0.1 - f * 0.3, 60 + f * 50);
        ctx.globalAlpha = (1 - f) * 0.5; G.blob(ctx, X, Y, 5 + f * 9, 4 + f * 8, '#d6d6d6', null); ctx.globalAlpha = 1;
      }
      const [SX, SY] = P(b.x + 0.2, b.y + b.h + 0.1, 0);
      G.line(ctx, [SX, SY], [SX, SY - 26], '#5a3a20', 3);
      G.poly(ctx, [[SX - 20, SY - 34], [SX + 20, SY - 34], [SX + 20, SY - 22], [SX - 20, SY - 22]], '#a8743e', OUT, 1.5);
      ctx.fillStyle = '#fff'; ctx.font = '10px "Lilita One", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('SMEDJA', SX, SY - 27.5);
    }

    drawLight(ctx, b, t) {
      const cx = b.cx, cy = b.cy;
      G.cyl(ctx, cx, cy, 0.62, 0, 10, '#9c8f7e');
      const bands = ['#f4f4f4', '#d23b2c', '#f4f4f4', '#d23b2c', '#f4f4f4'];
      bands.forEach((c, i) => G.cyl(ctx, cx, cy, 0.48 - i * 0.03, 10 + i * 18, 28 + i * 18, c));
      const top = 100;
      G.cyl(ctx, cx, cy, 0.5, top, top + 4, '#22252c');
      G.cyl(ctx, cx, cy, 0.34, top + 4, top + 16, '#fff3a0');
      G.cyl(ctx, cx, cy, 0.42, top + 16, top + 20, '#d23b2c');
      const [X, Y] = P(cx, cy, top + 10);
      const a = t * 1.2;
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(X, Y, 0, X, Y, 160);
      gr.addColorStop(0, 'rgba(255,245,180,.45)'); gr.addColorStop(1, 'rgba(255,245,180,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.arc(X, Y, 160, a - 0.18, a + 0.18); ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    // ---------- tryck ----------
    hit(X, Y) {
      for (const f of this.fleet) {
        if (this.shipGold(f) < 1) continue;
        const [BX, BY] = this.bubblePos(f);
        if (Math.hypot(X - BX, Y - BY) < 30) return { type: 'collect', f };
      }
      const box = (b, h) => {
        const pts = [P(b.x, b.y, 0), P(b.x + b.w, b.y, 0), P(b.x + b.w, b.y + b.h, 0), P(b.x, b.y + b.h, 0), P(b.x, b.y, h)];
        const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
        return X >= Math.min(...xs) && X <= Math.max(...xs) && Y >= Math.min(...ys) && Y <= Math.max(...ys);
      };
      if (box(this.fort, 70)) return { type: 'fort' };
      if (box(this.camp, 50)) return { type: 'camp' };
      if (box(this.forge, 60)) return { type: 'forge' };
      for (const f of this.fleet) {
        const [SX, SY] = P(f.cx, f.cy, WL);
        if (Math.abs(X - SX) < f.def.len * SHIP_SCALE * 22 && Math.abs(Y - SY + 20) < f.def.len * SHIP_SCALE * 12) return { type: 'ship', f };
      }
      return null;
    }
  }

  function drawPalm(ctx, o, t) {
    const [X, Y] = P(o.x, o.y, 0);
    const s = o.s, sway = Math.sin(t * 1.3 + o.ph) * 3 * s;
    G.shadow(ctx, X + 10 * s, Y + 3, 22 * s, 9 * s, 0.16);
    const tx = X + 8 * s + sway, ty = Y - 70 * s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = OUT; ctx.lineWidth = 9 * s;
    ctx.beginPath(); ctx.moveTo(X, Y); ctx.quadraticCurveTo(X - 2 * s, Y - 40 * s, tx, ty); ctx.stroke();
    ctx.strokeStyle = '#8a6440'; ctx.lineWidth = 6 * s; ctx.stroke();
    ctx.strokeStyle = '#6e4f31'; ctx.lineWidth = 1.2;
    for (let i = 1; i < 7; i++) { const f = i / 7; const px = X + (tx - X) * f * f * 0.9 - 2 * s * (1 - f), py = Y + (ty - Y) * f; ctx.beginPath(); ctx.moveTo(px - 3 * s, py); ctx.lineTo(px + 3 * s, py - 1); ctx.stroke(); }
    for (let k = 0; k < 7; k++) {
      const a = (k / 7) * Math.PI * 2 + Math.sin(t + o.ph + k) * 0.06;
      const ex = tx + Math.cos(a) * 30 * s, ey = ty + Math.sin(a) * 12 * s + 10 * s;
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + Math.cos(a) * 18 * s, ty + Math.sin(a) * 7 * s - 12 * s, ex, ey);
      ctx.quadraticCurveTo(tx + Math.cos(a) * 14 * s, ty + Math.sin(a) * 6 * s - 3 * s, tx, ty);
      ctx.fillStyle = k % 2 ? '#3f9a3a' : '#52b448'; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = OUT; ctx.stroke();
    }
    for (const dx of [-3, 3]) G.blob(ctx, tx + dx * s, ty + 4 * s, 3.2 * s, 3.2 * s, '#6b4a22', OUT, 1);
  }

  function drawAcacia(ctx, o, t) {
    const [X, Y] = P(o.x, o.y, 0);
    const s = o.s;
    G.shadow(ctx, X, Y + 2, 30 * s, 12 * s, 0.16);
    ctx.lineCap = 'round';
    for (const [dx, h] of [[-10, 38], [8, 42], [0, 46]]) {
      G.thick(ctx, [X, Y], [X + dx * s, Y - h * s], '#6b4a2e', 4 * s);
    }
    const sway = Math.sin(t * 0.9 + o.ph) * 1.5;
    G.blob(ctx, X + sway, Y - 50 * s, 38 * s, 11 * s, '#4f7a2e', OUT, 1.8);
    G.blob(ctx, X - 6 * s + sway, Y - 55 * s, 26 * s, 8 * s, '#679a3b', null);
    G.blob(ctx, X + 10 * s + sway, Y - 53 * s, 14 * s, 5 * s, '#7cb247', null);
  }

  function drawCamel(ctx, c, t) {
    const [X, Y] = P(c.x, c.y, 0);
    G.shadow(ctx, X, Y, 20, 7, 0.22);
    ctx.save(); ctx.translate(X, Y); ctx.scale(c.facing, 1);
    const w = c.moving ? c.walk : 0;
    const col = '#c99a5b';
    for (const [lx, ph] of [[-9, 0], [-5, Math.PI], [6, Math.PI / 2], [10, Math.PI * 1.5]]) {
      const sw = c.moving ? Math.sin(w + ph) * 3 : 0;
      G.thick(ctx, [lx, -18], [lx + sw, -1], G.col(col, -0.2), 3.2);
    }
    const bob = c.moving ? Math.abs(Math.sin(w)) * 1.5 : 0;
    G.blob(ctx, 0, -23 - bob, 15, 7.5, G.col(col), OUT, 1.6);
    G.blob(ctx, -2, -31 - bob, 7.5, 6.5, G.col(col, 0.05), OUT, 1.6);
    G.thick(ctx, [12, -24 - bob], [19, -38 - bob], G.col(col), 5);
    G.blob(ctx, 22, -39 - bob, 5.5, 3.6, G.col(col), OUT, 1.4);
    G.blob(ctx, 23, -40 - bob, 1, 1, OUT, null);
    G.blob(ctx, -14, -22 - bob, 2, 4, G.col(col, -0.25), OUT, 1);
    ctx.fillStyle = '#c8402e'; ctx.fillRect(-6, -30 - bob, 9, 3);
    ctx.restore();
  }

  K.Harbor = Harbor;
  K.HARBOR_WL = WL;
})();

<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Är det roligt att kapa skepp med Clash-liknande anfall?
// Date: 2026-10-22
//
// DOM-gränssnitt: HUD, sjökort, armé, smedja, stridskort, resultat, tips.
(function () {
  const K = window.K, D = K.DATA, A = K.art;
  const $ = (id) => document.getElementById(id);
  const UI = (K.ui = {});
  const COIN = '<svg class="ci" width="18" height="18" style="vertical-align:-3px"><use href="#i-coin"/></svg>';
  const LOCK = '<svg><use href="#i-lock"/></svg>';
  const STAR = '<svg><use href="#i-star"/></svg>';
  const fmt = (n) => Math.floor(n).toLocaleString('sv-SE');
  UI.fmt = fmt;

  // ---------- hjälpare för spelregler ----------
  UI.captured = (s) => D.ships.filter((d) => s.captured[d.id]).length;
  UI.armyCap = (s) => D.harbor[s.harborLvl - 1].army;
  UI.spellCap = (s) => D.harbor[s.harborLvl - 1].spells;
  UI.armyUsed = (s) => Object.keys(D.troops).reduce((a, k) => a + (s.army[k] || 0) * D.troops[k].space, 0);
  UI.spellUsed = (s) => Object.keys(D.spells).reduce((a, k) => a + (s.spells[k] || 0) * D.spells[k].space, 0);
  UI.levelCap = (s) => Math.min(D.maxLevel, s.harborLvl + 1);
  UI.unlocked = (s, key) => {
    const def = D.troops[key] || D.spells[key];
    return !def || UI.captured(s) >= (def.unlock || 0);
  };
  UI.defOf = (key) => (key === 'kapten' ? D.hero : D.troops[key] || D.spells[key]);
  UI.upCost = (key, lvl) => Math.round(D.upgradeCost[lvl] * (UI.defOf(key).upgradeMul || 1));
  UI.lvMul = (lvl) => 1 + D.levelScale * (lvl - 1);

  // ---------- små meddelanden ----------
  let toastT = 0;
  UI.toast = function (msg, ms = 1700) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms);
  };
  let bigT = 0;
  UI.bigMsg = function (html, ms = 2400) {
    const el = $('big-msg');
    el.innerHTML = html; el.hidden = false; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(bigT); bigT = setTimeout(() => { el.hidden = true; el.classList.remove('show'); }, ms);
  };
  UI.hint = function (text, top) {
    const el = $('hint');
    if (!text) { el.hidden = true; return; }
    el.textContent = text; el.classList.toggle('top', !!top); el.hidden = false;
  };

  // ---------- paneler ----------
  let panelBuild = null;
  UI.showPanel = function (title, build) {
    $('panel-title').textContent = title;
    panelBuild = build;
    build($('panel-body'));
    $('panel').hidden = false;
  };
  UI.refreshPanel = function () { if (!$('panel').hidden && panelBuild) { const b = $('panel-body'), st = b.scrollTop; panelBuild(b); b.scrollTop = st; } };
  UI.closePanel = function () { $('panel').hidden = true; panelBuild = null; };
  UI.panelOpen = () => !$('panel').hidden;

  UI.confirm = function (title, text, yesLabel, onYes) {
    $('confirm-title').textContent = title;
    $('confirm-text').textContent = text;
    $('confirm-yes').textContent = yesLabel;
    $('confirm').hidden = false;
    $('confirm-yes').onclick = () => { $('confirm').hidden = true; onYes(); };
    $('confirm-no').onclick = () => { $('confirm').hidden = true; };
  };

  function portrait(cv, key) { A.portrait(cv, key); }

  // ---------- sjökort ----------
  const PLURAL = { kanon: ['kanon', 'kanoner'], vatten: ['vattenkanon', 'vattenkanoner'], utkik: ['utkikstorn', 'utkikstorn'], morsare: ['mörsare', 'mörsare'], vaktkur: ['vaktkur', 'vaktkurer'] };
  function defenseSummary(def) {
    const c = {};
    for (const e of def.layout) if (PLURAL[e[0]]) c[e[0]] = (c[e[0]] || 0) + 1;
    const parts = Object.keys(PLURAL).filter((k) => c[k]).map((k) => `${c[k]} ${PLURAL[k][c[k] > 1 ? 1 : 0]}`);
    const walls = (def.walls || []).reduce((a, w) => a + w[2], 0);
    if (walls) parts.push('barrikader');
    return parts.join(', ');
  }

  UI.renderMap = function (g, body) {
    const s = g.save;
    const used = UI.armyUsed(s), cap = UI.armyCap(s);
    const troopTxt = Object.keys(D.troops).filter((k) => s.army[k] > 0).map((k) => `${s.army[k]} ${D.troops[k].name.toLowerCase()}`).join(' · ') || 'Inga trupper';
    let html = `<div class="army-strip"><div><div class="sec-title">Din armé: ${used}/${cap} platser</div><div class="sub">${troopTxt} · Kaptenen följer alltid med</div></div><button class="btn btn-blue ol" data-act="army">Ändra armé</button></div>`;
    D.ships.forEach((d, i) => {
      const open = i === 0 || s.captured[D.ships[i - 1].id];
      const cap2 = s.captured[d.id];
      const stars = s.stars[d.id] || 0;
      const loot = Math.round(d.loot * (cap2 ? 0.7 : 1)) + (cap2 ? 0 : Math.round(d.loot * 0.25));
      html += `<div class="ship-card ${open ? '' : 'locked'}">
        <canvas width="380" height="240" data-ship="${i}"></canvas>
        <div class="info">
          <h3>${d.name} <span class="tier">Nivå ${d.tier}</span>${cap2 ? '<span class="tag-cap">Kapad</span>' : ''}</h3>
          <p class="story">${d.story}</p>
          <div class="facts"><span>Försvar: <b>${defenseSummary(d)}</b></span><span>Byte: <b>≈ ${fmt(loot)}</b> ${COIN}</span><span>Inkomst när kapad: <b>+${d.income}/min</b></span></div>
          <div class="act"><div class="mstars">${[1, 2, 3].map((n) => STAR.replace('<svg>', `<svg class="${stars >= n ? 'on' : ''}">`)).join('')}</div>
          ${open ? `<button class="btn btn-orange ol" data-act="attack" data-i="${i}">${cap2 ? 'Plundra igen' : 'ANFALL!'}</button>` : `<span class="lockmsg">${LOCK} Kapa ${D.ships[i - 1].name.toLowerCase()} först</span>`}</div>
        </div></div>`;
    });
    body.innerHTML = html;
    body.querySelectorAll('canvas[data-ship]').forEach((cv) => { const d = D.ships[+cv.dataset.ship]; A.shipThumb(cv, d, !!s.captured[d.id]); });
    body.onclick = (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      K.sfx.play('click');
      if (b.dataset.act === 'army') UI.openArmy(g);
      if (b.dataset.act === 'attack') g.tryAttack(D.ships[+b.dataset.i]);
    };
  };
  UI.openMap = (g) => UI.showPanel('Sjökort – välj ditt byte', (b) => UI.renderMap(g, b));

  // ---------- armé ----------
  function statLine(key, lvl) {
    const d = UI.defOf(key), m = UI.lvMul(lvl);
    if (D.spells[key]) {
      if (key === 'lakning') return `<span>Läker <b>${Math.round(d.hps * m)}/s</b></span><span>Tid <b>${d.duration} s</b></span>`;
      return `<span>Skada <b>+${Math.round((d.dmgMul + 0.1 * (lvl - 1) - 1) * 100)} %</b></span><span>Fart <b>+${Math.round((d.spdMul - 1) * 100)} %</b></span>`;
    }
    const dps = key === 'bombare' ? d.dmg * m : (d.dmg * m) / d.atk;
    return `<span>Liv <b>${Math.round(d.hp * m)}</b></span><span>${key === 'bombare' ? 'Sprängskada' : 'Skada/s'} <b>${Math.round(dps)}</b></span>${d.space ? `<span>Plats <b>${d.space}</b></span>` : ''}`;
  }

  UI.renderArmy = function (g, body) {
    const s = g.save;
    const used = UI.armyUsed(s), cap = UI.armyCap(s), sUsed = UI.spellUsed(s), sCap = UI.spellCap(s);
    let html = `<div class="cap"><div class="cap-row"><span>Trupper</span><span>${used} / ${cap}</span></div><div class="bar ${used >= cap ? 'full' : ''}"><i style="width:${(used / cap) * 100}%"></i></div></div>`;
    html += `<p class="sub">Trupper du sätter ut i en strid är förbrukade efteråt. De du inte använder stannar kvar. Avträning ger tillbaka hela kostnaden.</p>`;
    html += '<div class="grid">';
    for (const key of Object.keys(D.troops)) {
      const d = D.troops[key], un = UI.unlocked(s, key), lv = s.levels[key] || 1, n = s.army[key] || 0;
      html += `<div class="ucard ${un ? '' : 'locked'}"><canvas width="200" height="160" data-p="${key}"></canvas>
        ${un ? `<span class="have ol">x${n}</span>` : ''}<span class="lvpip ol">Nv ${lv}</span>
        <h3>${d.name}</h3><span class="role">${d.role}</span><p class="desc">${d.desc}</p><div class="stats">${statLine(key, lv)}</div>
        ${un ? `<div class="row-btns"><button class="btn btn-red ol" data-act="rm" data-k="${key}" ${n ? '' : 'disabled'} aria-label="Ta bort ${d.name}">−</button><button class="btn btn-green ol" data-act="add" data-k="${key}" ${s.gold >= d.cost && used + d.space <= cap ? '' : 'disabled'}><span class="cost">+ ${d.cost} ${COIN}</span></button></div>`
          : `<span class="lockmsg">${LOCK} Lås upp: kapa ${d.unlock} skepp</span>`}
      </div>`;
    }
    const h = D.hero, hl = s.levels.kapten || 1;
    html += `<div class="ucard"><canvas width="200" height="160" data-p="kapten"></canvas><span class="lvpip ol">Nv ${hl}</span><h3>${h.name}</h3><span class="role">${h.role} · gratis</span><p class="desc">${h.desc}</p><div class="stats">${statLine('kapten', hl)}</div></div>`;
    html += '</div>';
    html += `<div class="cap"><div class="cap-row"><span>Drycker</span><span>${sUsed} / ${sCap}</span></div><div class="bar ${sUsed >= sCap ? 'full' : ''}"><i style="width:${(sUsed / sCap) * 100}%"></i></div></div><div class="grid">`;
    for (const key of Object.keys(D.spells)) {
      const d = D.spells[key], un = UI.unlocked(s, key), lv = s.levels[key] || 1, n = s.spells[key] || 0;
      html += `<div class="ucard ${un ? '' : 'locked'}"><canvas width="200" height="160" data-p="${key}"></canvas>
        ${un ? `<span class="have ol">x${n}</span>` : ''}<span class="lvpip ol">Nv ${lv}</span>
        <h3>${d.name}</h3><span class="role">${d.role}</span><p class="desc">${d.desc}</p><div class="stats">${statLine(key, lv)}</div>
        ${un ? `<div class="row-btns"><button class="btn btn-red ol" data-act="srm" data-k="${key}" ${n ? '' : 'disabled'} aria-label="Ta bort ${d.name}">−</button><button class="btn btn-green ol" data-act="sadd" data-k="${key}" ${s.gold >= d.cost && sUsed + d.space <= sCap ? '' : 'disabled'}><span class="cost">+ ${d.cost} ${COIN}</span></button></div>`
          : `<span class="lockmsg">${LOCK} Lås upp: kapa ${d.unlock} skepp</span>`}
      </div>`;
    }
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll('canvas[data-p]').forEach((cv) => portrait(cv, cv.dataset.p));
    body.onclick = (e) => {
      const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
      g.armyAction(b.dataset.act, b.dataset.k);
    };
  };
  UI.openArmy = (g) => UI.showPanel('Armélägret', (b) => UI.renderArmy(g, b));

  // ---------- smedja ----------
  UI.renderForge = function (g, body) {
    const s = g.save, L = s.harborLvl, caps = UI.captured(s);
    let html = '';
    const next = D.harbor[L];
    html += `<div class="ucard" style="grid-template-columns: 1fr; text-align:left"><h3>Piratfästet – nivå ${L}</h3>`;
    if (next) {
      const req = caps >= L;
      html += `<p class="desc">Nästa nivå: armé <b>${D.harbor[L - 1].army} → ${next.army}</b> platser, drycker <b>${D.harbor[L - 1].spells} → ${next.spells}</b>, och trupper kan uppgraderas till nivå <b>${Math.min(D.maxLevel, L + 2)}</b>.</p>`;
      html += req ? `<div class="row-btns" style="justify-content:flex-start"><button class="btn btn-green ol" data-act="harbor" ${s.gold >= next.cost ? '' : 'disabled'}><span class="cost">Bygg ut ${fmt(next.cost)} ${COIN}</span></button></div>`
        : `<span class="lockmsg">${LOCK} Kräver ${L} kapade skepp (du har ${caps})</span>`;
    } else html += '<p class="desc">Fästet är fullt utbyggt. Respekt!</p>';
    html += '</div><div class="sec-title">Uppgradera besättningen</div><div class="grid">';
    const keys = [...Object.keys(D.troops), 'kapten', ...Object.keys(D.spells)];
    for (const key of keys) {
      const d = UI.defOf(key), un = UI.unlocked(s, key), lv = s.levels[key] || 1;
      const max = lv >= D.maxLevel, capL = lv >= UI.levelCap(s);
      const cost = max ? 0 : UI.upCost(key, lv + 1);
      html += `<div class="ucard ${un ? '' : 'locked'}"><canvas width="200" height="160" data-p="${key}"></canvas><span class="lvpip ol">Nv ${lv}</span>
        <h3>${d.name}</h3><div class="stats">${statLine(key, lv)}</div>`;
      if (!un) html += `<span class="lockmsg">${LOCK} Lås upp: kapa ${d.unlock} skepp</span>`;
      else if (max) html += '<span class="sub">Max nivå</span>';
      else {
        html += `<div class="stats" style="color:#3aa357">Nivå ${lv + 1}: ${statLine(key, lv + 1)}</div>`;
        html += capL ? `<span class="lockmsg">${LOCK} Kräver Piratfästet nivå ${lv}</span>`
          : `<div class="row-btns"><button class="btn btn-orange ol" data-act="up" data-k="${key}" ${s.gold >= cost ? '' : 'disabled'}><span class="cost">${fmt(cost)} ${COIN}</span></button></div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll('canvas[data-p]').forEach((cv) => portrait(cv, cv.dataset.p));
    body.onclick = (e) => {
      const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
      if (b.dataset.act === 'harbor') g.upgradeHarbor();
      if (b.dataset.act === 'up') g.upgrade(b.dataset.k);
    };
  };
  UI.openForge = (g) => UI.showPanel('Smedjan', (b) => UI.renderForge(g, b));

  // ---------- hemma-HUD ----------
  let shownGold = -1;
  UI.updateHome = function (g, force) {
    const s = g.save;
    if (force || shownGold !== s.gold) { $('gold').textContent = fmt(s.gold); shownGold = s.gold; }
    $('rep').textContent = Object.values(s.stars).reduce((a, b) => a + b, 0);
    $('army-mini').textContent = `Armé ${UI.armyUsed(s)}/${UI.armyCap(s)}`;
    const use = $('btn-sound').querySelector('use');
    use.setAttribute('href', s.muted ? '#i-mute' : '#i-sound');
  };
  UI.bump = function (id) { const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); };

  // ---------- strids-HUD ----------
  UI.buildBattleCards = function (g) {
    const bt = g.battle, wrap = $('b-cards');
    const keys = [...Object.keys(D.troops).filter((k) => bt.pool.troops[k] > 0), 'kapten', ...Object.keys(D.spells).filter((k) => bt.pool.spells[k] > 0)];
    wrap.innerHTML = keys.map((k) => {
      const d = UI.defOf(k), cls = D.spells[k] ? 'spell' : k === 'kapten' ? 'hero' : '';
      return `<button class="card ${cls}" data-k="${k}"><canvas width="144" height="140"></canvas><span class="cnt ol"></span><span class="lvl ol">${g.save.levels[k] || 1}</span><span class="nm ol">${d.name}</span></button>`;
    }).join('');
    wrap.querySelectorAll('.card').forEach((c) => portrait(c.querySelector('canvas'), c.dataset.k));
    wrap.onclick = (e) => {
      const c = e.target.closest('.card'); if (!c) return;
      const k = c.dataset.k;
      if (bt.remaining(k) <= 0) { K.sfx.play('error'); return; }
      bt.selected = k; K.sfx.play('click');
      UI.updateBattle(g, true);
    };
    const ab = $('b-ability');
    portrait(ab.querySelector('canvas'), 'kapten');
    $('b-ship').textContent = bt.def.name;
    $('b-loot-max').textContent = '/ ' + fmt(bt.lootTotal);
    $('b-stars').querySelectorAll('svg').forEach((sv) => sv.classList.remove('on'));
    UI._bstate = {};
  };

  UI.updateBattle = function (g, force) {
    const bt = g.battle, st = UI._bstate || (UI._bstate = {});
    const set = (k, v, fn) => { if (force || st[k] !== v) { st[k] = v; fn(v); } };
    $('b-cards').querySelectorAll('.card').forEach((c) => {
      const k = c.dataset.k, n = bt.remaining(k);
      set('n' + k, n, (v) => { c.querySelector('.cnt').textContent = k === 'kapten' ? (v ? '1' : '0') : 'x' + v; c.classList.toggle('empty', v <= 0); });
      set('s' + k, bt.selected === k, (v) => c.classList.toggle('sel', v));
    });
    const left = bt.started ? Math.max(0, bt.maxTime - bt.elapsed) : bt.maxTime;
    const txt = `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
    set('timer', txt, (v) => { $('b-timer').textContent = v; $('b-timer').classList.toggle('low', left < 30 && bt.started); });
    set('pct', bt.pct, (v) => { $('b-pct').textContent = v + ' %'; });
    set('loot', Math.floor(g.lootShown), (v) => { $('b-loot').textContent = fmt(v); });
    set('started', bt.started, (v) => { $('b-end').textContent = v ? 'Avsluta' : 'Tillbaka'; });
    const h = bt.heroUnit;
    set('ab', !!(h && h.hp > 0 && h.state === 'deck' && !bt.abilityUsed && !bt.ended), (v) => { $('b-ability').hidden = !v; });
  };

  UI.starOn = function (n) {
    const sv = $('b-stars').querySelectorAll('svg')[n - 1];
    if (sv) sv.classList.add('on');
  };

  // ---------- resultat ----------
  UI.showResult = function (g, res, def) {
    const win = res.stars > 0;
    $('res-title').textContent = win ? 'SEGER! · GUUL!' : 'NEDERLAG';
    $('res-title').classList.toggle('lose', !win);
    const stars = $('res-stars').querySelectorAll('svg');
    stars.forEach((sv, i) => { sv.classList.remove('on'); sv.style.animationDelay = (0.35 + i * 0.4) + 's'; if (i < res.stars) setTimeout(() => { sv.classList.add('on'); K.sfx.play('star'); }, 350 + i * 400); });
    $('res-pct').textContent = `${res.pct} % förstört`;
    const lootEl = $('res-loot');
    lootEl.textContent = '0';
    const t0 = performance.now(), dur = 1100;
    const tick = (now) => { const f = Math.min(1, (now - t0) / dur); lootEl.textContent = '+' + fmt(res.loot * (1 - Math.pow(1 - f, 3))); if (f < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    const cap = $('res-capture');
    if (res.firstCapture) {
      cap.hidden = false;
      cap.innerHTML = `<b>SKEPPET ÄR KAPAT!</b><canvas width="440" height="260"></canvas><span>${def.name} har anslutit sig till din flotta och ger <b style="font-size:inherit">+${def.income} guld/min</b>. Kaparbonus: +${fmt(res.bonus)} guld.</span>`;
      A.shipThumb(cap.querySelector('canvas'), def, true);
    } else if (res.captured) {
      cap.hidden = false;
      cap.innerHTML = `<span>Bryggan intogs igen! Skeppet finns redan i din flotta.</span>`;
    } else if (!win) {
      cap.hidden = false;
      cap.innerHTML = `<span>Tips: förstör hälften av skeppet eller ta kommandobryggan för att vinna. Bombare spränger barrikader och Bjässar tål mycket stryk.</span>`;
    } else cap.hidden = true;
    const used = Object.keys(res.used).filter((k) => res.used[k] > 0).map((k) => `${res.used[k]} ${D.troops[k].name.toLowerCase()}`);
    const usedS = Object.keys(res.usedSpells).filter((k) => res.usedSpells[k] > 0).map((k) => `${res.usedSpells[k]} ${D.spells[k].name.toLowerCase()}`);
    $('res-used').textContent = used.length || usedS.length ? 'Förbrukat: ' + used.concat(usedS).join(', ') : '';
    $('result').hidden = false;
    K.sfx.play(win ? 'win' : 'lose');
  };
})();

</script>
<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Är det roligt att kapa skepp med Clash-liknande anfall?
// Date: 2026-10-22
//
// Spelets huvudloop: sparning, scener (titel / hamn / strid), inmatning och kamera.
(function () {
  const K = window.K, D = K.DATA, G = K.gfx, A = K.art, UI = K.ui;
  const $ = (id) => document.getElementById(id);
  const SAVE_KEY = 'kaparna-save-v1';

  function defaultSave() {
    const levels = {};
    for (const k of [...Object.keys(D.troops), 'kapten', ...Object.keys(D.spells)]) levels[k] = 1;
    return { v: 1, gold: D.start.gold, harborLvl: 1, levels, army: Object.assign({}, D.start.army), spells: {}, captured: {}, stars: {}, fleet: {}, tut: {}, muted: false };
  }
  function loadSave() {
    const s = defaultSave();
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (o && o.v === 1) {
          for (const k of Object.keys(s)) if (o[k] !== undefined) s[k] = typeof s[k] === 'object' && !Array.isArray(s[k]) ? Object.assign(s[k], o[k]) : o[k];
        }
      }
    } catch (e) { /* ingen lagring – spela ändå */ }
    s.harborLvl = Math.max(1, Math.min(D.harbor.length, s.harborLvl | 0 || 1));
    return s;
  }

  const Game = {
    scene: 'title', t: 0, coins: [], lootShown: 0, harborSel: null,
    init() {
      this.cv = $('cv'); this.ctx = this.cv.getContext('2d');
      this.save = loadSave();
      K.sfx.muted = !!this.save.muted;
      this.camHome = new G.Camera(); this.camBattle = new G.Camera();
      this.cw = innerWidth; this.ch = innerHeight;
      this.harbor = new K.Harbor(this, this.isPortrait());
      this.resize();
      addEventListener('resize', () => this.resize());
      addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));
      if (window.visualViewport) visualViewport.addEventListener('resize', () => this.resize());
      this.bindInput();
      this.bindUI();
      UI.updateHome(this, true);
      this.last = performance.now();
      requestAnimationFrame((ts) => this.loop(ts));
    },
    persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.save)); } catch (e) { /* ignorera */ } },

    applyDpr() {
      this.dpr = Math.min(this.maxDpr || 2, devicePixelRatio || 1);
      this.cv.width = Math.round(this.cw * this.dpr); this.cv.height = Math.round(this.ch * this.dpr);
    },
    isPortrait() { return this.ch > this.cw * 1.05; },
    // stående mobil -> skeppet står upp ('tall'); liggande skärm -> klassisk diagonal vy ('iso')
    battleView() { return this.isPortrait() ? 'tall' : 'iso'; },
    resize() {
      const w = innerWidth, h = innerHeight;
      if (this._sized && w === this.cw && h === this.ch) return;
      this._sized = true;
      this.cw = w; this.ch = h;
      this.applyDpr();
      const portrait = this.isPortrait();
      if (this.harbor && this.harbor.portrait !== portrait) { this.harbor = new K.Harbor(this, portrait); }
      this.fitHome();
      if (this.battle) { this.bView = this.battleView(); this.fitBattle(); }
    },
    // b = område som ska synas från början, clampB = hur långt man får panorera
    fit(cam, b, padTop, padBottom, maxZ = 1.6, clampB = null) {
      const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
      const aw = Math.max(100, this.cw - 20), ah = Math.max(100, this.ch - padTop - padBottom);
      const z = Math.max(0.22, Math.min(maxZ, Math.min(aw / bw, ah / bh)));
      cam.z = z; cam.min = z * 0.8; cam.max = Math.max(2, z * 2.8);
      cam.x = (b.x0 + b.x1) / 2; cam.y = (b.y0 + b.y1) / 2 + (padBottom - padTop) / 2 / z;
      cam.bounds = clampB || b;
      cam.clamp(cam.bounds);
    },
    fitHome() {
      G.setView('iso');
      const b = this.harbor.bounds();
      if (this.harbor.portrait) {
        // stående: fyll bredden, börja högst upp, panorera nedåt till flottan
        const z = Math.max(0.3, Math.min(1.1, (this.cw - 12) / (b.x1 - b.x0)));
        const cam = this.camHome;
        cam.z = z; cam.min = z * 0.85; cam.max = Math.max(2, z * 3);
        cam.x = (b.x0 + b.x1) / 2;
        cam.y = b.y0 + (this.ch / 2 - 56) / z;
        // få skepp: centrera i höjdled i stället för att lämna tomt hav längst ner
        const free = this.ch - 60 - 150;
        if ((b.y1 - b.y0) * z < free) cam.y = (b.y0 + b.y1) / 2 + (150 - 60) / 2 / z;
        cam.bounds = { x0: b.x0, x1: b.x1, y0: cam.y, y1: Math.max(cam.y, b.y1 - (this.ch / 2 - 150) / z) };
        cam.clamp(cam.bounds);
      } else this.fit(this.camHome, b, 24, 50, 1.25);
    },
    fitBattle() {
      G.setView(this.bView);
      const tall = this.bView === 'tall';
      const bd = A.shipBounds(this.battle.sh, tall ? 1.7 : 1.1);
      const short = this.ch < 520;
      const top = bd.y0 - 120 * G.ZK;
      this.fit(this.camBattle, { x0: bd.x0, x1: bd.x1, y0: top, y1: bd.y1 }, tall ? 74 : short ? 40 : 70, tall ? 118 : short ? 88 : 125, tall ? 1.4 : 1.5);
    },
    get cam() { return this.scene === 'battle' ? this.camBattle : this.camHome; },

    // ---------- scener ----------
    play() {
      K.sfx.init(); K.sfx.setMuted(this.save.muted); K.sfx.startMusic(); K.sfx.play('click');
      // på telefon: försök gå till helskärm (fungerar på Android; iPhone och inbäddade vyer säger nej, det gör inget)
      const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
      const el = document.documentElement;
      if (!standalone && matchMedia('(pointer: coarse)').matches && el.requestFullscreen && !document.fullscreenElement) {
        try { el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (e) { /* ignorera */ }
      }
      $('title').hidden = true;
      this.goHome();
    },
    goHome() {
      this.scene = 'home';
      this.battle = null;
      $('hud-battle').hidden = true; $('result').hidden = true; $('hud-home').hidden = false;
      this.harbor.refreshFleet();
      this.fitHome();
      UI.updateHome(this, true);
      this.homeHints();
    },
    homeHints() {
      const s = this.save, tut = s.tut;
      if (!tut.firstBattle) UI.hint('Tryck på ANFALL! för att välja ett skepp att kapa.');
      else if (UI.captured(s) && !tut.collected) UI.hint('Ditt kapade skepp tjänar guld. Tryck på guldbubblan ovanför skeppet!', true);
      else if (UI.armyUsed(s) === 0) UI.hint('Armén är tom! Rekrytera pirater i Armélägret innan nästa anfall.');
      else UI.hint(null);
    },
    tryAttack(def) {
      const used = UI.armyUsed(this.save) + UI.spellUsed(this.save);
      if (used === 0) {
        UI.confirm('Tom armé', 'Du har inga trupper – bara Kaptenen följer med. Vill du anfalla ändå?', 'Anfall', () => this.startBattle(def));
        return;
      }
      this.startBattle(def);
    },
    startBattle(def) {
      UI.closePanel(); UI.hint(null);
      this.battle = new K.Battle(def, this.save);
      this.bView = this.battleView();
      this.scene = 'battle';
      this.lootShown = 0; this.coins = [];
      $('hud-home').hidden = true; $('hud-battle').hidden = false; $('result').hidden = true;
      this.fitBattle();
      UI.buildBattleCards(this);
      UI.updateBattle(this, true);
      $('b-banner').textContent = this.save.tut.firstBattle ? 'Välj en pirat och tryck på vattnet runt skeppet' : 'Välj en pirat nedan och tryck på vattnet runt skeppet. Håll inne för att skicka flera!';
      this.save.tut.firstBattle = 1; this.persist();
      K.sfx.play('alarm');
    },
    endBattle(res) {
      const s = this.save, bt = this.battle, def = bt.def;
      if (res) {
        s.gold += res.loot;
        for (const k in res.used) s.army[k] = Math.max(0, (s.army[k] || 0) - res.used[k]);
        for (const k in res.usedSpells) s.spells[k] = Math.max(0, (s.spells[k] || 0) - res.usedSpells[k]);
        if (res.stars > (s.stars[def.id] || 0)) s.stars[def.id] = res.stars;
        if (res.firstCapture) { s.captured[def.id] = true; s.fleet[def.id] = Date.now(); }
        this.persist();
      }
      setTimeout(() => { if (this.battle === bt) UI.showResult(this, res, def); }, 1100);
    },

    // ---------- ekonomi ----------
    armyAction(act, key) {
      const s = this.save;
      if (act === 'add') {
        const d = D.troops[key];
        if (UI.armyUsed(s) + d.space > UI.armyCap(s)) { UI.toast('Armélägret är fullt!'); K.sfx.play('error'); return; }
        if (s.gold < d.cost) { UI.toast('Inte tillräckligt med guld'); K.sfx.play('error'); return; }
        s.gold -= d.cost; s.army[key] = (s.army[key] || 0) + 1; K.sfx.play('train');
      } else if (act === 'rm') {
        if (!s.army[key]) return;
        s.army[key]--; s.gold += D.troops[key].cost; K.sfx.play('click');
      } else if (act === 'sadd') {
        const d = D.spells[key];
        if (UI.spellUsed(s) + d.space > UI.spellCap(s)) { UI.toast('Inga fler dryckesplatser'); K.sfx.play('error'); return; }
        if (s.gold < d.cost) { UI.toast('Inte tillräckligt med guld'); K.sfx.play('error'); return; }
        s.gold -= d.cost; s.spells[key] = (s.spells[key] || 0) + 1; K.sfx.play('heal');
      } else if (act === 'srm') {
        if (!s.spells[key]) return;
        s.spells[key]--; s.gold += D.spells[key].cost; K.sfx.play('click');
      }
      this.persist(); UI.refreshPanel(); UI.updateHome(this); this.homeHints();
    },
    upgrade(key) {
      const s = this.save, lv = s.levels[key] || 1;
      if (lv >= UI.levelCap(s)) return;
      const cost = UI.upCost(key, lv + 1);
      if (s.gold < cost) { UI.toast('Inte tillräckligt med guld'); K.sfx.play('error'); return; }
      s.gold -= cost; s.levels[key] = lv + 1;
      K.sfx.play('upgrade'); UI.toast(`${UI.defOf(key).name} är nu nivå ${lv + 1}!`);
      this.persist(); UI.refreshPanel(); UI.updateHome(this);
    },
    upgradeHarbor() {
      const s = this.save, next = D.harbor[s.harborLvl];
      if (!next || UI.captured(s) < s.harborLvl) return;
      if (s.gold < next.cost) { UI.toast('Inte tillräckligt med guld'); K.sfx.play('error'); return; }
      s.gold -= next.cost; s.harborLvl++;
      K.sfx.play('upgrade'); UI.toast(`Piratfästet är nu nivå ${s.harborLvl}!`);
      this.persist(); UI.refreshPanel(); UI.updateHome(this);
    },
    collect(f) {
      const s = this.save, gold = this.harbor.shipGold(f);
      if (gold < 1) return;
      s.gold += gold; s.fleet[f.def.id] = Date.now(); s.tut.collected = 1;
      const [X, Y] = this.harbor.bubblePos(f);
      const [sx, sy] = this.camHome.toScreen(X, Y, this.cw, this.ch);
      this.spawnCoins(Math.min(14, 3 + Math.round(gold / 40)), sx, sy, $('gold-pill'), () => UI.updateHome(this));
      K.sfx.play('coin');
      UI.toast(`+${UI.fmt(gold)} guld från ${f.def.name.toLowerCase()}`);
      this.persist(); this.homeHints();
    },

    // ---------- flygande mynt (skärmkoordinater) ----------
    spawnCoins(n, sx, sy, el, onArrive) {
      const r = el.getBoundingClientRect();
      const tx = r.left + 14, ty = r.top + r.height / 2;
      for (let i = 0; i < n; i++) {
        this.coins.push({ x0: sx + (Math.random() - 0.5) * 30, y0: sy + (Math.random() - 0.5) * 20, x1: tx, y1: ty, cx: (sx + tx) / 2 + (Math.random() - 0.5) * 160, cy: Math.min(sy, ty) - 60 - Math.random() * 80, t: -i * 0.05, dur: 0.55 + Math.random() * 0.25, el, cb: i === n - 1 ? onArrive : null, rot: Math.random() * 6 });
      }
    },
    drawCoins(dt) {
      if (!this.coins.length) return;
      const ctx = this.ctx;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      for (const c of this.coins) {
        c.t += dt; c.rot += dt * 12;
        if (c.t < 0) continue;
        const f = Math.min(1, c.t / c.dur), e = f * f * (3 - 2 * f);
        const x = (1 - e) * (1 - e) * c.x0 + 2 * (1 - e) * e * c.cx + e * e * c.x1;
        const y = (1 - e) * (1 - e) * c.y0 + 2 * (1 - e) * e * c.cy + e * e * c.y1;
        const s = 1.2 - e * 0.4, sx = Math.abs(Math.cos(c.rot)) * 7 + 1.5;
        G.blob(ctx, x, y, sx * s, 8 * s, '#ffcf3a', G.OUT, 2);
        if (f >= 1) { c.done = true; UI.bump(c.el.id); if (c.cb) c.cb(); }
      }
      this.coins = this.coins.filter((c) => !c.done);
    },

    // ---------- loop ----------
    loop(ts) {
      const raw = Math.max(0, (ts - this.last) / 1000);
      const dt = Math.min(0.05, raw);
      this.last = ts; this.t += dt;
      // sänk upplösningen om enheten inte orkar (~35 fps eller sämre i två sekunder)
      if (raw < 0.25 && !document.hidden) {
        this.ftAvg = (this.ftAvg || 0.016) * 0.97 + raw * 0.03;
        this.slowT = this.ftAvg > 0.029 ? (this.slowT || 0) + raw : 0;
        if (this.slowT > 2 && this.dpr > 1) { this.maxDpr = Math.max(1, this.dpr - 0.5); this.slowT = 0; this.ftAvg = 0.016; this.applyDpr(); }
      }
      try { this.frame(dt); } catch (e) { console.error(e); if (this.ctx.reset) this.ctx.reset(); }
      requestAnimationFrame((t2) => this.loop(t2));
    },
    frame(dt) {
      const { ctx, cw, ch, dpr } = this;
      if (this.scene === 'battle' && this.battle) {
        const bt = this.battle;
        G.setView(this.bView);
        this.holdDeploy();
        bt.update(dt);
        this.battleEvents();
        this.camBattle.update(dt);
        bt.render(ctx, this.camBattle, cw, ch, dpr, this.t);
        this.lootShown += (bt.loot - this.lootShown) * Math.min(1, dt * 6);
        if (Math.abs(bt.loot - this.lootShown) < 1) this.lootShown = bt.loot;
        UI.updateBattle(this);
      } else {
        G.setView('iso');
        this.harbor.update(dt);
        this.camHome.update(dt);
        this.harbor.render(ctx, this.camHome, cw, ch, dpr, this.t);
        if (this.scene === 'home' && (this._hudT = (this._hudT || 0) + dt) > 1) { this._hudT = 0; UI.updateHome(this); }
      }
      this.drawCoins(dt);
    },

    battleEvents() {
      const bt = this.battle;
      for (const ev of bt.events) {
        switch (ev.type) {
          case 'start':
            $('b-banner').textContent = 'Ta kommandobryggan för att kapa skeppet!';
            setTimeout(() => { if (this.battle === bt) $('b-banner').textContent = ''; }, 3500);
            break;
          case 'star': UI.starOn(ev.n); break;
          case 'capture':
            UI.bigMsg('SKEPPET KAPAT!<small>Kommandobryggan är er!</small>');
            K.sfx.play('capture'); K.sfx.lastBuzz = 0; K.sfx.buzz([40, 60, 90]);
            break;
          case 'shake': this.camBattle.shake = Math.max(this.camBattle.shake, ev.amt); break;
          case 'coin': {
            const [X, Y] = G.P(ev.x, ev.y, ev.z);
            const [sx, sy] = this.camBattle.toScreen(X, Y + bt.bob(), this.cw, this.ch);
            this.spawnCoins(1, sx, sy, $('loot-pill'));
            break;
          }
          case 'end': this.endBattle(ev.result); break;
          case 'leave': this.goHome(); break;
        }
      }
      bt.events.length = 0;
    },

    // ---------- inmatning ----------
    bindInput() {
      const cv = this.cv, ptrs = new Map();
      let drag = null, pinch = null;
      this._ptrs = ptrs;
      const clampCam = (cam) => cam.clamp(cam.bounds);
      cv.addEventListener('pointerdown', (e) => {
        if (this.scene === 'title') return;
        K.sfx.init();
        try { cv.setPointerCapture(e.pointerId); } catch (er) { /* */ }
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const cam = this.cam;
        if (ptrs.size === 1) drag = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, held: false, t0: performance.now(), last: 0, slop: e.pointerType === 'touch' ? 14 : 8 };
        else if (ptrs.size === 2) {
          if (drag) drag.moved = true;
          const [a, b] = [...ptrs.values()];
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.z, iso: cam.toIso(mx, my, this.cw, this.ch) };
        }
      });
      cv.addEventListener('pointermove', (e) => {
        if (!ptrs.has(e.pointerId)) return;
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const cam = this.cam;
        if (ptrs.size >= 2 && pinch) {
          const [a, b] = [...ptrs.values()];
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
          cam.z = Math.max(cam.min, Math.min(cam.max, (pinch.z * d) / pinch.d));
          cam.x = pinch.iso[0] - (mx - this.cw / 2) / cam.z; cam.y = pinch.iso[1] - (my - this.ch / 2) / cam.z;
          clampCam(cam);
        } else if (drag) {
          drag.x = e.clientX; drag.y = e.clientY;
          const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
          if (!drag.moved && !drag.held && Math.hypot(dx, dy) > (drag.slop || 10)) drag.moved = true;
          if (drag.moved && !drag.held) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; clampCam(cam); }
        }
      });
      const up = (e) => {
        if (!ptrs.has(e.pointerId)) return;
        ptrs.delete(e.pointerId);
        if (ptrs.size < 2) pinch = null;
        if (ptrs.size === 0) {
          if (drag && !drag.moved && !drag.held && e.type === 'pointerup') this.tap(e.clientX, e.clientY);
          drag = null;
        } else if (drag) { const [p] = [...ptrs.values()]; const cam = this.cam; drag = { sx: p.x, sy: p.y, x: p.x, y: p.y, cx: cam.x, cy: cam.y, moved: true, held: false, t0: 0 }; }
      };
      cv.addEventListener('pointerup', up);
      cv.addEventListener('contextmenu', (e) => e.preventDefault());
      cv.addEventListener('pointercancel', up);
      cv.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (this.scene === 'title') return;
        const cam = this.cam;
        cam.zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY, this.cw, this.ch);
        clampCam(cam);
      }, { passive: false });
      this._drag = () => drag;
    },

    holdDeploy() {
      const drag = this._drag && this._drag();
      const bt = this.battle;
      if (!drag || drag.moved || this._ptrs.size !== 1 || !bt || bt.ended) return;
      const sel = bt.selected;
      if (!sel || D.spells[sel]) return;
      // fortsätt bara med samma trupp som hållningen började med
      if (drag.key && drag.key !== sel) return;
      const now = performance.now();
      if (now - drag.t0 < 260) return;
      if (now - drag.last < 110) return;
      drag.last = now; drag.key = sel;
      const r = this.deployAt(drag.x, drag.y, true);
      if (r === 'ok' || drag.held) drag.held = true;
      if (r !== 'ok') drag.held = true;
    },

    tap(sx, sy) {
      if (this.scene === 'battle') { this.deployAt(sx, sy, false); return; }
      if (this.scene !== 'home') return;
      const [X, Y] = this.camHome.toIso(sx, sy, this.cw, this.ch);
      const hit = this.harbor.hit(X, Y);
      if (!hit) return;
      K.sfx.play('click');
      if (hit.type === 'collect') this.collect(hit.f);
      else if (hit.type === 'fort' || hit.type === 'forge') UI.openForge(this);
      else if (hit.type === 'camp') UI.openArmy(this);
      else if (hit.type === 'ship') UI.toast(`${hit.f.def.name}: +${hit.f.def.income} guld/min (max ${UI.fmt(hit.f.def.cap)})`);
    },

    deployAt(sx, sy, quiet) {
      const bt = this.battle;
      if (!bt || bt.ended) return 'ended';
      G.setView(this.bView);
      const sel = bt.selected;
      if (!sel) { if (!quiet) UI.toast('Du har inga trupper kvar'); return 'none'; }
      const [X, Y0] = this.camBattle.toIso(sx, sy, this.cw, this.ch);
      const Y = Y0 - bt.bob();
      const [dx, dy] = G.isoToWorld(X, Y, 0);
      if (D.spells[sel]) {
        const r = bt.castSpell(sel, dx, dy);
        if (r !== 'ok' && !quiet) { K.sfx.play('error'); }
        else if (r === 'ok') K.sfx.buzz(20);
        return r;
      }
      // på mobilen räcker det att trycka nära relingen: skiffen kommer till närmaste sida
      const RAIL = 2.4;
      if (K.ship.inPoly(bt.sh.poly, dx, dy)) {
        const c = K.ship.closestOnPoly(bt.sh.poly, dx, dy);
        if (c.d <= RAIL) {
          const r = bt.deploy(sel, c.x + c.nx * 2.2, c.y + c.ny * 2.2);
          return this.afterDeploy(r, sel, quiet);
        }
      }
      if (K.ship.inPoly(bt.sh.poly, dx, dy)) {
        const tx = dx | 0, ty = dy | 0;
        const oi = tx >= 0 && ty >= 0 && tx < bt.W && ty < bt.H ? bt.sh.occ[ty * bt.W + tx] : -1;
        if (!quiet) {
          if (oi >= 0 && bt.buildings[oi].alive) {
            const b = bt.buildings[oi];
            bt.inspect = { b, t: 2.5 };
            UI.toast(`${b.def.name} – ${Math.ceil(b.hp)} liv${b.def.range ? ` · räckvidd ${b.def.range}` : ''}${b.lootLeft > 1 ? ` · ${UI.fmt(b.lootLeft)} guld` : ''}`);
          } else UI.toast('Tryck i vattnet eller nära relingen!');
          bt.deployFail = { x: dx, y: dy, t: 0.7 };
          bt.zoneFlash = 1.6;
          K.sfx.play('error');
        }
        return 'deck';
      }
      const [wx, wy] = G.isoToWorld(X, Y, -A.HULL);
      return this.afterDeploy(bt.deploy(sel, wx, wy), sel, quiet);
    },
    afterDeploy(r, sel, quiet) {
      if (r === 'empty' && !quiet) { UI.toast('Slut på den truppen – välj en annan'); K.sfx.play('error'); }
      if (r === 'ok') { K.sfx.buzz(8); if (sel === 'kapten') UI.toast('Kaptenen är på väg!'); }
      return r;
    },

    bindUI() {
      $('btn-play').onclick = () => this.play();
      $('btn-attack').onclick = () => { K.sfx.play('click'); UI.hint(null); UI.openMap(this); };
      $('btn-army').onclick = () => { K.sfx.play('click'); UI.openArmy(this); };
      $('btn-forge').onclick = () => { K.sfx.play('click'); UI.openForge(this); };
      $('btn-sound').onclick = () => { this.save.muted = !this.save.muted; K.sfx.init(); K.sfx.setMuted(this.save.muted); this.persist(); UI.updateHome(this, true); };
      $('panel-close').onclick = () => { K.sfx.play('click'); UI.closePanel(); this.homeHints(); };
      $('panel').addEventListener('pointerdown', (e) => { if (e.target === $('panel')) { UI.closePanel(); this.homeHints(); } });
      $('b-end').onclick = () => {
        const bt = this.battle; if (!bt || bt.ended) return;
        K.sfx.play('click');
        if (!bt.started) { bt.surrender(); return; }
        UI.confirm('Avsluta striden?', 'Du behåller bytet du redan tagit. Trupper som inte satts ut går tillbaka till armén.', 'Avsluta', () => { if (this.battle === bt && !bt.ended) bt.surrender(); });
      };
      $('b-ability').onclick = () => { if (this.battle && this.battle.useAbility()) UI.bigMsg('STRIDSROP!', 1400); };
      $('res-home').onclick = () => { K.sfx.play('click'); this.goHome(); };
      addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { if (!$('confirm').hidden) $('confirm').hidden = true; else if (UI.panelOpen()) { UI.closePanel(); this.homeHints(); } }
      });
    },
  };

  // Offline-stöd när spelet ligger på en riktig webbadress (inte som lokal fil eller inbäddat)
  try {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.self === window.top && document.querySelector('link[rel="manifest"]')) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  } catch (e) { /* inbäddad vy */ }

  K.game = Game;
  window.KAPARNA = { game: Game, simulate: K.simulate, reset() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* */ } location.reload(); } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => Game.init());
  else Game.init();
})();

</script>
<!--/SCRIPTS-->
</body>
