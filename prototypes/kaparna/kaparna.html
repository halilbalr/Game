<style>
/* PROTOTYPE - NOT FOR PRODUCTION

:root {
  --ink: #1d1526;
  --sea: #0d5f7e;
  --sea-deep: #083d52;
  --parch: #f7e8c4;
  --parch-dark: #e4c98f;
  --parch-text: #4a2c12;
  --wood: #a8743e;
  --wood-dark: #6e4521;
  --gold: #ffcf3a;
  --gold-deep: #c98a00;
  --white: #ffffff;
  --shade: rgba(14, 10, 22, .55);
  --g1: #9be85a; --g2: #47a51a;
  --r1: #ff8a6a; --r2: #d02f17;
  --b1: #7fd0ff; --b2: #1f79d0;
  --o1: #ffc06a; --o2: #e0730f;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sea-deep); color: var(--white); }

canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.ol {
  color: var(--white);
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink),
    1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 3.5px 0 var(--ink);
}

/* ---------- knappar ---------- */
.btn {

  font-family: var(--f-display); font-size: 18px; letter-spacing: .02em; line-height: 1.1;
  padding: 9px 16px 11px; border: 3px solid var(--ink); border-radius: 14px; cursor: pointer;
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -5px 0 rgba(0,0,0,.2), 0 4px 0 var(--ink);
  transition: transform .07s, box-shadow .07s, filter .15s;
}
.btn:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.2), 0 1px 0 var(--ink); }
.btn:disabled { filter: grayscale(.9) brightness(.85); cursor: default; }
.btn:focus-visible, .btn-attack:focus-visible, .card:focus-visible, .btn-icon:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
.btn-green { --c1: var(--g1); --c2: var(--g2); }
.btn-red { --c1: var(--r1); --c2: var(--r2); }
.btn-blue { --c1: var(--b1); --c2: var(--b2); }
.btn-orange { --c1: var(--o1); --c2: var(--o2); }
.btn-xl { font-size: 34px; padding: 14px 46px 18px; border-radius: 20px; }
.btn .cost { display: inline-flex; align-items: center; gap: 4px; }
.btn .cost svg { width: 18px; height: 18px; }

/* ---------- titel ---------- */
.screen.title {
  position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(ellipse at 50% 40%, rgba(8,61,82,.15), rgba(8,40,56,.75));
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  text-align: center;
}
.logo { display: grid; justify-items: center; gap: 2px; transform: rotate(-3deg); animation: float 3.2s ease-in-out infinite; }
.logo-word {
  font-family: var(--f-display); font-size: clamp(56px, 13vw, 128px); line-height: .95; letter-spacing: .02em;
  color: var(--gold);
  text-shadow: 0 4px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 9px 0 var(--ink), 0 14px 18px rgba(0,0,0,.35);
}
.logo-sub { font-family: var(--f-display); font-size: clamp(18px, 3.6vw, 30px); color: #bfe9ff; }
.title-hint { margin: 0; max-width: 34ch; font-size: 16px; color: #e7f6ff; text-shadow: 0 2px 0 rgba(0,0,0,.5); text-wrap: balance; }
@keyframes float { 0%,100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(-2deg) translateY(-8px); } }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.hud > * { pointer-events: auto; }
.hud-top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.pill {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 40px; min-width: 110px;
  background: var(--shade); border: 3px solid var(--ink); border-radius: 12px; font-family: var(--f-display); font-size: 21px;
  font-variant-numeric: tabular-nums;
}
.pill .pi { position: absolute; left: -10px; top: 50%; width: 44px; height: 44px; transform: translateY(-50%); filter: drop-shadow(0 2px 0 var(--ink)); }
.pill span { font-family: var(--f-body); font-size: 12px; color: #d8cfe8; text-transform: uppercase; letter-spacing: .08em; }
.pill.small { height: 30px; font-size: 18px; padding-left: 34px; min-width: 0; }
.pill.small .pi { width: 36px; height: 36px; left: -8px; }
.pill.bump { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.12); } }

.hud-bl { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); display: grid; justify-items: center; gap: 6px; }
.btn-attack {
  width: 104px; height: 104px; border-radius: 50%; border: 4px solid var(--ink); cursor: pointer; padding: 0;
  background: radial-gradient(circle at 40% 30%, #ffe08a, #ffb020 55%, #d0700a);
  box-shadow: inset 0 5px 0 rgba(255,255,255,.5), inset 0 -7px 0 rgba(0,0,0,.22), 0 5px 0 var(--ink), 0 10px 18px rgba(0,0,0,.35);
  display: grid; place-items: center; align-content: center; gap: 0; transition: transform .07s;
  animation: pulse 2.4s ease-in-out infinite;
}
.btn-attack:active { transform: translateY(3px) scale(.97); }
.btn-attack .sw { width: 54px; height: 54px; filter: drop-shadow(0 2px 0 var(--ink)); }
.btn-attack span { font-family: var(--f-display); font-size: 19px; margin-top: -4px; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.mini { font-family: var(--f-display); font-size: 15px; background: var(--shade); border: 2px solid var(--ink); border-radius: 10px; padding: 2px 10px; }

.hud-br { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: flex-end; }
.btn.round { display: grid; justify-items: center; gap: 0; width: 82px; padding: 6px 4px 9px; border-radius: 18px; font-size: 16px; }
.btn.round svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.btn-icon { position: absolute; right: max(14px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 50px); width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--ink); background: var(--shade); cursor: pointer; padding: 6px; }
.btn-icon svg { width: 100%; height: 100%; }

.hint {
  position: absolute; left: max(130px, calc(env(safe-area-inset-left) + 130px)); bottom: max(46px, calc(env(safe-area-inset-bottom) + 46px)); max-width: min(300px, calc(100vw - 160px));
  background: var(--parch); color: var(--parch-text); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.3;
  box-shadow: 0 4px 0 rgba(0,0,0,.35); animation: hintbob 1.6s ease-in-out infinite; pointer-events: none;
}
.hint::after { content: ""; position: absolute; left: -14px; bottom: 18px; border: 9px solid transparent; border-right: 12px solid var(--ink); }
.hint.top { left: 50%; bottom: auto; top: max(70px, calc(env(safe-area-inset-top) + 70px)); transform: translateX(-50%); animation: none; }
.hint.top::after { display: none; }
@keyframes hintbob { 50% { transform: translateX(6px); } }

/* ---------- strid ---------- */
.b-tl { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); display: grid; gap: 8px; justify-items: start; pointer-events: none; }
.b-ship { font-family: var(--f-display); font-size: 22px; }
.b-tr { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); display: grid; justify-items: end; gap: 2px; pointer-events: none; }
.b-timer { font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.b-timer.low { color: #ff8a6a; }
.b-stars { display: flex; gap: 2px; }
.b-stars svg, .res-stars svg { width: 30px; height: 30px; fill: #3d3550; filter: drop-shadow(0 2px 0 var(--ink)); transition: fill .2s; }
.b-stars svg.on { fill: var(--gold); animation: starpop .5s cubic-bezier(.3,1.8,.5,1); }
@keyframes starpop { 0% { transform: scale(2.6) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
.b-pct { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.b-banner {
  position: absolute; top: max(64px, calc(env(safe-area-inset-top) + 64px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px);
  text-align: center; font-family: var(--f-display); font-size: 18px; line-height: 1.25; padding: 8px 16px; border-radius: 12px; background: var(--shade); border: 3px solid var(--ink);
  pointer-events: none; transition: opacity .3s; text-wrap: balance;
}
.b-banner:empty { opacity: 0; }
.b-bottom {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 10px; pointer-events: none;
  padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  background: linear-gradient(0deg, rgba(8,20,30,.55), rgba(8,20,30,0));
}
.b-bottom > * { pointer-events: auto; }
#b-end { flex: none; margin-bottom: 6px; font-size: 16px; padding: 8px 12px 10px; }
.cards { display: flex; gap: 8px; overflow-x: auto; overflow-y: visible; padding: 14px 4px 4px; min-width: 0; scrollbar-width: none; }
.cards::-webkit-scrollbar { display: none; }
.card {
  position: relative; flex: none; width: 72px; height: 90px; border: 3px solid var(--ink); border-radius: 12px; padding: 0; cursor: pointer; overflow: visible;
  background: #2a2340; box-shadow: 0 4px 0 var(--ink); transition: transform .12s;
}
.card canvas { width: 100%; height: 70px; display: block; border-radius: 9px 9px 0 0; }
.card .cnt { position: absolute; top: -10px; left: -6px; font-family: var(--f-display); font-size: 16px; background: #2a2340; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
.card .lvl { position: absolute; bottom: 22px; left: 4px; font-family: var(--f-display); font-size: 12px; background: #6c4bd1; border: 2px solid var(--ink); border-radius: 6px; padding: 0 4px; }
.card .nm { display: block; font-family: var(--f-display); font-size: 12.5px; line-height: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.card.sel { transform: translateY(-10px); border-color: #fff; box-shadow: 0 0 0 3px var(--ink), 0 0 18px 4px rgba(255,220,90,.85), 0 8px 0 var(--ink); }
.card.spell { background: #4a2a52; }
.card.hero { background: #5a2a24; }
.card.empty { filter: grayscale(1) brightness(.6); cursor: default; }
.ability {
  position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 118px);
  width: 86px; border: 3px solid var(--ink); border-radius: 50% 50% 16px 16px; padding: 6px 4px 6px; cursor: pointer; display: grid; justify-items: center;
  background: radial-gradient(circle at 50% 30%, #ffe08a, #e0730f); box-shadow: 0 4px 0 var(--ink), 0 0 20px rgba(255,200,60,.8); animation: pulse 1.2s infinite;
}
.ability canvas { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--ink); }
.ability span { font-family: var(--f-display); font-size: 14px; }

.big-msg {
  position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 15; pointer-events: none; text-align: center;
  font-family: var(--f-display); font-size: clamp(36px, 8vw, 72px); color: var(--gold); white-space: nowrap;
  text-shadow: 0 4px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 8px 0 var(--ink);
}
.big-msg small { display: block; font-size: .38em; color: var(--white); }
.big-msg.show { animation: bigpop 2.4s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes bigpop { 0% { transform: translate(-50%,-50%) scale(.2); opacity: 0; } 12% { transform: translate(-50%,-50%) scale(1.12); opacity: 1; } 20% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%,-62%) scale(1); opacity: 0; } }

/* ---------- paneler ---------- */
.panel-wrap {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(6,18,28,.6);
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.panel {
  width: min(820px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background: var(--parch); color: var(--parch-text); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: inset 0 0 0 5px var(--parch-dark), 0 8px 0 rgba(0,0,0,.4); animation: pop .24s cubic-bezier(.3,1.6,.6,1);
}
.panel.small { width: min(420px, 100%); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.panel header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 18px; background: linear-gradient(180deg, var(--wood), var(--wood-dark)); border-bottom: 3px solid var(--ink); }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: .02em; }
.btn-x { width: 40px; height: 40px; border: 3px solid var(--ink); border-radius: 12px; cursor: pointer; font-size: 20px; background: linear-gradient(180deg, var(--r1), var(--r2)); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), 0 3px 0 var(--ink); }
.panel-body { overflow-y: auto; padding: 14px; display: grid; gap: 12px; overscroll-behavior: contain; touch-action: pan-y; }
.panel-body p { margin: 0; }
.sub { font-size: 14px; color: #7a5a3a; font-weight: 800; }
.sec-title { font-family: var(--f-display); font-size: 19px; color: var(--parch-text); margin: 4px 0 -2px; letter-spacing: .02em; }

.cap { display: grid; gap: 6px; }
.cap-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: var(--f-display); font-size: 17px; }
.bar { height: 18px; border: 3px solid var(--ink); border-radius: 10px; background: #5d4630; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(180deg, #a5f06a, #4fb01e); box-shadow: inset 0 3px 0 rgba(255,255,255,.4); transition: width .2s; }
.bar.full > i { background: linear-gradient(180deg, #ffd36b, #e08a0f); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ucard {
  position: relative; display: grid; gap: 6px; align-content: start; padding: 8px; border: 3px solid var(--ink); border-radius: 14px;
  background: #fff6dd; box-shadow: 0 3px 0 rgba(0,0,0,.25); min-width: 0;
}
.ucard canvas { width: 100%; aspect-ratio: 1.25; height: auto; max-width: 100%; border: 2px solid var(--ink); border-radius: 10px; display: block; }
.ucard h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--parch-text); }
.ucard .role { font-size: 12.5px; color: #8a6a44; text-transform: uppercase; letter-spacing: .06em; }
.ucard .desc { font-size: 13px; line-height: 1.3; color: #5b3d22; font-weight: 700; }
.ucard .stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: #5b3d22; font-variant-numeric: tabular-nums; }
.ucard .stats b { color: var(--parch-text); }
.ucard .have { position: absolute; top: 12px; right: 12px; font-family: var(--f-display); font-size: 20px; background: #2a2340; border: 2px solid var(--ink); border-radius: 10px; padding: 0 8px; }
.ucard .lvpip { position: absolute; top: 12px; left: 12px; font-family: var(--f-display); font-size: 14px; background: #6c4bd1; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
.ucard .row-btns { display: flex; gap: 6px; }
.ucard .row-btns .btn { flex: 1; font-size: 16px; padding: 6px 6px 8px; }
.ucard.locked canvas { filter: grayscale(1) brightness(.6); }
.ucard .lockmsg { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8a3a1a; }
.ucard .lockmsg svg { width: 20px; height: 20px; flex: none; }

.ship-card { display: grid; grid-template-columns: 190px 1fr; gap: 12px; padding: 10px; border: 3px solid var(--ink); border-radius: 14px; background: #fff6dd; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.ship-card canvas { width: 190px; height: 120px; max-width: 100%; border: 2px solid var(--ink); border-radius: 10px; background: linear-gradient(#1a87a3, #0d5f7e); display: block; }
.ship-card .info { display: grid; gap: 5px; align-content: start; min-width: 0; }
.ship-card h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 21px; color: var(--parch-text); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.ship-card .tier { font-size: 13px; font-family: var(--f-body); background: #6c4bd1; color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
.ship-card .tag-cap { font-size: 13px; font-family: var(--f-body); background: #3aa357; color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
.ship-card .story { font-size: 14px; line-height: 1.35; color: #5b3d22; font-weight: 700; }
.ship-card .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: #5b3d22; }
.ship-card .facts b { color: var(--parch-text); }
.ship-card .act { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-top: 2px; }
.ship-card .mstars { display: flex; gap: 1px; }
.ship-card .mstars svg { width: 22px; height: 22px; fill: #c9b48a; }

.ship-card.locked { filter: saturate(.3); opacity: .8; }
.ship-card .lockmsg { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #8a3a1a; }
.ship-card .lockmsg svg { width: 22px; height: 22px; }
.army-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; padding: 10px; border: 3px dashed #b99a62; border-radius: 14px; }

.row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.confirm-text { font-size: 16px; line-height: 1.4; text-align: center; }

/* ---------- resultat ---------- */
.result { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(20,10,30,.35), rgba(6,10,20,.85)); padding: 16px; }
.res-box { display: grid; justify-items: center; gap: 12px; text-align: center; animation: pop .3s cubic-bezier(.3,1.6,.6,1); max-width: 100%; }
.ribbon {
  position: relative; font-family: var(--f-display); font-size: clamp(40px, 9vw, 64px); padding: 6px 48px 10px; border: 4px solid var(--ink); border-radius: 12px;
  background: linear-gradient(180deg, #ffd36b, #e08a0f); box-shadow: inset 0 4px 0 rgba(255,255,255,.45), 0 6px 0 var(--ink);
}

.res-stars svg { width: 70px; height: 70px; }
.res-stars svg:nth-child(2) { width: 88px; height: 88px; }
.res-stars svg.on { fill: var(--gold); animation: starpop .55s cubic-bezier(.3,1.8,.5,1) both; }
.res-pct { font-family: var(--f-display); font-size: 22px; }
.res-loot { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 36px; }
.res-loot .pi { width: 44px; height: 44px; }
.res-capture { max-width: 440px; background: var(--parch); color: var(--parch-text); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 16px; font-size: 16px; line-height: 1.35; display: grid; justify-items: center; gap: 6px; }
.res-capture b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: #3aa357; }
.res-capture canvas { width: 220px; height: 130px; max-width: 100%; border: 2px solid var(--ink); border-radius: 10px; background: linear-gradient(#1a87a3, #0d5f7e); }
.res-used { font-size: 14px; color: #d8cfe8; max-width: 440px; }

.toast {
  position: fixed; left: 50%; top: max(110px, calc(env(safe-area-inset-top) + 110px)); transform: translate(-50%, -10px); z-index: 40; pointer-events: none;
  font-family: var(--f-display); font-size: 18px; padding: 8px 16px; border-radius: 12px; background: rgba(20,12,30,.85); border: 3px solid var(--ink);
  opacity: 0; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
  .ship-card { grid-template-columns: 1fr; }
  .ship-card canvas { width: 100%; height: auto; aspect-ratio: 19 / 12; }
  .btn-attack { width: 88px; height: 88px; }
  .btn-attack .sw { width: 44px; height: 44px; }
  .btn.round { width: 70px; font-size: 14px; }
  .btn.round svg { width: 32px; height: 32px; }
  .pill { font-size: 18px; min-width: 90px; }
  .b-ship { font-size: 17px; }
  .card { width: 62px; height: 80px; }
  .card canvas { height: 60px; }
  .hint { left: 116px; }
  .b-banner { top: max(96px, calc(env(safe-area-inset-top) + 96px)); font-size: 15px; }
  .toast { top: max(180px, calc(env(safe-area-inset-top) + 180px)); font-size: 16px; }
}
@media (max-height: 460px) {
  .btn-attack { width: 80px; height: 80px; }
  .btn-attack .sw { width: 40px; height: 40px; }
  .btn-attack span { font-size: 16px; }
  .res-stars svg { width: 48px; height: 48px; }
  .res-stars svg:nth-child(2) { width: 60px; height: 60px; }
  .ribbon { font-size: 36px; }
  .res-box { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .logo, .btn-attack, .ability, .hint { animation: none; }
}

      ctx.quadraticCurveTo(L * 0.6, 1.4, 1.5, 1.5); ctx.closePath();
      ctx.fillStyle = G.col('#e9f1f7'); ctx.fill(); ctx.lineWidth = 1.3; ctx.strokeStyle = OUT; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, -0.4); ctx.quadraticCurveTo(L * 0.6, -1.4, L - 1.5, -3.6);
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 0.9; ctx.stroke();
      rr(ctx, 0, -3.2, 1.9, 6.4, 0.8); ctx.fillStyle = G.col(sp.gold ? '#ffcf3a' : '#d9a441'); ctx.fill(); ctx.lineWidth = 1.1; ctx.strokeStyle = OUT; ctx.stroke();
      rr(ctx, -4, -1.2, 4.2, 2.4, 1); ctx.fillStyle = G.col('#5a3416'); ctx.fill(); ctx.stroke();
    } else if (kind === 'dolk') {
      ctx.beginPath(); ctx.moveTo(1.5, -1.3); ctx.lineTo(9, 0); ctx.lineTo(1.5, 1.3); ctx.closePath();
      ctx.fillStyle = G.col('#dfe8ef'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
      rr(ctx, -2.5, -1.1, 4, 2.2, 1); ctx.fillStyle = G.col('#5a3416'); ctx.fill(); ctx.stroke();
    } else if (kind === 'batong') {
      rr(ctx, -2, -1.3, 13, 2.6, 1.2); ctx.fillStyle = G.col('#22252c'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
    } else if (kind === 'ankare') {
      G.thick(ctx, [0, 0], [17, 0], G.col('#8d99a6'), 3.4);
      G.thick(ctx, [2.5, -4.5], [2.5, 4.5], G.col('#8d99a6'), 2.6);
      ctx.beginPath(); ctx.arc(-1.8, 0, 2.3, 0, Math.PI * 2); ctx.lineWidth = 2.2; ctx.strokeStyle = G.col('#8d99a6'); ctx.stroke();
      ctx.beginPath(); ctx.arc(12.5, 0, 6, -1.35, 1.35); ctx.lineWidth = 6.2; ctx.strokeStyle = OUT; ctx.stroke();
      ctx.lineWidth = 3.4; ctx.strokeStyle = G.col('#8d99a6'); ctx.stroke();
      for (const s of [-1, 1]) {
        const ax = 12.5 + Math.cos(1.35 * s) * 6, ay = Math.sin(1.35 * s) * 6;
        G.poly(ctx, [[ax - 1.5, ay], [ax - 4, ay + 2.6 * s], [ax + 1.8, ay + 0.6 * s]], G.col('#a9b4bf'), OUT, 1.2);
      }
    }
  }

  // Ritar en figur med fötterna i (X, Y) (iso-pixlar). u: {type, facing, walk, moving, atkAnim, skin, flash, air, squash, rage, slow, scale}
  A.unit = function (ctx, u, X, Y, t) {
    const sp = SPEC[u.type] || SPEC.kampe;
    const s = sp.s * (u.scale || 1);
    if (!u.noShadow) G.shadow(ctx, X, Y, 9 * s, 4.2 * s, 0.28);
    if (u.rage > 0) {
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, 16 * s);
      g.addColorStop(0, 'rgba(255,80,220,.55)'); g.addColorStop(1, 'rgba(255,80,220,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(X, Y, 16 * s, 8 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    ctx.translate(X, Y - (u.air || 0));
    const sq = u.squash || 1;
    ctx.scale((u.facing || 1) * s * sq, s / sq);
    G.flash = u.flash > 0 ? Math.min(1, u.flash * 7) : 0;
    body(ctx, sp, u, t);
    G.flash = 0;
    ctx.restore();
  };

  function body(ctx, sp, u, t) {
    const moving = u.moving, w = u.walk || 0;
    const bob = moving ? -Math.abs(Math.sin(w)) * 2.2 : Math.sin(t * 3 + (u.id || 0)) * 0.5;
    const l1 = moving ? Math.sin(w) * 3.2 : 0;
    const lift1 = moving ? Math.max(0, Math.cos(w)) * 1.8 : 0;
    const lift2 = moving ? Math.max(0, -Math.cos(w)) * 1.8 : 0;
    const bw = sp.big ? 9.5 : sp.chubby ? 8.6 : sp.thin ? 6.4 : 7.5;
    const skin = u.skin || '#7a4a2a';
    const ap = u.atkAnim > 0 ? 1 - u.atkAnim / 0.35 : -1;
    const by = -15 + bob;

    leg(ctx, -2.6 - l1 * 0.6, lift2, sp.pants);
    leg(ctx, 2.6 + l1 * 0.6, lift1, sp.pants);

    if (sp.sack) {
      G.blob(ctx, -7, by - 1, 6, 6.8, G.col('#9a6b3c'));
      G.blob(ctx, -7, by - 7.5, 2.2, 1.4, G.col('#7a4f28'), OUT, 1);
      G.blob(ctx, -8.5, by + 1, 1.6, 1.6, G.col('#ffd23f'), OUT, 0.8);
    }
    // bakre arm
    if (sp.weapon !== 'bomb') G.blob(ctx, -bw + 0.6, by + 3, 2.7, 2.7, G.col(skin), OUT, 1.3);

    if (sp.coat) G.poly(ctx, [[-bw - 0.5, by - 2], [bw + 0.5, by - 2], [bw + 2.5, by + 11], [-bw - 2.5, by + 11]], G.col(sp.shirt, -0.12), OUT, 1.4);
    G.blob(ctx, 0, by, bw, 7.4, G.col(sp.shirt), OUT, 1.5);
    if (sp.stripe || sp.vest) {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, by, bw - 0.6, 6.8, 0, 0, Math.PI * 2); ctx.clip();
      if (sp.stripe) { ctx.fillStyle = G.col(sp.stripe); for (let i = 0; i < 4; i++) ctx.fillRect(-bw, by - 6.5 + i * 3.8, 2 * bw, 1.7); }
      if (sp.vest) { ctx.fillStyle = G.col(sp.vest); ctx.fillRect(-bw, by - 8, bw * 0.95, 16); ctx.fillRect(bw * 0.38, by - 8, bw, 16); }
      ctx.restore();
    }
    if (sp.coat) {
      G.blob(ctx, 3, by - 2.5, 1.2, 1.2, G.col('#ffcf3a'), OUT, 0.8);
      G.blob(ctx, 3, by + 1.5, 1.2, 1.2, G.col('#ffcf3a'), OUT, 0.8);
      ctx.strokeStyle = G.col('#ffcf3a'); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-bw - 2.2, by + 10.5); ctx.lineTo(bw + 2.2, by + 10.5); ctx.stroke();
    }
    if (sp.collar) G.poly(ctx, [[-4, by - 6.8], [5, by - 6.8], [0.5, by - 2]], G.col(sp.collar), OUT, 1.1);
    ctx.fillStyle = G.col('#3b2412'); ctx.fillRect(-bw + 0.9, by + 2.6, 2 * bw - 1.8, 2.4);
    ctx.fillStyle = G.col('#f2c14e'); ctx.fillRect(0.6, by + 2.3, 3, 3);

    // huvud
    const hr = sp.big ? 7.8 : 8.6, hx = 1.6, hy = by - 11.2;
    if (sp.weapon === 'bomb') for (const sx of [-1, 1]) G.thick(ctx, [sx * (bw - 2.5), by - 4], [1.5 + sx * 8.5, hy - hr - 4], G.col(skin), 4);
    if (sp.head === 'bandana') {
      const fl = Math.sin(t * 9 + (u.id || 0)) * 1.5;
      G.poly(ctx, [[hx - hr + 1.5, hy - 4], [hx - hr - 6, hy - 6 + fl], [hx - hr - 4.5, hy - 1.5 + fl], [hx - hr + 1.5, hy - 1.8]], G.col(sp.hat), OUT, 1.2);
    }
    if (sp.head === 'tricorn') {
      ctx.beginPath(); ctx.moveTo(hx - 3, hy - 11); ctx.quadraticCurveTo(hx - 12, hy - 22, hx - 18, hy - 14);
      ctx.quadraticCurveTo(hx - 10, hy - 15, hx - 1, hy - 9); ctx.closePath();
      ctx.fillStyle = G.col('#ffffff'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
    }
    if (sp.head === 'turban') G.poly(ctx, [[hx - hr + 1, hy - 3], [hx - hr - 4, hy + 4], [hx - hr + 2, hy + 1]], G.col(sp.hat, -0.06), OUT, 1.1);

    G.blob(ctx, hx, hy, hr, hr, G.col(skin), OUT, 1.6);
    G.blob(ctx, hx - 3.6, hy + 0.6, 1.8, 2.3, G.col(skin, -0.14), OUT, 1.1);
    if (sp.gold) G.blob(ctx, hx - 3.4, hy + 3.4, 1, 1, G.col('#ffcf3a'), OUT, 0.6);

    if (sp.beard) {
      ctx.beginPath(); ctx.ellipse(hx + 2.4, hy + 5, 6, 4.2, 0, 0, Math.PI);
      ctx.lineTo(hx - 3.6, hy + 2.5); ctx.closePath();
      ctx.fillStyle = G.col(sp.beard); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
    }
    // ansikte
    G.blob(ctx, hx + 8.3, hy + 0.9, 1.7, 1.4, G.col(skin, -0.1), OUT, 1);
    for (const ex of [hx + 2.7, hx + 6.2]) {
      G.blob(ctx, ex, hy - 0.4, 1.9, 2.4, '#ffffff', OUT, 1);
      G.blob(ctx, ex + 0.75, hy - 0.2, 1.1, 1.3, '#16121c', null);
    }
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx + 0.9, hy - 3.8); ctx.lineTo(hx + 4.1, hy - 2.6);
    ctx.moveTo(hx + 5.0, hy - 2.7); ctx.lineTo(hx + 8.1, hy - 3.9); ctx.stroke();
    if (ap >= 0 || u.yell) {
      G.blob(ctx, hx + 5, hy + 4.2, 2.2, 1.9, '#5a1414', OUT, 1);
      ctx.fillStyle = '#fff'; ctx.fillRect(hx + 3.6, hy + 2.6, 2.8, 0.9);
    } else {
      ctx.beginPath(); ctx.moveTo(hx + 3.2, hy + 3.5); ctx.quadraticCurveTo(hx + 5.2, hy + 5.4, hx + 7.4, hy + 3.2);
      ctx.lineWidth = 1.3; ctx.stroke();
    }

    // huvudbonad
    if (sp.head === 'bandana') {
      ctx.beginPath(); ctx.arc(hx, hy, hr + 0.7, Math.PI, Math.PI * 2);
      ctx.quadraticCurveTo(hx, hy - 3.4, hx - hr - 0.7, hy); ctx.closePath();
      ctx.fillStyle = G.col(sp.hat); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = OUT; ctx.stroke();
      if (sp.dots) { ctx.fillStyle = 'rgba(255,255,255,.85)'; for (const [dx, dy] of [[-3, -5.5], [2, -6.6], [5.6, -4.2]]) { ctx.beginPath(); ctx.arc(hx + dx, hy + dy, 1, 0, 7); ctx.fill(); } }
    } else if (sp.head === 'turban') {
      ctx.beginPath(); ctx.ellipse(hx - 0.3, hy - 5, hr + 1.8, 5.8, 0, 0, Math.PI * 2);
      ctx.fillStyle = G.col(sp.hat); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = OUT; ctx.stroke();
      ctx.strokeStyle = G.col(sp.hat, -0.25); ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(hx - 0.3, hy - 4, hr + 0.6, 3.2, -0.15, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(hx - 0.3, hy - 7, hr - 1, 2.6, 0.15, 0.3, Math.PI - 0.3); ctx.stroke();
    } else if (sp.head === 'bald') {
      G.blob(ctx, hx + 2, hy - 5, 2.6, 1.6, 'rgba(255,255,255,.35)', null);
    } else if (sp.head === 'tricorn') {
      G.blob(ctx, hx, hy - 6.3, hr + 5, 3.6, G.col('#1f1a24'), OUT, 1.5);
      ctx.beginPath(); ctx.arc(hx, hy - 6.5, hr * 0.82, Math.PI, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = G.col('#1f1a24'); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(hx, hy - 6.3, hr + 4, 2.6, 0, 0.1, Math.PI - 0.1);
      ctx.strokeStyle = G.col('#ffcf3a'); ctx.lineWidth = 1.3; ctx.stroke();
      G.blob(ctx, hx + 2, hy - 10.2, 1.8, 1.6, '#f4f4f4', OUT, 0.8);
    } else if (sp.head === 'cap') {
      ctx.beginPath(); ctx.arc(hx, hy - 1, hr + 0.4, Math.PI, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = G.col(sp.hat); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = OUT; ctx.stroke();
      G.blob(ctx, hx + hr * 0.7, hy - 1.4, 6, 1.8, G.col(sp.hat, -0.3), OUT, 1.2);
      G.blob(ctx, hx + 1, hy - 5.5, 1.4, 1.4, G.col('#ffcf3a'), OUT, 0.8);
    } else if (sp.head === 'sailor') {
      G.blob(ctx, hx, hy - 6.8, hr + 1, 3, G.col(sp.hat), OUT, 1.4);
      ctx.strokeStyle = G.col('#2c5aa0'); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(hx, hy - 6, hr, 1.6, 0, 0.15, Math.PI - 0.15); ctx.stroke();
    }

    // främre arm + vapen
    if (sp.weapon === 'bomb') {
      const bxp = 1.5, byp = hy - hr - 8.5;
      G.blob(ctx, bxp, byp, 7.5, 7.2, G.col('#2a2a33'), OUT, 1.6);
      G.blob(ctx, bxp - 2.4, byp - 2.6, 2.2, 1.6, 'rgba(255,255,255,.45)', null);
      ctx.beginPath(); ctx.moveTo(bxp + 3, byp - 6); ctx.quadraticCurveTo(bxp + 6, byp - 11, bxp + 9, byp - 10);
      ctx.strokeStyle = G.col('#c9a26b'); ctx.lineWidth = 1.6; ctx.stroke();
      const f = 2 + Math.sin(t * 40) * 1.2;
      G.blob(ctx, bxp + 9, byp - 10, f + 1, f + 1, '#ffd23f', null);
      G.blob(ctx, bxp + 9, byp - 10, f * 0.5, f * 0.5, '#ffffff', null);
      for (const sx of [-1, 1]) G.blob(ctx, bxp + sx * 8.5, byp + 4.5, 2.7, 2.7, G.col(skin), OUT, 1.2);
      return;
    }
    const shx = 2.5, shy = by - 4;
    let ang;
    if (sp.weapon === 'musket') ang = 0.4;
    else {
      ang = 1.05 + (moving ? Math.sin(w) * 0.25 : 0);
      if (ap >= 0) ang = ap < 0.4 ? lerp(1.05, -2.0, ap / 0.4) : lerp(-2.0, 1.3, Math.min(1, (ap - 0.4) / 0.25));
    }
    const al = 7.5;
    const hxp = shx + Math.cos(ang) * al, hyp = shy + Math.sin(ang) * al;
    G.thick(ctx, [shx, shy], [hxp, hyp], G.col(skin), 4.2);
    ctx.save();
    if (sp.weapon === 'musket') {
      const rec = ap >= 0 && ap < 0.3 ? (1 - ap / 0.3) : 0;
      ctx.translate(hxp - 2 - rec * 2, hyp);
      ctx.rotate(-0.12 - rec * 0.25);
      G.poly(ctx, [[-10, -0.6], [2, -2.2], [2, 2], [-10, 3.6]], G.col('#7a4a24'), OUT, 1.2);
      rr(ctx, 2, -2.4, 17, 2.6, 1); ctx.fillStyle = G.col('#4a5560'); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = OUT; ctx.stroke();
      if (rec > 0.3) {
        ctx.fillStyle = '#fff3a0';
        ctx.beginPath(); ctx.moveTo(19, -1); ctx.lineTo(26, -4); ctx.lineTo(23, -1); ctx.lineTo(27, 2); ctx.lineTo(19, 0.5); ctx.closePath(); ctx.fill();
      }
      G.blob(ctx, 6, 1.2, 2.5, 2.5, G.col(skin), OUT, 1.2);
    } else {
      ctx.translate(hxp, hyp);
      ctx.rotate(ang - 0.5);
      weapon(ctx, sp.weapon, sp, ap);
    }
    ctx.restore();
    G.blob(ctx, hxp, hyp, 2.7, 2.7, G.col(skin), OUT, 1.3);
    if (u.slow > 0) {
      ctx.fillStyle = 'rgba(120,200,255,.9)';
      for (let i = 0; i < 3; i++) {
        const a = t * 4 + i * 2.1;
        ctx.beginPath(); ctx.arc(hx + Math.cos(a) * 10, hy - 6 + Math.sin(a * 1.3) * 3, 1.4, 0, 7); ctx.fill();
      }
    }
  }

  // Livsmätare
  A.hpBar = function (ctx, X, Y, frac, color, w = 26) {
    const h = 5;
    rr(ctx, X - w / 2 - 1.5, Y - 1.5, w + 3, h + 3, 3);
    ctx.fillStyle = 'rgba(20,14,28,.85)'; ctx.fill();
    if (frac > 0) {
      rr(ctx, X - w / 2, Y, Math.max(2, w * frac), h, 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(X - w / 2 + 1, Y + 0.6, Math.max(0, w * frac - 2), 1.4);
    }
  };

  A.crown = function (ctx, X, Y) {
    G.poly(ctx, [[X - 6, Y], [X - 6, Y - 6], [X - 3, Y - 3], [X, Y - 8], [X + 3, Y - 3], [X + 6, Y - 6], [X + 6, Y]], '#ffcf3a', OUT, 1.2);
  };

  // ---------- flaggor ----------
  A.flag = function (ctx, X, Y, colors, t, size = 1) {
    const w = 22 * size, h = 14 * size;
    G.thick(ctx, [X, Y + 2], [X, Y + 34 * size], '#d9dde2', 2.2 * size);
    G.blob(ctx, X, Y, 2.2 * size, 2.2 * size, '#ffcf3a', OUT, 1);
    const pts = [];
    const N = 7;
    for (let i = 0; i <= N; i++) { const f = i / N; pts.push([X + f * w, Y + 2 + Math.sin(t * 6 - f * 4) * 2.4 * f * size]); }
    const top = pts, bot = pts.map(([x, y]) => [x, y + h]).reverse();
    G.path(ctx, top.concat(bot));
    ctx.save(); ctx.clip();
    if (colors === 'pirate') {
      ctx.fillStyle = '#16121c'; ctx.fillRect(X - 2, Y - 6, w + 4, h + 14);
      const cx = X + w * 0.5, cy = Y + 2 + h * 0.5 + Math.sin(t * 6 - 2) * 1.2 * size;
      ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 1.6 * size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx - 6 * size, cy + 5 * size); ctx.lineTo(cx + 6 * size, cy - 1 * size);
      ctx.moveTo(cx + 6 * size, cy + 5 * size); ctx.lineTo(cx - 6 * size, cy - 1 * size); ctx.stroke();
      G.blob(ctx, cx, cy - 1 * size, 4 * size, 3.6 * size, '#f4f4f4', null);
      ctx.fillStyle = '#16121c';
      ctx.beginPath(); ctx.arc(cx - 1.5 * size, cy - 1.2 * size, 1 * size, 0, 7); ctx.arc(cx + 1.5 * size, cy - 1.2 * size, 1 * size, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = colors[0]; ctx.fillRect(X - 2, Y - 6, w + 4, h + 14);
      ctx.fillStyle = colors[1]; ctx.fillRect(X - 2, Y + 2 + h * 0.5 - 1, w + 4, h);
      G.blob(ctx, X + w * 0.32, Y + 2 + h * 0.5, 3 * size, 3 * size, colors[1], null);
    }
    ctx.restore();
    G.path(ctx, top.concat(bot)); ctx.lineWidth = 1.3; ctx.strokeStyle = OUT; ctx.stroke();
  };

  // ---------- skiff ----------
  A.skiff = function (ctx, sk, t, water) {
    const z = water + 2 + Math.sin(t * 3 + sk.seed) * 1.2;
    const c = Math.cos(sk.ang), s = Math.sin(sk.ang);
    const loc = [[0.85, 0], [0.35, 0.3], [-0.6, 0.3], [-0.72, 0.15], [-0.72, -0.15], [-0.6, -0.3], [0.35, -0.3]];
    const wp = (lx, ly, zz) => P(sk.x + lx * c - ly * s, sk.y + lx * s + ly * c, zz);
    if (sk.moving) {
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      G.path(ctx, [wp(-0.6, 0.32, water), wp(-1.8, 0.75, water), wp(-1.8, -0.75, water), wp(-0.6, -0.32, water)]); ctx.fill();
    }
    G.poly(ctx, loc.map(([x, y]) => wp(x * 1.05, y * 1.15, water)), 'rgba(255,255,255,.35)', null);
    G.poly(ctx, loc.map(([x, y]) => wp(x, y, z - 5)), G.col(sk.color || '#2f7fd1', -0.25), OUT, 1.4);
    G.poly(ctx, loc.map(([x, y]) => wp(x, y, z)), G.col('#f4f6f8'), OUT, 1.5);
    G.poly(ctx, loc.map(([x, y]) => wp(x * 0.82, y * 0.7, z)), G.col('#c9d3dc'), null);
    const m0 = wp(-0.72, 0, z), m1 = wp(-0.95, 0, z + 9);
    G.thick(ctx, m0, m1, '#2a2d34', 5);
    G.blob(ctx, m1[0], m1[1], 3.4, 3, '#2a2d34', OUT, 1.2);
    return wp(0.05, 0, z);
  };

  // ---------- partiklar ----------
  A.particle = function (ctx, p) {
    const [X, Y] = P(p.x, p.y, p.z);
    const f = p.life / p.max; // 1 -> 0
    switch (p.type) {
      case 'smoke': case 'dust': case 'poof': {
        const r = p.size * (1.6 - f * 0.6);
        ctx.globalAlpha = Math.min(1, f * 1.4) * (p.alpha || 0.8);
        G.blob(ctx, X, Y, r, r * 0.92, p.color, null);
        ctx.globalAlpha = 1; break;
      }
      case 'fire': {
        ctx.globalCompositeOperation = 'lighter';
        const r = p.size * (0.4 + f * 0.8);
        ctx.globalAlpha = f;
        G.blob(ctx, X, Y, r, r * 1.2, f > 0.5 ? '#ffd23f' : '#ff6a1c', null);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; break;
      }
      case 'flash': {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = f;
        const g = ctx.createRadialGradient(X, Y, 0, X, Y, p.size);
        g.addColorStop(0, 'rgba(255,250,200,1)'); g.addColorStop(0.4, 'rgba(255,190,60,.8)'); g.addColorStop(1, 'rgba(255,120,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, p.size, 0, 7); ctx.fill();
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; break;
      }
      case 'spark': {
        ctx.strokeStyle = p.color || '#ffd23f'; ctx.lineWidth = 2; ctx.globalAlpha = f;
        const [X2, Y2] = P(p.x - p.vx * 0.04, p.y - p.vy * 0.04, p.z - p.vz * 0.04);
        ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X2, Y2); ctx.stroke(); ctx.globalAlpha = 1; break;
      }
      case 'debris': {
        ctx.globalAlpha = Math.min(1, f * 3);
        ctx.save(); ctx.translate(X, Y); ctx.rotate(p.rot || 0);

  A.drum = function (ctx, X, Y, s = 1) {
    ctx.save(); ctx.translate(X, Y); ctx.scale(s, s);

    G.thick(ctx, [14, -30], [3, -19], '#d9a441', 2.6);

    G.blob(ctx, 14, -30, 2.4, 2.4, '#f4f4f4', OUT, 1);
    ctx.restore();

  // ---------- porträtt för kort och paneler ----------
  const PORTRAIT_BG = {
    kampe: ['#9fd8ff', '#3f88c9'], skytt: ['#a8f0c6', '#2f9e6b'], bombare: ['#ffc58a', '#d9622b'],
    bjasse: ['#e2c19a', '#8a6440'], plundrare: ['#ffe58a', '#8a4fd1'], kapten: ['#ffd36b', '#c0262d'],
    lakning: ['#fff1a8', '#d9a441'], raseri: ['#ffb3ef', '#a42f9a'],
  };
  A.portrait = function (cv, key) {
    const ctx = cv.getContext('2d');
    const w = cv.width, h = cv.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const [c0, c1] = PORTRAIT_BG[key] || ['#ddd', '#888'];
    const g = ctx.createRadialGradient(w / 2, h * 0.35, 2, w / 2, h / 2, w * 0.75);
    g.addColorStop(0, c0); g.addColorStop(1, c1);

    const sp = SPEC[key];
    const k = (h * 0.78) / (44 * sp.s) * (sp.weapon === 'bomb' ? 0.78 : 1);
    ctx.save();
    ctx.translate(w / 2 - 3 * k, h * 1.02);
    ctx.scale(k, k);
    A.unit(ctx, { type: key, facing: 1, skin: key === 'kapten' ? '#6b3f22' : '#7a4a2a', noShadow: true, id: 2 }, 0, 0, 0.3);
    ctx.restore();
  };
})();

// PROTOTYPE - NOT FOR PRODUCTION

(function () {

  const HULL = (A.HULL = 34); // skrovhöjd över vattnet (px)

  // Förberäknar kanter, normaler och skumkontur för ett skepp
  function prep(sh) {
    if (sh.edges) return;
    const pts = sh.poly, n = pts.length;
    sh.edges = [];
    const normals = [];
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      let nx = b[1] - a[1], ny = -(b[0] - a[0]);
      const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      if (K.ship.inPoly(pts, mx + nx * 0.03, my + ny * 0.03)) { nx = -nx; ny = -ny; }
      normals.push([nx, ny]);
      sh.edges.push({ a, b, nx, ny, len: l, vis: nx + ny > 0.02 });
    }

      const n0 = normals[(i - 1 + n) % n], n1 = normals[i];
      let nx = n0[0] + n1[0], ny = n0[1] + n1[1];
      const l = Math.hypot(nx, ny) || 1;
      return [p[0], p[1], nx / l, ny / l];
    });

    sh.posts = [];
    let acc = 0;
    for (const e of sh.edges) {
      let d = 0;
      while (acc + (e.len - d) >= 1) { d += 1 - acc; acc = 0; const f = d / e.len; sh.posts.push([e.a[0] + (e.b[0] - e.a[0]) * f, e.a[1] + (e.b[1] - e.a[1]) * f]); }
      acc += e.len - d;
    }
  }
  A.prepShip = prep;

  A.water = function (ctx, sh, t) {
    prep(sh);
    const z = -HULL;
    const ring = (d, wob) => sh.foam.map(([x, y, nx, ny], i) => P(x + nx * (d + Math.sin(t * 2 + i * 0.9) * wob), y + ny * (d + Math.sin(t * 2 + i * 0.9) * wob), z));
    G.poly(ctx, ring(0.7, 0.12), 'rgba(255,255,255,.14)', null);

  };

  A.hull = function (ctx, sh, t) {
    prep(sh);
    const pal = sh.def.pal;
    for (const e of sh.edges) {
      if (!e.vis) continue;
      const f = -0.05 - 0.35 * ((e.ny - e.nx + 1) / 2);
      const a0 = P(e.a[0], e.a[1], 0), b0 = P(e.b[0], e.b[1], 0);
      const a1 = P(e.a[0], e.a[1], -HULL), b1 = P(e.b[0], e.b[1], -HULL);

      G.poly(ctx, [a0, b0, b1, a1], G.col(pal.hull, f), null);
      G.poly(ctx, [a2, b2, b1, a1], G.col(pal.stripe, f), null);
      G.line(ctx, a2, b2, 'rgba(255,255,255,.7)', 1.6);
      // ljuskant upptill
      G.line(ctx, P(e.a[0], e.a[1], -3), P(e.b[0], e.b[1], -3), G.rgba('#ffffff', 0.18), 2);
      if (e.len > 1.4) {
        const k = Math.floor(e.len / 1.5);
        for (let i = 1; i <= k; i++) {
          const fr = i / (k + 1);
          const [X, Y] = P(e.a[0] + (e.b[0] - e.a[0]) * fr, e.a[1] + (e.b[1] - e.a[1]) * fr, -14);
          G.blob(ctx, X, Y, 2.6, 2.6, '#1d2a36', 'rgba(255,255,255,.35)', 1);

    for (const e of sh.edges) {
      if (!e.vis) continue;
      const a1 = P(e.a[0], e.a[1], -HULL), b1 = P(e.b[0], e.b[1], -HULL);

  A.deck = function (ctx, sh, t) {

    G.path(ctx, deckPts); ctx.clip();
    const W = sh.W, H = sh.H;
    ctx.strokeStyle = G.rgba(pal.deckLine, 0.55); ctx.lineWidth = 1;

    if (sh.def.deckType === 'steel') for (let x = 3; x < W; x += 3) { const a = P(x, -1, 0), b = P(x, H + 1, 0); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
    else {

      ctx.strokeStyle = G.rgba('#000000', 0.15); ctx.beginPath();
      for (let k = 1; k < w * 2; k++) { const a = P(x + k / 2, y + 0.2), b = P(x + k / 2, y + h - 0.2); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }

  B.utkik = function (ctx, b, sh, t) {
    const x0 = b.x + 0.3, y0 = b.y + 0.3, x1 = b.x + b.w - 0.3, y1 = b.y + b.h - 0.3;

  // Sprite-cache för byggnader utan animation: ritas en gång per zoomnivå och klistras sedan in.

  A.spriteScale = 0;
  const STATIC = new Set(['container', 'fisklada', 'ventil', 'livbat', 'helipad']);
  const spriteCache = new Map();
  function sprite(key, w, h, hgt, draw) {
    const sc = A.spriteScale;

    let sp = spriteCache.get(k);
    if (!sp) {
      if (spriteCache.size > 400) spriteCache.clear();
      const x0 = -h * G.HW - 12, x1 = w * G.HW + 12, y0 = -hgt - 18, y1 = (w + h) * G.HH + 12;
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.ceil((x1 - x0) * sc)); cv.height = Math.max(1, Math.ceil((y1 - y0) * sc));
      const c = cv.getContext('2d');
      c.setTransform(sc, 0, 0, sc, -x0 * sc, -y0 * sc);
      draw(c);
      sp = { cv, x0, y0, sc };
      spriteCache.set(k, sp);
    }

  }

      });
      blit(ctx, sp, b.x, b.y);
      return;

    f(ctx, b, sh, t, o);

  };

  // ---------- barrikader ----------
  A.wall = function (ctx, w, sh, t) {
    const alive = (xx, yy) => { if (xx < 0 || yy < 0 || xx >= sh.W || yy >= sh.H) return false; const i = sh.wallAt[yy * sh.W + xx]; return i >= 0 && sh.walls[i].alive; };
    const ax = alive(w.x + 1, w.y), ay = alive(w.x, w.y + 1), dmg = w.hp / w.maxHp < 0.5;
    if (A.spriteScale > 0 && !(w.flash > 0)) {

      return;

    wallDraw(ctx, w.x, w.y, ax, ay, dmg);
    G.flash = 0;
  };
  function wallDraw(ctx, x, y, ax, ay, dmg) {
    const col = dmg ? '#4a5058' : '#59616b';
    if (ax) G.box(ctx, x + 0.7, y + 0.36, x + 1.3, y + 0.64, 3, 12, '#7b8590', { lw: 1.2 });
    if (ay) G.box(ctx, x + 0.36, y + 0.7, x + 0.64, y + 1.3, 3, 12, '#7b8590', { lw: 1.2 });
    G.box(ctx, x + 0.22, y + 0.22, x + 0.78, y + 0.78, 0, 17, col, { topCol: '#f2c14e', top: 0 });
